version: '3.8'

services:
  janus-gateway:
    build: .
    container_name: janus-gateway
    hostname: janus-gateway
    ports:
      - "8088:8088"
      - "8188:8188"
      - "7088:7088"
      - "10000-10500:10000-10500/udp"
    volumes:
      - ./config:/usr/local/etc/janus
      - ./recordings:/usr/local/share/janus/recordings
      - ./logs:/var/log/janus
    environment:
      - TZ=Asia/Shanghai
    networks:
      - janus-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/janus/info"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  janus-admin:
    image: nginx:alpine
    container_name: janus-admin
    ports:
      - "8090:80"
    volumes:
      - ./admin-ui:/usr/share/nginx/html
    depends_on:
      - janus-gateway
    networks:
      - janus-network
    restart: unless-stopped

  coturn:
    image: coturn/coturn:latest
    container_name: janus-coturn
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/tcp"
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf
    command: -c /etc/coturn/turnserver.conf
    networks:
      - janus-network
    restart: unless-stopped

networks:
  janus-network:
    driver: bridge
