global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "kafka-mirror-rules.yml"

scrape_configs:
  - job_name: "kafka-mirror"
    static_configs:
      - targets: ["kafka-mirror:9090"]
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: "kafka-source"
    static_configs:
      - targets: ["kafka-source-jmx-exporter:9404"]
    scrape_interval: 30s

  - job_name: "kafka-target"
    static_configs:
      - targets: ["kafka-target-jmx-exporter:9404"]
    scrape_interval: 30s
