# Kafka MirrorMaker 2 Configuration
# Cluster aliases
clusters = source, target

# Source cluster configuration
source.bootstrap.servers = source-kafka-1:9092,source-kafka-2:9092
source.security.protocol = PLAINTEXT
source.sasl.mechanism = PLAIN
source.sasl.jaas.config = 

# Target cluster configuration
target.bootstrap.servers = target-kafka-1:9092,target-kafka-2:9092
target.security.protocol = PLAINTEXT
target.sasl.mechanism = PLAIN
target.sasl.jaas.config = 

# MirrorMaker 2 connector configuration
source->target.enabled = true
source->target.topics = orders,payments,notifications
source->target.topics.blacklist = .*[-.]internal,.*_dead_letter
source->target.groups = .*
source->target.sync.topic.acls.enabled = false
source->target.sync.group.offsets.enabled = true
source->target.sync.group.offsets.interval.seconds = 60
source->target.emit.checkpoints.enabled = true
source->target.emit.checkpoints.interval.seconds = 60
source->target.emit.heartbeats.enabled = true
source->target.heartbeats.topic.replication.factor = 3
source->target.checkpoints.topic.replication.factor = 3
source->target.offset-syncs.topic.replication.factor = 3

# Custom interceptor for filtering and loop prevention
source->target.consumer.interceptor.classes = com.kafkamirror.interceptor.FilterAndLoopPreventionInterceptor
source->target.producer.interceptor.classes = com.kafkamirror.interceptor.MarkerHeaderInterceptor

# Filter configuration
filter.key.regex = 
filter.value.regex = ^\\{.*\\}$
filter.topic.regex = 

# Loop prevention configuration (UUID + hop counter)
loop.prevention.enabled = true
loop.prevention.header_key = x-mirror-hop
loop.prevention.max_hops = 15

# Replication factor for mirrored topics
replication.factor = 3

# Number of tasks for the connector
tasks.max = 10

# Refresh interval for topic configuration
refresh.topics.interval.seconds = 300
refresh.groups.interval.seconds = 300

# Offset storage
offset.storage.topic = mm2-offsets
offset.storage.replication.factor = 3

# Configuration storage
config.storage.topic = mm2-configs
config.storage.replication.factor = 3

# Status storage
status.storage.topic = mm2-status
status.storage.replication.factor = 3

# Key and value converter
key.converter = org.apache.kafka.connect.converters.ByteArrayConverter
value.converter = org.apache.kafka.connect.converters.ByteArrayConverter

# Header converter
header.converter = org.apache.kafka.connect.storage.SimpleHeaderConverter

# Rest configuration
rest.port = 8083
rest.host.name = 0.0.0.0

# Producer configuration
producer.acks = all
producer.retries = 5
producer.batch.size = 16384
producer.linger.ms = 100
producer.buffer.memory = 33554432

# Consumer configuration
consumer.max.poll.records = 500
consumer.fetch.min.bytes = 1
consumer.fetch.max.wait.ms = 500
