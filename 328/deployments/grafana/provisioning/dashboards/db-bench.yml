apiVersion: 1

providers:
  - name: 'db-bench'
    orgId: 1
    folder: 'Database Benchmark'
    folderUid: 'db-bench-folder'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
