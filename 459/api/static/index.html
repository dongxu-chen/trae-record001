<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识图谱问答系统</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f1a; color: #e0e0e0; height: 100vh; overflow: hidden; }
.app { display: flex; height: 100vh; }
.sidebar { width: 380px; background: #1a1a2e; border-right: 1px solid #2a2a4a; display: flex; flex-direction: column; overflow-y: auto; }
.main { flex: 1; position: relative; }
.header { padding: 20px; border-bottom: 1px solid #2a2a4a; }
.header h1 { font-size: 18px; color: #64ffda; margin-bottom: 4px; }
.header p { font-size: 12px; color: #888; }
.section { padding: 16px; border-bottom: 1px solid #2a2a4a; }
.section h3 { font-size: 13px; color: #64ffda; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
.input-group { margin-bottom: 10px; }
.input-group label { display: block; font-size: 12px; color: #aaa; margin-bottom: 4px; }
.input-group input, .input-group textarea, .input-group select { width: 100%; padding: 8px 12px; background: #16213e; border: 1px solid #2a2a4a; border-radius: 6px; color: #e0e0e0; font-size: 13px; outline: none; transition: border-color 0.2s; }
.input-group input:focus, .input-group textarea:focus, .input-group select:focus { border-color: #64ffda; }
.input-group textarea { resize: vertical; min-height: 60px; }
.btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; transition: all 0.2s; }
.btn-primary { background: #64ffda; color: #0f0f1a; font-weight: 600; }
.btn-primary:hover { background: #4fd1b8; }
.btn-secondary { background: #2a2a4a; color: #e0e0e0; }
.btn-secondary:hover { background: #3a3a5a; }
.btn-small { padding: 4px 10px; font-size: 11px; }
.btn-row { display: flex; gap: 6px; flex-wrap: wrap; }
.answer-box { background: #16213e; border-radius: 8px; padding: 12px; margin-top: 8px; font-size: 13px; line-height: 1.6; }
.answer-box .label { color: #64ffda; font-weight: 600; margin-bottom: 4px; font-size: 11px; text-transform: uppercase; }
.clarification-box { background: #2a1a3e; border: 1px solid #9b59b6; border-radius: 8px; padding: 12px; margin-top: 8px; }
.clarification-box .clarification-question { color: #e0a0ff; margin-bottom: 8px; font-size: 13px; }
.clarification-options { display: flex; flex-direction: column; gap: 4px; }
.clarification-options button { text-align: left; padding: 6px 10px; background: #2a2a4a; border: 1px solid #3a3a5a; border-radius: 4px; color: #e0e0e0; cursor: pointer; font-size: 12px; transition: all 0.2s; }
.clarification-options button:hover { background: #3a3a5a; border-color: #9b59b6; }
.feedback-box { margin-top: 8px; }
.star-rating { display: flex; gap: 4px; margin-bottom: 6px; }
.star { cursor: pointer; font-size: 18px; color: #3a3a5a; transition: color 0.2s; }
.star.active, .star:hover { color: #f1c40f; }
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat-card { background: #16213e; border-radius: 6px; padding: 8px; text-align: center; }
.stat-card .stat-value { font-size: 20px; font-weight: 700; color: #64ffda; }
.stat-card .stat-label { font-size: 10px; color: #888; text-transform: uppercase; }
#graph-svg { width: 100%; height: 100%; }
.node { cursor: pointer; transition: opacity 0.3s; }
.node circle { stroke-width: 2px; transition: all 0.3s; }
.node.highlighted circle { stroke: #ffd700; stroke-width: 4px; filter: drop-shadow(0 0 8px #ffd700); }
.node text { font-size: 11px; fill: #e0e0e0; text-anchor: middle; pointer-events: none; }
.node.highlighted text { fill: #ffd700; font-weight: 700; }
.link { stroke: #3a3a5a; stroke-width: 1.5px; opacity: 0.6; transition: all 0.3s; }
.link.highlighted { stroke: #ffd700; stroke-width: 3px; opacity: 1; filter: drop-shadow(0 0 4px #ffd700); }
.link-label { font-size: 9px; fill: #888; pointer-events: none; }
.legend { position: absolute; top: 16px; right: 16px; background: rgba(26,26,46,0.9); border-radius: 8px; padding: 12px; border: 1px solid #2a2a4a; }
.legend h4 { font-size: 11px; color: #64ffda; margin-bottom: 8px; text-transform: uppercase; }
.legend-item { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; font-size: 11px; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; }
.path-info { position: absolute; bottom: 16px; left: 16px; right: 380px; background: rgba(26,26,46,0.9); border-radius: 8px; padding: 12px; border: 1px solid #ffd700; max-height: 120px; overflow-y: auto; }
.path-info h4 { color: #ffd700; font-size: 11px; margin-bottom: 4px; }
.path-info .path-text { font-size: 12px; color: #e0e0e0; line-height: 1.5; }
.path-step { display: inline; }
.path-arrow { color: #ffd700; margin: 0 4px; }
.path-node { color: #64ffda; font-weight: 600; }
.path-rel { color: #f39c12; font-size: 11px; }
.toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #64ffda; color: #0f0f1a; padding: 8px 20px; border-radius: 6px; font-size: 13px; font-weight: 600; z-index: 999; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="app">
<div class="sidebar">
<div class="header">
<h1>🧠 知识图谱问答系统</h1>
<p>v3.0 — 可视化 · 主动澄清 · 增量学习</p>
</div>
<div class="section">
<h3>💬 智能问答</h3>
<div class="input-group">
<label>输入问题</label>
<textarea id="question-input" placeholder="例如：感冒有什么症状？">感冒有什么症状？</textarea>
</div>
<div class="btn-row">
<button class="btn btn-primary" onclick="askQuestion()">🔍 提问</button>
<button class="btn btn-secondary" onclick="askWithClarification()">🤔 允许澄清</button>
</div>
<div id="answer-area"></div>
</div>
<div class="section">
<h3>🗺️ 图谱探索</h3>
<div class="input-group">
<label>中心实体</label>
<input id="explore-entity" placeholder="输入实体名称" value="感冒">
</div>
<div class="input-group">
<label>探索深度</label>
<select id="explore-depth">
<option value="1">1跳</option>
<option value="2" selected>2跳</option>
<option value="3">3跳</option>
</select>
</div>
<div class="btn-row">
<button class="btn btn-primary" onclick="exploreGraph()">🗺️ 探索</button>
<button class="btn btn-secondary" onclick="showFullGraph()">🌐 全图</button>
</div>
</div>
<div class="section">
<h3>📊 学习统计</h3>
<div id="stats-area" class="stats-grid"></div>
<div style="margin-top:8px">
<button class="btn btn-secondary btn-small" onclick="loadStats()">刷新统计</button>
<button class="btn btn-secondary btn-small" onclick="batchProcess()">处理反馈</button>
</div>
</div>
</div>
<div class="main" id="graph-container">
<svg id="graph-svg"></svg>
<div class="legend" id="legend"></div>
<div class="path-info" id="path-info" style="display:none"></div>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
const API_BASE = window.location.origin;
let currentGraph = null;
let simulation = null;

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
}

async function askQuestion() {
    const q = document.getElementById('question-input').value.trim();
    if (!q) return;
    const area = document.getElementById('answer-area');
    area.innerHTML = '<div class="answer-box"><span style="color:#888">思考中...</span></div>';

    try {
        const res = await fetch(`${API_BASE}/api/qa`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({question: q, skip_clarification: true})
        });
        const data = await res.json();
        renderAnswer(data);
        if (data.visualization) renderGraph(data.visualization);
    } catch(e) {
        area.innerHTML = `<div class="answer-box"><span style="color:#e74c3c">请求失败: ${e.message}</span></div>`;
    }
}

async function askWithClarification() {
    const q = document.getElementById('question-input').value.trim();
    if (!q) return;
    const area = document.getElementById('answer-area');
    area.innerHTML = '<div class="answer-box"><span style="color:#888">思考中...</span></div>';

    try {
        const res = await fetch(`${API_BASE}/api/qa`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({question: q, skip_clarification: false})
        });
        const data = await res.json();
        renderAnswer(data);
        if (data.visualization) renderGraph(data.visualization);
    } catch(e) {
        area.innerHTML = `<div class="answer-box"><span style="color:#e74c3c">请求失败: ${e.message}</span></div>`;
    }
}

function renderAnswer(data) {
    const area = document.getElementById('answer-area');
    let html = '';

    if (data.needs_clarification) {
        html += '<div class="clarification-box">';
        html += `<div class="clarification-question">🤔 ${data.answer}</div>`;
        if (data.clarification && data.clarification.options) {
            html += '<div class="clarification-options">';
            data.clarification.options.forEach((opt, i) => {
                html += `<button onclick="selectClarification('${encodeURIComponent(data.question)}', '${opt.intent || ''}', '${opt.entity || ''}', '${opt.filter_type || ''}')">${opt.label}</button>`;
            });
            html += '</div>';
        }
        html += '</div>';
    } else if (data.has_answer) {
        html += `<div class="answer-box">`;
        html += `<div class="label">📝 答案</div>`;
        html += `<div>${data.answer}</div>`;
        if (data.source) {
            html += `<div style="margin-top:6px;font-size:11px;color:#888">溯源: ${data.source.type || ''}</div>`;
        }
        html += '</div>';
    } else {
        html += `<div class="answer-box" style="color:#e74c3c">${data.answer || '未找到答案'}</div>`;
    }

    html += '<div class="feedback-box">';
    html += '<div class="label">📌 反馈</div>';
    html += '<div class="star-rating" id="star-rating">';
    for (let i = 1; i <= 5; i++) {
        html += `<span class="star" data-rating="${i}" onclick="setRating(${i})">★</span>`;
    }
    html += '</div>';
    html += `<button class="btn btn-secondary btn-small" onclick="submitFeedback('${encodeURIComponent(data.question)}', '${encodeURIComponent(data.answer || '')}', '${data.intent?.predicted || ''}')">提交反馈</button>`;
    html += '</div>';

    area.innerHTML = html;
}

function setRating(r) {
    currentRating = r;
    document.querySelectorAll('.star').forEach(s => {
        s.classList.toggle('active', parseInt(s.dataset.rating) <= r);
    });
}

let currentRating = 0;

async function submitFeedback(q, a, intent) {
    if (currentRating === 0) { showToast('请先选择评分'); return; }
    try {
        const res = await fetch(`${API_BASE}/api/feedback`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                question: decodeURIComponent(q),
                rating: currentRating,
                given_answer: decodeURIComponent(a),
                given_intent: intent
            })
        });
        const data = await res.json();
        showToast('反馈已提交，感谢！');
        currentRating = 0;
        loadStats();
    } catch(e) { showToast('提交失败'); }
}

async function selectClarification(q, intent, entity, filterType) {
    try {
        const res = await fetch(`${API_BASE}/api/qa/clarified`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({question: decodeURIComponent(q), clarified_intent: intent, clarified_entity: entity, filter_type: filterType})
        });
        const data = await res.json();
        renderAnswer(data);
        if (data.visualization) renderGraph(data.visualization);
    } catch(e) { showToast('请求失败'); }
}

async function exploreGraph() {
    const entity = document.getElementById('explore-entity').value.trim();
    const depth = parseInt(document.getElementById('explore-depth').value);
    if (!entity) return;
    try {
        const res = await fetch(`${API_BASE}/api/visualization/subgraph`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({center_entity: entity, depth: depth})
        });
        const data = await res.json();
        renderGraph(data);
    } catch(e) { showToast('探索失败'); }
}

async function showFullGraph() {
    try {
        const res = await fetch(`${API_BASE}/api/visualization/full`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({limit: 200})
        });
        const data = await res.json();
        renderGraph(data);
    } catch(e) { showToast('获取全图失败'); }
}

async function loadStats() {
    try {
        const res = await fetch(`${API_BASE}/api/feedback/stats`);
        const data = await res.json();
        const s = data.feedback_stats || {};
        document.getElementById('stats-area').innerHTML = `
            <div class="stat-card"><div class="stat-value">${s.total || 0}</div><div class="stat-label">总反馈</div></div>
            <div class="stat-card"><div class="stat-value">${((s.satisfaction_rate || 0) * 100).toFixed(0)}%</div><div class="stat-label">满意度</div></div>
            <div class="stat-card"><div class="stat-value">${data.intent_corrections || 0}</div><div class="stat-label">意图修正</div></div>
            <div class="stat-card"><div class="stat-value">${data.custom_qa_pairs || 0}</div><div class="stat-label">自学习QA</div></div>
        `;
    } catch(e) {}
}

async function batchProcess() {
    try {
        const res = await fetch(`${API_BASE}/api/feedback/batch-process`, {method: 'POST'});
        const data = await res.json();
        showToast(`已处理 ${data.processed_count} 条反馈`);
        loadStats();
    } catch(e) { showToast('处理失败'); }
}

const TYPE_COLORS = {
    Disease: '#e74c3c', Symptom: '#f39c12', Drug: '#2ecc71',
    Department: '#3498db', Doctor: '#9b59b6', Hospital: '#1abc9c',
    Treatment: '#e67e22', Examination: '#34495e'
};
const TYPE_LABELS = {
    Disease: '疾病', Symptom: '症状', Drug: '药物',
    Department: '科室', Doctor: '医生', Hospital: '医院',
    Treatment: '治疗', Examination: '检查'
};

function renderLegend() {
    let html = '<h4>图例</h4>';
    for (const [type, color] of Object.entries(TYPE_COLORS)) {
        html += `<div class="legend-item"><div class="legend-dot" style="background:${color}"></div>${TYPE_LABELS[type] || type}</div>`;
    }
    document.getElementById('legend').innerHTML = html;
}

function renderGraph(graphData) {
    currentGraph = graphData;
    const container = document.getElementById('graph-container');
    const svg = d3.select('#graph-svg');
    svg.selectAll('*').remove();

    const width = container.clientWidth;
    const height = container.clientHeight;

    svg.attr('width', width).attr('height', height);

    const nodes = (graphData.nodes || []).map(n => ({
        id: n.id, label: n.label, type: n.type,
        color: n.color || TYPE_COLORS[n.type] || '#95a5a6',
        size: n.size || 20,
        highlighted: n.highlighted || false,
        pathOrder: n.path_order != null ? n.path_order : -1
    }));

    const edges = (graphData.edges || []).map(e => ({
        source: e.source, target: e.target,
        relation: e.relation, relationLabel: e.relation_label || e.relation,
        highlighted: e.highlighted || false,
        id: e.id
    }));

    const nodeMap = {};
    nodes.forEach(n => nodeMap[n.id] = n);
    const validEdges = edges.filter(e => nodeMap[e.source] && nodeMap[e.target]);

    simulation = d3.forceSimulation(nodes)
        .force('link', d3.forceLink(validEdges).id(d => d.id).distance(120))
        .force('charge', d3.forceManyBody().strength(-400))
        .force('center', d3.forceCenter(width / 2, height / 2))
        .force('collision', d3.forceCollide().radius(40));

    const g = svg.append('g');

    const zoom = d3.zoom().scaleExtent([0.2, 5]).on('zoom', (event) => {
        g.attr('transform', event.transform);
    });
    svg.call(zoom);

    const linkGroup = g.append('g').selectAll('g').data(validEdges).enter().append('g');

    const link = linkGroup.append('line')
        .attr('class', d => `link${d.highlighted ? ' highlighted' : ''}`)
        .attr('stroke', d => d.highlighted ? '#ffd700' : '#3a3a5a')
        .attr('stroke-width', d => d.highlighted ? 3 : 1.5);

    const linkLabel = linkGroup.append('text')
        .attr('class', 'link-label')
        .text(d => d.relationLabel)
        .attr('fill', d => d.highlighted ? '#ffd700' : '#666')
        .attr('font-size', d => d.highlighted ? '10px' : '8px');

    const nodeGroup = g.append('g').selectAll('g').data(nodes).enter().append('g')
        .attr('class', d => `node${d.highlighted ? ' highlighted' : ''}`)
        .call(d3.drag()
            .on('start', (event, d) => { if (!event.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
            .on('drag', (event, d) => { d.fx = event.x; d.fy = event.y; })
            .on('end', (event, d) => { if (!event.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; })
        );

    nodeGroup.append('circle')
        .attr('r', d => d.size / 2 + (d.highlighted ? 4 : 0))
        .attr('fill', d => d.highlighted ? '#ffd700' : d.color)
        .attr('stroke', d => d.highlighted ? '#ffd700' : '#1a1a2e')
        .attr('stroke-width', d => d.highlighted ? 4 : 2);

    nodeGroup.append('text')
        .attr('dy', d => d.size / 2 + 14)
        .attr('fill', d => d.highlighted ? '#ffd700' : '#e0e0e0')
        .attr('font-weight', d => d.highlighted ? '700' : '400')
        .text(d => d.label);

    nodeGroup.on('click', (event, d) => {
        document.getElementById('explore-entity').value = d.id;
        exploreGraph();
    });

    simulation.on('tick', () => {
        link.attr('x1', d => d.source.x).attr('y1', d => d.source.y)
            .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
        linkLabel.attr('x', d => (d.source.x + d.target.x) / 2)
            .attr('y', d => (d.source.y + d.target.y) / 2);
        nodeGroup.attr('transform', d => `translate(${d.x},${d.y})`);
    });

    renderPathInfo(graphData);
}

function renderPathInfo(graphData) {
    const pi = document.getElementById('path-info');
    if (!graphData.path_info || !graphData.path_info.path_nodes || graphData.path_info.path_nodes.length === 0) {
        pi.style.display = 'none';
        return;
    }
    pi.style.display = 'block';
    const nodes = graphData.path_info.path_nodes;
    const rels = graphData.path_info.path_relations || [];
    let html = '<h4>✨ 关联路径（高亮）</h4><div class="path-text">';
    nodes.forEach((n, i) => {
        html += `<span class="path-node">${n}</span>`;
        if (i < rels.length) {
            html += `<span class="path-arrow"> →</span> <span class="path-rel">[${rels[i]}]</span><span class="path-arrow">→ </span>`;
        }
    });
    html += '</div>';
    if (graphData.answer_text) {
        html += `<div style="margin-top:6px;font-size:12px;color:#64ffda">答案: ${graphData.answer_text}</div>`;
    }
    pi.innerHTML = html;
}

renderLegend();
loadStats();

document.getElementById('question-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); askQuestion(); }
});
</script>
</body>
</html>
