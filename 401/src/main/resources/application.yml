server:
  port: 8080

spring:
  application:
    name: anonymous-voting-system

  datasource:
    url: jdbc:mysql://localhost:3306/voting_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  redis:
    host: localhost
    port: 6379
    password:
    database: 0
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0

voting:
  anti-fraud:
    ip-limit: 5
    ip-time-window: 3600
    device-limit: 1
    device-time-window: 86400
  vote-code:
    length: 8
    expire-days: 7
