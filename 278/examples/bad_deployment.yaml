apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-app
  labels:
    app: bad-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bad-app
  template:
    metadata:
      labels:
        app: bad-app
    spec:
      containers:
      - name: bad-container
        image: nginx:latest
        securityContext:
          privileged: true
          allowPrivilegeEscalation: true
        ports:
        - containerPort: 80
