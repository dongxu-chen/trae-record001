version: '3.8'

services:
  neo4j:
    image: neo4j:5.15-community
    container_name: service-topology-neo4j
    environment:
      - NEO4J_AUTH=neo4j/neo4j123456
      - NEO4J_dbms_memory_pagecache_size=512M
      - NEO4J_dbms_memory_heap_initial__size=512M
      - NEO4J_dbms_memory_heap_max__size=1G
      - NEO4J_dbms_connector_bolt_listen__address=0.0.0.0:7687
      - NEO4J_dbms_connector_http_listen__address=0.0.0.0:7474
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - service-topology-net

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: service-topology-backend
    environment:
      - SPRING_NEO4J_URI=bolt://neo4j:7687
      - SPRING_NEO4J_AUTHENTICATION_USERNAME=neo4j
      - SPRING_NEO4J_AUTHENTICATION_PASSWORD=neo4j123456
      - KUBERNETES_DISCOVERY_ENABLED=true
    ports:
      - "8080:8080"
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - service-topology-net
    volumes:
      - ~/.kube:/root/.kube:ro

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: service-topology-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - service-topology-net

volumes:
  neo4j_data:
  neo4j_logs:

networks:
  service-topology-net:
    driver: bridge
