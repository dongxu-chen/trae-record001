receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  prometheus:
    config:
      scrape_configs:
        - job_name: 'otel-collector'
          scrape_interval: 10s
          static_configs:
            - targets: ['0.0.0.0:8889']

processors:
  batch:
    timeout: 5s
    send_batch_size: 512

  memory_limiter:
    limit_mib: 100
    spike_limit_mib: 20
    check_interval: 1s

  attributes:
    actions:
      - key: sampling.reason
        action: insert
        value: "unknown"
      - key: sampling.rate
        action: insert
        value: 0.1

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: "tracing"
    send_timestamps: true

  logging:
    loglevel: info

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, attributes]
      exporters: [logging]
    
    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, batch]
      exporters: [prometheus, logging]

  telemetry:
    metrics:
      address: ":8888"
