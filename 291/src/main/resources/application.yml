server:
  port: 8080

spring:
  application:
    name: alert-management-system

  datasource:
    url: jdbc:mysql://localhost:3306/alert_system?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

alert:
  escalation:
    enabled: true
    target-severity: CRITICAL

logging:
  level:
    com.alert: debug
    org.drools: info
