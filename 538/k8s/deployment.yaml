apiVersion: v1
kind: Namespace
metadata:
  name: network-policy-recommender

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neo4j
  namespace: network-policy-recommender
spec:
  replicas: 1
  selector:
    matchLabels:
      app: neo4j
  template:
    metadata:
      labels:
        app: neo4j
    spec:
      containers:
      - name: neo4j
        image: neo4j:5.13-community
        ports:
        - containerPort: 7474
          name: http
        - containerPort: 7687
          name: bolt
        env:
        - name: NEO4J_AUTH
          value: "neo4j/password"
        volumeMounts:
        - name: neo4j-data
          mountPath: /data
      volumes:
      - name: neo4j-data
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: network-policy-recommender
spec:
  selector:
    app: neo4j
  ports:
  - name: bolt
    port: 7687
    targetPort: bolt
  - name: http
    port: 7474
    targetPort: http

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: network-policy-recommender
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: network-policy-recommender
      containers:
      - name: backend
        image: np-recommender-backend:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: NEO4J_URI
          value: "bolt://neo4j:7687"
        - name: NEO4J_USERNAME
          value: "neo4j"
        - name: NEO4J_PASSWORD
          value: "password"
        - name: KUBERNETES_INCLUSTER
          value: "true"

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: network-policy-recommender
spec:
  selector:
    app: backend
  ports:
  - name: http
    port: 8080
    targetPort: http

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: network-policy-recommender
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: np-recommender-frontend:latest
        ports:
        - containerPort: 80
          name: http

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: network-policy-recommender
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
  - name: http
    port: 80
    targetPort: http

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: network-policy-recommender
rules:
- apiGroups: [""]
  resources: ["pods", "namespaces", "services"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["get", "list", "create", "update", "delete", "watch"]

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: network-policy-recommender
  namespace: network-policy-recommender

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: network-policy-recommender
subjects:
- kind: ServiceAccount
  name: network-policy-recommender
  namespace: network-policy-recommender
roleRef:
  kind: ClusterRole
  name: network-policy-recommender
  apiGroup: rbac.authorization.k8s.io
