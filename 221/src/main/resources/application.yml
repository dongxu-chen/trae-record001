server:
  port: 8080

spring:
  application:
    name: shortlink-service

  datasource:
    url: jdbc:mysql://localhost:3306/shortlink?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

shortlink:
  domain: http://localhost:8080
  default-shortcode-length: 6
  redis-expire-seconds: 3600
  cleanup:
    cron: "0 0 2 * * ?"
    enabled: true

amap:
  api:
    enabled: false
    key: your_amap_api_key_here

ip:
  cache:
    expire-minutes: 1440
    max-size: 10000
