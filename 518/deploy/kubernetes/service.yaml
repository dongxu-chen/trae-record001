apiVersion: v1
kind: Service
metadata:
  name: kafka-autoscaler
  namespace: kafka
  labels:
    app: kafka-autoscaler
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
    - name: status
      port: 8080
      targetPort: status
      protocol: TCP
  selector:
    app: kafka-autoscaler
