apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-autoscaler
  namespace: kafka
  labels:
    app: kafka-autoscaler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-autoscaler
  template:
    metadata:
      labels:
        app: kafka-autoscaler
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: kafka-autoscaler
      containers:
        - name: kafka-autoscaler
          image: kafka-autoscaler:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
            - name: status
              containerPort: 8080
              protocol: TCP
          env:
            - name: LOG_LEVEL
              value: "info"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: config
              mountPath: /root/config
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: kafka-autoscaler-config
