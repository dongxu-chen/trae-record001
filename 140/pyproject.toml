[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "seqalign-rs"
version = "3.0.0"
description = "Sequence alignment toolkit with Rust acceleration"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
authors = [{name = "Sequence Alignment Toolkit"}]
keywords = ["bioinformatics", "sequence-alignment", "needleman-wunsch", "smith-waterman", "rust"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-benchmark", "numpy"]
plot = ["matplotlib", "logomaker", "seaborn", "reportlab"]

[tool.maturin]
features = ["extension-module"]
python-source = "seqalign"
