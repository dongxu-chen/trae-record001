server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: risk-control-system
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

  redis:
    redisson:
      file: classpath:redisson.yml

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: 1
      retries: 3
      properties:
        max.block.ms: 5000
    consumer:
      group-id: risk-control-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: latest
      enable-auto-commit: true
      auto-commit-interval: 1000
    listener:
      missing-topics-fatal: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

riskcontrol:
  ml:
    enabled: true
    model-path: classpath:models/risk_model.txt
    model-type: classification
    feature-count: 20
  flink:
    enabled: true
  rules:
    enabled: true
    path: rules/
  weights:
    rule-weight: 0.6
    ml-weight: 0.4
    high-risk-conservation-factor: 0.9
    high-risk-threshold: 70
    scene-weights:
      login:
        rule-weight: 0.55
        ml-weight: 0.45
        high-risk-threshold: 70
        conservation-factor: 0.9
      register:
        rule-weight: 0.7
        ml-weight: 0.3
        high-risk-threshold: 60
        conservation-factor: 0.85
      password_change:
        rule-weight: 0.5
        ml-weight: 0.5
        high-risk-threshold: 75
        conservation-factor: 0.95
      sensitive_operation:
        rule-weight: 0.4
        ml-weight: 0.6
        high-risk-threshold: 65
        conservation-factor: 0.95
  proxy:
    crawler:
      enabled: true
      timeout: 10000
      max-ips-per-source: 500
    update:
      enabled: true
      cron: "0 0 3 * * ?"
      retain-days: 7

logging:
  level:
    root: INFO
    com.riskcontrol: DEBUG
    org.drools: WARN
    org.apache.flink: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: logs/risk-control.log
    max-size: 100MB
    max-history: 30
