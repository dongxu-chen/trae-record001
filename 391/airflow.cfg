[core]
dags_folder = /opt/airflow/dags
base_log_folder = /opt/airflow/logs
executor = CeleryExecutor
sql_alchemy_conn = mysql+pymysql://scheduler:scheduler123@mysql:3306/task_scheduler
parallelism = 32
max_active_tasks_per_dag = 16
dags_are_paused_at_creation = False
load_examples = False
load_default_connections = False

[api]
enable_experimental_api = True
access_control_allow_headers = *
access_control_allow_methods = *
access_control_allow_origins = *

[celery]
celery_app_name = airflow.providers.celery.executors.celery_executor
celery_broker_url = redis://:redis123@redis:6379/0
celery_result_backend = db+mysql+pymysql://scheduler:scheduler123@mysql:3306/task_scheduler
worker_concurrency = 8
worker_autoscale = 6,3
worker_prefetch_multiplier = 1
task_acks_late = True
task_reject_on_worker_lost = True

[logging]
logging_level = INFO
colored_console_log = True
colored_log_format = [%%(blue)s%%(asctime)s%%(reset)s {%%(blue)s%%(name)s%%(reset)s} %%(log_color)s%%(levelname)s%%(reset)s - %%(message)s
log_filename_template = dag_id={{ ti.dag_id }}/run_id={{ ti.run_id }}/task_id={{ ti.task_id }}/{{ ts }}/{{ try_number }}.log

[scheduler]
dag_dir_list_interval = 30
parsing_processes = 2
scheduler_heartbeat_sec = 5
max_tis_per_query = 512
