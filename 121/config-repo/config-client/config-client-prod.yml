app:
  name: config-client
  version: 1.0.0
  environment: production
  message: Hello from Production Environment!
  feature:
    enable-cache: true
    enable-log: false
    max-connections: 500

logging:
  level:
    com.configcenter: WARN
    root: WARN

spring:
  datasource:
    url: jdbc:mysql://prod-db:3306/prod_db
    username: prod_user
    password: prod_pass
