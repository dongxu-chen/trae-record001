{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">预约 {{ counselor.name }}</h5>
                </div>
                <div class="card-body">
                    <div class="alert alert-info mb-4">
                        <h6 class="alert-heading">{{ counselor.title }}</h6>
                        <p class="mb-0">专业方向: {{ counselor.specialty }}</p>
                        <p class="mb-0">可用时间: {{ counselor.available_times }}</p>
                    </div>
                    
                    <form id="bookingForm">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">姓名 *</label>
                                <input type="text" name="student_name" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">学号 *</label>
                                <input type="text" name="student_id" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">联系电话</label>
                                <input type="tel" name="phone" class="form-control">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">预约日期 *</label>
                                <input type="date" name="appointment_date" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">预约时间 *</label>
                                <select name="appointment_time" class="form-select" required>
                                    <option value="">请选择</option>
                                    <option value="09:00">09:00</option>
                                    <option value="10:00">10:00</option>
                                    <option value="11:00">11:00</option>
                                    <option value="14:00">14:00</option>
                                    <option value="15:00">15:00</option>
                                    <option value="16:00">16:00</option>
                                    <option value="17:00">17:00</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label">咨询原因</label>
                                <textarea name="reason" class="form-control" rows="3" placeholder="简单描述您想咨询的问题..."></textarea>
                                <div class="form-text text-muted">您的信息会被加密存储并自动脱敏处理</div>
                            </div>
                        </div>
                        
                        <div class="mt-4 d-flex gap-2">
                            <a href="/counselors" class="btn btn-secondary">返回</a>
                            <button type="submit" class="btn btn-primary ms-auto">提交预约</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('bookingForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const formData = new FormData(this);
    const data = {
        counselor_id: {{ counselor.id }},
        student_name: formData.get('student_name'),
        student_id: formData.get('student_id'),
        phone: formData.get('phone'),
        appointment_date: formData.get('appointment_date'),
        appointment_time: formData.get('appointment_time'),
        reason: formData.get('reason')
    };
    
    try {
        const response = await fetch('/api/appointments', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        
        const result = await response.json();
        
        if (result.success) {
            alert('预约成功！');
            window.location.href = '/appointments';
        } else {
            alert(result.message || '预约失败，请重试');
        }
    } catch (error) {
        alert('网络错误，请重试');
    }
});
</script>
{% endblock %}
