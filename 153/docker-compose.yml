version: '3.8'

services:
  web:
    build: .
    container_name: mental-health-web
    command: uvicorn fastapi_app.main:app --host 0.0.0.0 --port 5000 --workers 4
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/mental_health
      - SECRET_KEY=your-super-secret-key-change-in-production
      - DEBUG=false
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mental-health-network

  db:
    image: postgres:15-alpine
    container_name: mental-health-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=mental_health
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - mental-health-network

  redis:
    image: redis:7-alpine
    container_name: mental-health-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - mental-health-network

  nginx:
    image: nginx:alpine
    container_name: mental-health-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - mental-health-network

volumes:
  postgres_data:
  redis_data:

networks:
  mental-health-network:
    driver: bridge
