<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%95%3C/text%3E%3C/svg%3E">
  <title>离线日记本</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="header-content">
        <h1 class="app-title">📕 离线日记本</h1>
        <div class="header-actions">
          <span id="sync-status" class="sync-status">在线</span>
          <span id="user-info" class="user-info"></span>
          <button id="backup-btn" class="btn btn-secondary" style="display:none;">☁️ 备份</button>
          <button id="settings-btn" class="btn btn-secondary" style="display:none;">⚙️ 设置</button>
          <button id="logout-btn" class="btn btn-secondary" style="display:none;">退出</button>
        </div>
      </div>
    </header>

    <div id="auth-container" class="auth-container">
      <div class="auth-card">
        <h2>欢迎使用离线日记本</h2>
        <p>安全的个人日记，支持离线使用</p>
        
        <div class="auth-tabs">
          <button class="auth-tab active" data-tab="login">登录</button>
          <button class="auth-tab" data-tab="register">注册</button>
        </div>

        <form id="login-form" class="auth-form active">
          <div class="form-group">
            <label>邮箱</label>
            <input type="email" id="login-email" required placeholder="your@email.com">
          </div>
          <div class="form-group">
            <label>密码</label>
            <input type="password" id="login-password" required placeholder="密码">
          </div>
          <button type="submit" class="btn btn-primary btn-block">登录</button>
          <p class="auth-hint">离线时可使用本地缓存的账户</p>
        </form>

        <form id="register-form" class="auth-form">
          <div class="form-group">
            <label>昵称</label>
            <input type="text" id="register-name" required placeholder="你的昵称">
          </div>
          <div class="form-group">
            <label>邮箱</label>
            <input type="email" id="register-email" required placeholder="your@email.com">
          </div>
          <div class="form-group">
            <label>密码</label>
            <input type="password" id="register-password" required placeholder="至少6位密码">
          </div>
          <button type="submit" class="btn btn-primary btn-block">注册</button>
        </form>

        <p id="auth-message" class="auth-message"></p>
      </div>
    </div>

    <main id="main-container" class="main-container" style="display:none;">
      <aside class="sidebar">
        <div class="sidebar-header">
          <button id="new-diary-btn" class="btn btn-primary btn-block">
            ✏️ 新日记
          </button>
        </div>
        <div class="diary-list-container">
          <div class="diary-list-header">
            <h3>我的日记</h3>
            <input type="text" id="search-input" placeholder="搜索日记..." class="search-input">
          </div>
          <div id="diary-list" class="diary-list">
            <div class="empty-state">
              <p>还没有日记</p>
              <p class="empty-hint">点击上方按钮开始写作</p>
            </div>
          </div>
        </div>
      </aside>

      <section class="editor-section">
        <div class="editor-container">
          <div class="editor-header">
            <input type="text" id="diary-title" class="diary-title-input" placeholder="日记标题...">
            <div class="editor-meta">
              <span id="diary-date"></span>
              <span id="save-status"></span>
              <span id="encryption-status" title="加密状态"></span>
            </div>
          </div>

          <div class="toolbar">
            <button class="toolbar-btn" data-command="bold" title="加粗">B</button>
            <button class="toolbar-btn" data-command="italic" title="斜体">I</button>
            <button class="toolbar-btn" data-command="underline" title="下划线">U</button>
            <button class="toolbar-btn" data-command="strikeThrough" title="删除线">S</button>
            <span class="toolbar-divider"></span>
            <button class="toolbar-btn" data-command="insertUnorderedList" title="无序列表">•</button>
            <button class="toolbar-btn" data-command="insertOrderedList" title="有序列表">1.</button>
            <span class="toolbar-divider"></span>
            <button class="toolbar-btn" data-command="justifyLeft" title="左对齐">⬅</button>
            <button class="toolbar-btn" data-command="justifyCenter" title="居中">⬌</button>
            <button class="toolbar-btn" data-command="justifyRight" title="右对齐">➡</button>
            <span class="toolbar-divider"></span>
            <select id="font-size" class="toolbar-select">
              <option value="1">小</option>
              <option value="3" selected>中</option>
              <option value="5">大</option>
              <option value="7">特大</option>
            </select>
            <input type="color" id="text-color" class="toolbar-color" value="#000000" title="文字颜色">
            <input type="color" id="bg-color" class="toolbar-color" value="#ffffff" title="背景颜色">
            <span class="toolbar-divider"></span>
            <button class="toolbar-btn" data-command="undo" title="撤销">↶</button>
            <button class="toolbar-btn" data-command="redo" title="重做">↷</button>
          </div>

          <div id="editor" class="editor-content" contenteditable="true" spellcheck="false">
          </div>

          <div class="editor-footer">
            <button id="save-btn" class="btn btn-primary">💾 保存</button>
            <button id="delete-btn" class="btn btn-danger" style="display:none;">🗑️ 删除</button>
            <span class="word-count" id="word-count">字数: 0</span>
          </div>
        </div>
      </section>
    </main>

    <div id="settings-modal" class="modal-overlay" style="display:none;">
      <div class="modal">
        <div class="modal-header">
          <h2>⚙️ 设置</h2>
          <button class="modal-close" id="close-settings">×</button>
        </div>
        <div class="modal-body">
          <div class="settings-section">
            <h3>🔐 加密设置</h3>
            <div class="setting-item">
              <label>
                <input type="checkbox" id="setting-encryption" checked>
                <span>启用日记加密（AES-256）</span>
              </label>
              <p class="setting-desc">使用 AES-256 加密你的日记内容</p>
            </div>
            <div class="setting-actions">
              <button id="rotate-key-btn" class="btn btn-secondary">🔄 轮换密钥</button>
              <button id="export-key-btn" class="btn btn-secondary">📤 导出密钥</button>
              <button id="import-key-btn" class="btn btn-secondary">📥 导入密钥</button>
            </div>
            <input type="file" id="key-file-input" accept=".json" style="display:none;">
          </div>

          <div class="settings-section">
            <h3>🎨 外观设置</h3>
            <div class="setting-item">
              <label>主题</label>
              <select id="setting-theme" class="setting-select">
                <option value="light">浅色</option>
                <option value="dark">深色</option>
              </select>
            </div>
            <div class="setting-item">
              <label>字体大小</label>
              <select id="setting-fontsize" class="setting-select">
                <option value="small">小</option>
                <option value="medium" selected>中</option>
                <option value="large">大</option>
              </select>
            </div>
          </div>

          <div class="settings-section">
            <h3>💾 自动保存</h3>
            <div class="setting-item">
              <label>
                <input type="checkbox" id="setting-autosave" checked>
                <span>启用自动保存</span>
              </label>
            </div>
            <div class="setting-item">
              <label>保存间隔（秒）</label>
              <input type="number" id="setting-autosave-interval" value="30" min="10" max="300" class="setting-input">
            </div>
          </div>

          <div class="settings-section">
            <h3>☁️ 备份设置</h3>
            <div class="setting-item">
              <label>
                <input type="checkbox" id="setting-autobackup">
                <span>启用自动备份</span>
              </label>
            </div>
            <div class="setting-item">
              <label>备份间隔（小时）</label>
              <input type="number" id="setting-backup-interval" value="24" min="1" max="168" class="setting-input">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button id="save-settings-btn" class="btn btn-primary">保存设置</button>
        </div>
      </div>
    </div>

    <div id="backup-modal" class="modal-overlay" style="display:none;">
      <div class="modal">
        <div class="modal-header">
          <h2>☁️ 备份与恢复</h2>
          <button class="modal-close" id="close-backup">×</button>
        </div>
        <div class="modal-body">
          <div class="backup-status">
            <div class="backup-info">
              <h3>本地备份</h3>
              <p>创建所有日记的加密备份</p>
            </div>
            <div class="backup-actions">
              <button id="create-backup-btn" class="btn btn-primary">📤 立即备份</button>
              <button id="import-backup-btn" class="btn btn-secondary">📥 导入备份</button>
            </div>
            <input type="file" id="backup-file-input" accept=".json" style="display:none;">
          </div>

          <div class="backup-history">
            <h3>备份历史</h3>
            <div id="backup-list" class="backup-list">
              <div class="empty-state">
                <p>暂无备份记录</p>
              </div>
            </div>
          </div>

          <div class="backup-options" style="margin-top: 1rem;">
            <h3>云端备份</h3>
            <div class="setting-item">
              <label>
                <input type="checkbox" id="setting-drive-backup" disabled>
                <span>同步到 Google Drive</span>
              </label>
              <p class="setting-desc">需要配置 Google API 凭证后启用</p>
            </div>
            <button id="connect-drive-btn" class="btn btn-secondary" disabled>🔗 连接 Google Drive</button>
          </div>
        </div>
        <div class="modal-footer">
          <div id="backup-progress" class="backup-progress" style="display:none;">
            <div class="progress-bar">
              <div class="progress-fill"></div>
            </div>
            <p id="backup-progress-text">准备中...</p>
          </div>
        </div>
      </div>
    </div>

    <div id="password-modal" class="modal-overlay" style="display:none;">
      <div class="modal modal-sm">
        <div class="modal-header">
          <h2 id="password-modal-title">设置保护密码</h2>
          <button class="modal-close" id="close-password-modal">×</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label id="password-label">请输入密码（至少6位）</label>
            <input type="password" id="password-input" class="form-input" placeholder="输入密码">
          </div>
          <div class="form-group" id="confirm-password-group" style="display:none;">
            <label>确认密码</label>
            <input type="password" id="confirm-password-input" class="form-input" placeholder="再次输入">
          </div>
        </div>
        <div class="modal-footer">
          <button id="cancel-password-btn" class="btn btn-secondary">取消</button>
          <button id="confirm-password-btn" class="btn btn-primary">确认</button>
        </div>
      </div>
    </div>

    <div id="toast-container" class="toast-container"></div>
  </div>

  <script src="./crypto.js"></script>
  <script src="./idb.js"></script>
  <script src="./settings.js"></script>
  <script src="./sync.js"></script>
  <script src="./backup.js"></script>
  <script src="./app.js"></script>
</body>
</html>
