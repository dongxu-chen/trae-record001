<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D手势交互白板 - 增强版</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎨 3D手势交互白板</h1>
            <div class="status-bar">
                <span id="statusText">等待摄像头...</span>
                <span id="zoomLevel">缩放: 100%</span>
                <span id="recordStatus">未录制</span>
                <span id="connectionStatus">离线</span>
            </div>
        </div>
        
        <div class="main-content">
            <div class="sidebar">
                <div class="video-container">
                    <video id="video" autoplay playsinline></video>
                    <canvas id="videoCanvas"></canvas>
                </div>
                
                <div class="tool-panel">
                    <h3>🎯 工具栏</h3>
                    <div class="tool-buttons">
                        <button id="undoBtn" class="tool-btn">↩️ 撤销</button>
                        <button id="redoBtn" class="tool-btn">↪️ 重做</button>
                    </div>
                </div>
                
                <div class="voice-panel">
                    <h3>🎤 语音标注</h3>
                    <div class="voice-controls">
                        <button id="voiceBtn" class="voice-btn">开始语音</button>
                        <div id="voiceText" class="voice-text">等待语音输入...</div>
                        <button id="addTextBtn" class="add-text-btn" disabled>添加标注</button>
                    </div>
                </div>
                
                <div class="record-panel">
                    <h3>📹 录制回放</h3>
                    <div class="record-controls">
                        <button id="recordBtn" class="record-btn">开始录制</button>
                        <button id="playBtn" class="play-btn" disabled>播放</button>
                        <button id="saveBtn" class="save-btn" disabled>保存</button>
                        <button id="loadBtn" class="load-btn">加载</button>
                    </div>
                    <div id="recordTime" class="record-time">00:00</div>
                </div>
                
                <div class="collab-panel">
                    <h3>👥 多人协同</h3>
                    <div class="collab-controls">
                        <input type="text" id="roomId" placeholder="房间号" value="room1">
                        <button id="joinBtn" class="join-btn">加入房间</button>
                        <button id="leaveBtn" class="leave-btn" disabled>离开</button>
                    </div>
                    <div id="userList" class="user-list">
                        <div class="user-item">你 (离线)</div>
                    </div>
                </div>
            </div>
            
            <div class="canvas-container">
                <canvas id="threeCanvas"></canvas>
                <div id="textLabels" class="text-labels"></div>
            </div>
        </div>
        
        <div class="controls">
            <div class="control-group">
                <label>🎨 画笔颜色:</label>
                <input type="color" id="colorPicker" value="#ff0000">
            </div>
            <div class="control-group">
                <label>📏 画笔大小:</label>
                <input type="range" id="brushSize" min="1" max="20" value="5">
            </div>
            <div class="control-group">
                <label>🔍 缩放:</label>
                <input type="range" id="zoomSlider" min="0.5" max="3" step="0.1" value="1">
            </div>
            <div class="control-group">
                <button id="clearBtn">🗑️ 清空画布</button>
            </div>
        </div>
        
        <div class="instructions">
            <h3>📖 手势说明:</h3>
            <ul>
                <li>☝️ 食指伸出 - 绘制</li>
                <li>✊ 握拳 - 擦除</li>
                <li>🤏 双手食指 - 旋转画布</li>
                <li>✌️ 双指开合 - 缩放画布</li>
                <li>🖖 三指左滑 - 撤销操作</li>
            </ul>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1640029074/camera_utils.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1620248257/drawing_utils.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
