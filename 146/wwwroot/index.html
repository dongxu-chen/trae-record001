<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云桌面管理服务 - Cloud Desktop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2563eb;
            --secondary-color: #3b82f6;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
            --dark-bg: #1e293b;
            --card-bg: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            color: var(--text-primary);
        }

        .sidebar {
            width: 260px;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            background: var(--dark-bg);
            border-right: 1px solid #475569;
            padding: 1rem;
            z-index: 100;
        }

        .main-content {
            margin-left: 260px;
            padding: 2rem;
        }

        .nav-item {
            padding: 0.75rem 1rem;
            margin-bottom: 0.25rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-secondary);
        }

        .nav-item:hover, .nav-item.active {
            background: rgba(37, 99, 235, 0.2);
            color: var(--secondary-color);
        }

        .nav-item i {
            width: 24px;
            margin-right: 0.75rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid #475569;
            border-radius: 0.75rem;
        }

        .card-header {
            background: transparent;
            border-bottom: 1px solid #475569;
            padding: 1rem 1.25rem;
        }

        .stat-card {
            background: linear-gradient(135deg, var(--primary-color), #1d4ed8);
            border-radius: 0.75rem;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }

        .stat-card.success {
            background: linear-gradient(135deg, var(--success-color), #059669);
        }

        .stat-card.warning {
            background: linear-gradient(135deg, var(--warning-color), #d97706);
        }

        .stat-card.danger {
            background: linear-gradient(135deg, var(--danger-color), #dc2626);
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
        }

        .stat-label {
            opacity: 0.9;
            font-size: 0.9rem;
        }

        .connection-card {
            transition: all 0.2s;
            cursor: pointer;
        }

        .connection-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .protocol-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .protocol-rdp {
            background: rgba(37, 99, 235, 0.2);
            color: #60a5fa;
        }

        .protocol-vnc {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
        }

        .protocol-ssh {
            background: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
        }

        .status-badge {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 0.5rem;
        }

        .status-active {
            background: var(--success-color);
            box-shadow: 0 0 8px var(--success-color);
        }

        .status-inactive {
            background: var(--text-secondary);
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid #475569;
        }

        .modal-header {
            border-bottom: 1px solid #475569;
        }

        .modal-footer {
            border-top: 1px solid #475569;
        }

        .form-control, .form-select {
            background: #1e293b;
            border: 1px solid #475569;
            color: var(--text-primary);
        }

        .form-control:focus, .form-select:focus {
            background: #1e293b;
            border-color: var(--primary-color);
            color: var(--text-primary);
            box-shadow: 0 0 0 0.25rem rgba(37, 99, 235, 0.25);
        }

        .form-control::placeholder {
            color: var(--text-secondary);
        }

        .btn-primary {
            background: var(--primary-color);
            border-color: var(--primary-color);
        }

        .btn-primary:hover {
            background: #1d4ed8;
            border-color: #1d4ed8;
        }

        .btn-outline-light {
            border-color: #475569;
        }

        .table {
            color: var(--text-primary);
        }

        .table > :not(caption) > * > * {
            background-color: transparent;
            border-bottom-color: #475569;
        }

        .table-hover > tbody > tr:hover > * {
            background-color: rgba(71, 85, 105, 0.5);
        }

        .session-item {
            padding: 1rem;
            border-bottom: 1px solid #475569;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .session-item:last-child {
            border-bottom: none;
        }

        .recording-indicator {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--danger-color);
        }

        .recording-dot {
            width: 8px;
            height: 8px;
            background: var(--danger-color);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .page-section {
            display: none;
        }

        .page-section.active {
            display: block;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--secondary-color);
            margin-bottom: 2rem;
            padding: 0.5rem 1rem;
        }

        .logo i {
            margin-right: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">
            <i class="bi bi-cloud"></i>
            Cloud Desktop
        </div>
        <div class="nav-item active" data-page="dashboard">
            <i class="bi bi-speedometer2"></i>
            仪表盘
        </div>
        <div class="nav-item" data-page="connections">
            <i class="bi bi-display"></i>
            连接管理
        </div>
        <div class="nav-item" data-page="sessions">
            <i class="bi bi-window-dock"></i>
            会话管理
        </div>
        <div class="nav-item" data-page="recordings">
            <i class="bi bi-record-circle"></i>
            会话录像
        </div>
        <div class="nav-item" data-page="client">
            <i class="bi bi-play-btn"></i>
            远程桌面
        </div>
    </div>

    <div class="main-content">
        <div id="dashboard" class="page-section active">
            <h2 class="mb-4">
                <i class="bi bi-speedometer2 me-2"></i>
                仪表盘
            </h2>

            <div class="row mb-4">
                <div class="col-md-3">
                    <div class="stat-card">
                        <div class="stat-number" id="stat-connections">0</div>
                        <div class="stat-label">可用连接</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card success">
                        <div class="stat-number" id="stat-active-sessions">0</div>
                        <div class="stat-label">活跃会话</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card warning">
                        <div class="stat-number" id="stat-total-sessions">0</div>
                        <div class="stat-label">总会话数</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card danger">
                        <div class="stat-number" id="stat-recordings">0</div>
                        <div class="stat-label">会话录像</div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h5 class="mb-0">最近会话</h5>
                            <button class="btn btn-sm btn-outline-light" onclick="navigateTo('sessions')">
                                查看全部
                            </button>
                        </div>
                        <div class="card-body p-0" id="recent-sessions-list">
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h5 class="mb-0">协议分布</h5>
                        </div>
                        <div class="card-body" id="protocol-stats">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="connections" class="page-section">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>
                    <i class="bi bi-display me-2"></i>
                    连接管理
                </h2>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#connectionModal">
                    <i class="bi bi-plus-lg me-2"></i>
                    新建连接
                </button>
            </div>

            <div class="row" id="connections-list">
            </div>
        </div>

        <div id="sessions" class="page-section">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>
                    <i class="bi bi-window-dock me-2"></i>
                    会话管理
                </h2>
                <div>
                    <button class="btn btn-outline-light me-2" onclick="loadSessions()">
                        <i class="bi bi-arrow-clockwise me-2"></i>
                        刷新
                    </button>
                </div>
            </div>

            <div class="card">
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr>
                                <th>会话ID</th>
                                <th>连接名称</th>
                                <th>协议</th>
                                <th>用户</th>
                                <th>状态</th>
                                <th>连接时间</th>
                                <th>时长</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="sessions-table">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="recordings" class="page-section">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>
                    <i class="bi bi-record-circle me-2"></i>
                    会话录像
                </h2>
            </div>

            <div class="card">
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr>
                                <th>会话ID</th>
                                <th>连接名称</th>
                                <th>协议</th>
                                <th>用户</th>
                                <th>录制时间</th>
                                <th>时长</th>
                                <th>文件大小</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="recordings-table">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="client" class="page-section">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>
                    <i class="bi bi-play-btn me-2"></i>
                    远程桌面
                </h2>
            </div>

            <div class="card mb-4">
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-4">
                            <label class="form-label">选择连接</label>
                            <select class="form-select" id="client-connection" onchange="updateConnectionParams()">
                                <option value="">-- 请选择连接 --</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">分辨率</label>
                            <select class="form-select" id="client-resolution">
                                <option value="1920x1080">1920x1080</option>
                                <option value="1600x900">1600x900</option>
                                <option value="1366x768">1366x768</option>
                                <option value="1280x720">1280x720</option>
                                <option value="1024x768">1024x768</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">DPI</label>
                            <select class="form-select" id="client-dpi">
                                <option value="96">96</option>
                                <option value="120">120</option>
                                <option value="144">144</option>
                                <option value="192">192</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">用户ID</label>
                            <input type="text" class="form-control" id="client-userid" placeholder="输入用户ID">
                        </div>
                        <div class="col-md-2 d-flex align-items-end">
                            <button class="btn btn-primary w-100" onclick="startConnection()">
                                <i class="bi bi-play-fill me-2"></i>
                                连接
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">远程桌面显示</h5>
                    <div id="connection-status" class="d-none">
                        <span class="recording-indicator">
                            <span class="recording-dot"></span>
                            已连接
                        </span>
                        <button class="btn btn-sm btn-danger ms-3" onclick="disconnectSession()">
                            <i class="bi bi-stop-fill me-2"></i>
                            断开
                        </button>
                    </div>
                </div>
                <div class="card-body p-0">
                    <div id="display-container" style="width: 100%; min-height: 600px; background: #000; display: flex; align-items: center; justify-content: center; overflow: auto;">
                        <div style="text-align: center; color: #64748b;">
                            <i class="bi bi-display" style="font-size: 4rem; margin-bottom: 1rem;"></i>
                            <p>选择连接并点击"连接"按钮开始远程桌面会话</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="connectionModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">新建连接</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="connection-form">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">连接名称 *</label>
                                <input type="text" class="form-control" id="conn-name" required placeholder="例如: Windows Server 2022">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">协议 *</label>
                                <select class="form-select" id="conn-protocol" required onchange="toggleProtocolFields()">
                                    <option value="RDP">RDP</option>
                                    <option value="VNC">VNC</option>
                                    <option value="SSH">SSH</option>
                                </select>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-8">
                                <label class="form-label">主机地址 *</label>
                                <input type="text" class="form-control" id="conn-hostname" required placeholder="例如: 192.168.1.100">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">端口</label>
                                <input type="number" class="form-control" id="conn-port" placeholder="默认: 3389">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">用户名</label>
                                <input type="text" class="form-control" id="conn-username" placeholder="用户名">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">密码</label>
                                <input type="password" class="form-control" id="conn-password" placeholder="密码">
                            </div>
                        </div>
                        <div class="row mb-3 rdp-only">
                            <div class="col-md-6">
                                <label class="form-label">域</label>
                                <input type="text" class="form-control" id="conn-domain" placeholder="域（可选）">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">颜色深度</label>
                                <select class="form-select" id="conn-colordepth">
                                    <option value="24">24位</option>
                                    <option value="16">16位</option>
                                    <option value="8">8位</option>
                                </select>
                            </div>
                        </div>
                        <div class="row mb-3 rdp-only">
                            <div class="col-md-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="conn-audio" checked>
                                    <label class="form-check-label">音频重定向</label>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="conn-clipboard" checked>
                                    <label class="form-check-label">剪贴板重定向</label>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="conn-recording">
                                    <label class="form-check-label">会话录制</label>
                                </div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">描述</label>
                            <textarea class="form-control" id="conn-description" rows="2" placeholder="连接描述（可选）"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="createConnection()">创建连接</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
