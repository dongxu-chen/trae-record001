server:
  port: 8080

spring:
  application:
    name: dt-monitor
  datasource:
    url: jdbc:h2:file:./data/dt-monitor;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console

elasticsearch:
  host: localhost
  port: 9200
  scheme: http
  index:
    shards: 1
    replicas: 0

zipkin:
  base-url: http://localhost:9411

seata:
  tx-service-group: dt-monitor-group
  service:
    vgroup-mapping:
      dt-monitor-group: default
  registry:
    type: nacos
    nacos:
      server-addr: localhost:8848
      namespace: ""
      group: SEATA_GROUP

logging:
  level:
    com.dtmonitor: DEBUG
    io.seata: INFO
