<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>敏捷项目管理工具</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f5f5;
        }
        .board-container {
            display: flex;
            overflow-x: auto;
            padding: 20px;
            gap: 20px;
        }
        .list-column {
            min-width: 300px;
            background-color: #ebecf0;
            border-radius: 8px;
            padding: 12px;
        }
        .list-header {
            font-weight: bold;
            margin-bottom: 12px;
            padding: 8px;
        }
        .card-item {
            background-color: white;
            border-radius: 4px;
            padding: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .card-item:hover {
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .priority-high {
            border-left: 4px solid #dc3545;
        }
        .priority-medium {
            border-left: 4px solid #ffc107;
        }
        .priority-low {
            border-left: 4px solid #28a745;
        }
        .dragging {
            opacity: 0.5;
        }
        .drop-target {
            background-color: #dfe1e6;
        }
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            font-size: 12px;
            color: #666;
        }
        .story-points {
            background-color: #e3e3e3;
            border-radius: 12px;
            padding: 2px 8px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">敏捷项目管理工具</a>
            <div class="navbar-nav">
                <a class="nav-link active" href="#board">看板</a>
                <a class="nav-link" href="#sprints">Sprint</a>
                <a class="nav-link" href="#burndown">燃尽图</a>
                <a class="nav-link" href="#timetracking">工时登记</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>项目看板</h2>
        <div id="board-container" class="board-container">
            <!-- 动态加载看板内容 -->
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/board.js"></script>
</body>
</html>
