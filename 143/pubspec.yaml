name: appwrite_mqtt_sync
description: Offline-first sync architecture with Appwrite, SQLite, and MQTT with end-to-end encryption
version: 1.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  sqflite: ^2.3.0
  path: ^1.8.3
  mqtt_client: ^9.8.1
  appwrite: ^11.0.1
  crypto: ^3.0.3
  pointycastle: ^3.7.4
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
