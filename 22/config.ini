[database:mysql_prod]
type = mysql
host = localhost
port = 3306
user = root
password = password
database_name = test_db
enabled = true

[database:mysql_test]
type = mysql
host = localhost
port = 3307
user = root
password = password
database_name = test_db
enabled = false

[database:postgres_prod]
type = postgresql
host = localhost
port = 5432
user = postgres
password = password
database_name = postgres
enabled = true

[database:mongo_prod]
type = mongodb
host = localhost
port = 27017
user = admin
password = password
database_name = admin
authentication_database = admin
enabled = true

[backup]
backup_dir = ./backups
full_backup_interval = 7
incremental_backup_interval = 1
retention_days = 30

[encryption]
enabled = true
algorithm = AES-256-CBC
key_file = ./backup.key

[oss]
access_key_id = your_access_key_id
access_key_secret = your_access_key_secret
endpoint = oss-cn-hangzhou.aliyuncs.com
bucket_name = your_bucket_name
backup_path = database_backups/

[scheduler]
enabled = true
log_file = scheduler.log
timezone = Asia/Shanghai

[schedule:daily_full]
job_name = daily_full_backup
task = backup
type = full
instances = mysql_prod,postgres_prod
trigger = cron
day_of_week = 0-6
hour = 2
minute = 0
enabled = true

[schedule:hourly_incr]
job_name = hourly_incr_backup
task = backup
type = incremental
instances = mysql_prod
trigger = cron
day_of_week = 0-6
hour = 0-23
minute = 30
enabled = false

[schedule:daily_upload]
job_name = daily_upload
task = upload
instances = all
trigger = cron
day_of_week = 0-6
hour = 4
minute = 0
enabled = true
