server:
  port: 8080

spring:
  application:
    name: wolfkill-game

  datasource:
    url: jdbc:mysql://localhost:3306/wolfkill?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 3000
      lettuce:
        pool:
          max-active: 20
          max-wait: -1
          max-idle: 10
          min-idle: 5

netty:
  port: 9000
  boss-threads: 2
  worker-threads: 8
  reader-idle-time: 60
  writer-idle-time: 30
  all-idle-time: 0

game:
  room:
    max-players: 12
    min-players: 6
  heartbeat:
    interval: 5000
    timeout: 30000
  replay:
    enabled: true
    save-interval: 5000

voice:
  server: localhost
  port: 8080
  timeout-minutes: 120
  max-users: 12

rank:
  base-elo: 1200
  k-factor: 32
  min-games-for-rank: 5
  max-match-wait-seconds: 120
  target-team-size: 6
