server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: medicine-stock-warning

  datasource:
    url: jdbc:mysql://localhost:3306/medicine_stock?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 10000
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: 5000

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

app:
  stock:
    default-lead-time-days: 14
    service-level: 0.95
    review-period-days: 30
    near-expiry-days: 90
    history-days: 90
    value-weight-threshold: 100.00
    high-value-extra-days: 30
    warning-check-cron: "0 0 2 * * ?"
    expiry-check-cron: "0 0 3 * * ?"
    optimization:
      enable-ortools: true
      solver-time-limit-seconds: 30
      unit-transport-cost: 1.0
      distance-cost-weight: 0.5

logging:
  level:
    root: INFO
    com.medical.stockwarning: DEBUG
    org.hibernate.SQL: DEBUG
