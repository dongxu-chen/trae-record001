<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGL CAD 模型浏览器</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <header class="toolbar">
            <h1>WebGL CAD 模型浏览器</h1>
            <div class="toolbar-actions">
                <button id="btn-load">加载 glTF</button>
                <input type="file" id="file-input" accept=".gltf,.glb" hidden>
                <select id="transform-mode">
                    <option value="translate">平移 (T)</option>
                    <option value="rotate">旋转 (R)</option>
                    <option value="scale">缩放 (S)</option>
                </select>
                <button id="btn-deselect">取消选择 (Esc)</button>
            </div>
        </header>
        
        <div class="main-content">
            <aside class="hierarchy-panel">
                <h2>场景层级</h2>
                <div id="scene-tree"></div>
            </aside>
            
            <div class="viewport-container">
                <canvas id="gl-canvas"></canvas>
                <div class="info-overlay">
                    <div id="selection-info">未选择物体</div>
                    <div id="stats">FPS: 60</div>
                </div>
            </div>
            
            <aside class="properties-panel">
                <h2>变换</h2>
                <div id="properties-content">
                    <div class="empty-state">选择物体查看属性</div>
                </div>
            </aside>
            
            <aside class="material-panel" id="material-panel-container">
            </aside>
        </div>
        
        <footer class="status-bar">
            <span id="status-text">就绪</span>
            <span id="model-info"></span>
        </footer>
    </div>

    <script src="js/utils/webgl-utils.js"></script>
    <script src="js/utils/math-utils.js"></script>
    <script src="js/scene_graph.js"></script>
    <script src="js/gltf_loader.js"></script>
    <script src="js/picker.js"></script>
    <script src="js/transform.js"></script>
    <script src="js/material_panel.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
