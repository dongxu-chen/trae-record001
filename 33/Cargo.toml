[package]
name = "password_manager"
version = "0.1.0"
edition = "2021"

[dependencies]
gtk = { version = "0.8", features = ["v4_14"] }
glib = "0.20"
rusqlite = { version = "0.31", features = ["bundled"] }
aes-gcm = "0.10"
argon2 = "0.5"
rand = { version = "0.8", features = ["std_rng"] }
rand_core = "0.6"
base64 = "0.22"
dirs = "5"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
md-5 = "0.10"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "sync", "macros", "time"] }
tokio-tungstenite = "0.23"
tungstenite = "0.23"
futures-util = "0.3"
global-hotkey = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

