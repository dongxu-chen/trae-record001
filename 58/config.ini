[git]
repository_path = .
branch = main
remote = origin

[commit]
message_template = 自动备份: {timestamp}
add_all = true

[push]
max_retries = 3
retry_delay = 5

[log]
enabled = true
log_file = git_auto.log
log_level = INFO

[concurrency]
max_workers = 4

[conflict]
enable_resolution = true

[ssh_keys]
default = ~/.ssh/id_rsa
github = ~/.ssh/id_github
gitlab = ~/.ssh/id_gitlab

[webhook]
host = 0.0.0.0
port = 8080
endpoint = /webhook
secret = your_webhook_secret
platform = github

[webhook_repos]
username/repo1 = /path/to/local/repo1
username/repo2 = /path/to/local/repo2

[repo:project_a]
path = /path/to/project_a
branch = main
remote = origin
message_template = [ProjectA] 备份: {timestamp}
ssh_key = ~/.ssh/id_project_a
enable_conflict_resolution = true

[repo:project_b]
path = /path/to/project_b
branch = develop
remote = upstream
add_all = false
ssh_key = ~/.ssh/id_project_b
