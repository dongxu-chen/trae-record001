version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    hostname: zookeeper
    container_name: distid-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
    volumes:
      - zk-data:/var/lib/zookeeper/data
      - zk-logs:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    hostname: redis
    container_name: distid-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  distid-dc1-1:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    hostname: distid-dc1-1
    container_name: distid-dc1-1
    ports:
      - "8080:8080"
    environment:
      POD_NAME: distid-dc1-1
      ZK_CONNECT_STRING: zookeeper:2181
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATACENTER_ID: 0
      DISTID_DC_CODE: dc1
      DISTID_REGION: cn-east
      DISTID_DC_PRIORITY: 1
      DISTID_SEGMENT_OFFSET: 0
      DISTID_SEGMENT_STEP: 1000000
    depends_on:
      zookeeper:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  distid-dc1-2:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    hostname: distid-dc1-2
    container_name: distid-dc1-2
    ports:
      - "8081:8080"
    environment:
      POD_NAME: distid-dc1-2
      ZK_CONNECT_STRING: zookeeper:2181
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATACENTER_ID: 0
      DISTID_DC_CODE: dc1
      DISTID_REGION: cn-east
      DISTID_DC_PRIORITY: 1
      DISTID_SEGMENT_OFFSET: 0
      DISTID_SEGMENT_STEP: 1000000
    depends_on:
      zookeeper:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  distid-dc2-1:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    hostname: distid-dc2-1
    container_name: distid-dc2-1
    ports:
      - "8090:8080"
    environment:
      POD_NAME: distid-dc2-1
      ZK_CONNECT_STRING: zookeeper:2181
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATACENTER_ID: 1
      DISTID_DC_CODE: dc2
      DISTID_REGION: cn-south
      DISTID_DC_PRIORITY: 2
      DISTID_SEGMENT_OFFSET: 1000000000
      DISTID_SEGMENT_STEP: 1000000
    depends_on:
      zookeeper:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  distid-dc2-2:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    hostname: distid-dc2-2
    container_name: distid-dc2-2
    ports:
      - "8091:8080"
    environment:
      POD_NAME: distid-dc2-2
      ZK_CONNECT_STRING: zookeeper:2181
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATACENTER_ID: 1
      DISTID_DC_CODE: dc2
      DISTID_REGION: cn-south
      DISTID_DC_PRIORITY: 2
      DISTID_SEGMENT_OFFSET: 1000000000
      DISTID_SEGMENT_STEP: 1000000
    depends_on:
      zookeeper:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.47.0
    hostname: prometheus
    container_name: distid-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    depends_on:
      - distid-dc1-1
      - distid-dc1-2
      - distid-dc2-1
      - distid-dc2-2
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.1.0
    hostname: grafana
    container_name: distid-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/distid-dashboard.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  zk-data:
  zk-logs:
  redis-data:
  prometheus-data:
  grafana-data:
