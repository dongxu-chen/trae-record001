server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/smart_schedule?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

optaplanner:
  solver:
    termination:
      seconds-spent-limit: 30

schedule:
  constraint:
    weights:
      required-skill-match: 1000
      no-overlapping-shifts: 500
      max-daily-hours: 200
      max-weekly-hours: 100
      min-weekly-hours: 50
      unavailable-days: 1000
      max-consecutive-days: 300
      max-consecutive-night-shifts: 800
      max-consecutive-night-shifts-limit: 2
      unwanted-shift-types: 20
      preferred-shift-types: 10
      balanced-workload: 5
      shift-rotation: 15
      assign-every-shift: 200

logging:
  level:
    org.optaplanner: INFO
    com.smartschedule: DEBUG
