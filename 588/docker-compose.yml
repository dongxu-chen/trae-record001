version: '3.8'

services:
  zookeeper:
    image: zookeeper:3.8
    container_name: zk-inspector-zk
    ports:
      - "2181:2181"
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: server.1=zookeeper:2888:3888;2181
    volumes:
      - zk-data:/data
      - zk-datalog:/datalog
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zk-inspector-backend
    ports:
      - "8080:8080"
    environment:
      - ZK_SERVERS=zookeeper:2181
      - COLLECTION_INTERVAL=60
      - PREDICTION_INTERVAL=300
    depends_on:
      - zookeeper
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zk-inspector-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  zk-data:
  zk-datalog:
