server:
  port: 8080

spring:
  application:
    name: repair-system

  datasource:
    url: jdbc:mysql://localhost:3306/property_repair?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

repair:
  dispatch:
    max-workload: 5
    timeout-minutes: 30
  remind:
    default-overdue-minutes: 60
    default-interval-minutes: 30
    emergency-overdue-minutes: 15
    emergency-interval-minutes: 10

image:
  upload:
    path: ./uploads
  compression:
    quality: 0.6
    max-width: 1280
    max-height: 1280

satisfaction:
  low-rating-threshold: 2
  consecutive-threshold: 3
  training-days: 7

logging:
  level:
    com.property.repair: debug
    org.drools: info
