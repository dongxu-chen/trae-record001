---
- name: Install Python 3 and pip (Ubuntu/Debian)
  apt:
    name:
      - python3
      - python3-pip
      - python3-venv
    state: present
  when: ansible_os_family == "Debian"

- name: Install Python 3 and pip (CentOS/RHEL)
  yum:
    name:
      - python3
      - python3-pip
    state: present
  when: ansible_os_family == "RedHat"

- name: Upgrade pip to latest version
  pip:
    name: pip
    state: latest
    executable: pip3

- name: Install common Python development packages
  pip:
    name: "{{ python_pip_packages }}"
    state: present
    executable: pip3

- name: Verify Python installation
  command: python3 --version
  register: python_version
  changed_when: false
