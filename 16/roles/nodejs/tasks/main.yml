---
- name: Ensure required packages are installed (Ubuntu/Debian)
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
  when: ansible_os_family == "Debian"

- name: Create keyrings directory (Ubuntu/Debian)
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  when: ansible_os_family == "Debian"

- name: Import NodeSource GPG key (Ubuntu/Debian)
  shell: |
    curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
  args:
    creates: /etc/apt/keyrings/nodesource.gpg
  when: ansible_os_family == "Debian"

- name: Add NodeSource repository (Ubuntu/Debian)
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_{{ nodejs_version }}.x nodistro main"
    state: present
    filename: nodesource
  when: ansible_os_family == "Debian"

- name: Install Node.js (Ubuntu/Debian)
  apt:
    name: nodejs
    state: present
    update_cache: yes
  when: ansible_os_family == "Debian"

- name: Ensure required packages are installed (CentOS/RHEL)
  yum:
    name:
      - ca-certificates
      - curl
    state: present
  when: ansible_os_family == "RedHat"

- name: Import NodeSource GPG key (CentOS/RHEL)
  rpm_key:
    key: https://rpm.nodesource.com/gpgkey/nodesource-repo.gpg.key
    state: present
  when: ansible_os_family == "RedHat"

- name: Add NodeSource repository (CentOS/RHEL)
  yum_repository:
    name: nodesource
    description: Node.js Packages for Enterprise Linux
    baseurl: https://rpm.nodesource.com/pub_{{ nodejs_version }}.x/el/$releasever/$basearch
    gpgcheck: yes
    gpgkey: https://rpm.nodesource.com/gpgkey/nodesource-repo.gpg.key
    enabled: yes
    state: present
  when: ansible_os_family == "RedHat"

- name: Install Node.js (CentOS/RHEL)
  yum:
    name: nodejs
    state: present
    update_cache: yes
  when: ansible_os_family == "RedHat"

- name: Verify Node.js installation
  command: node --version
  register: node_version
  changed_when: false
  failed_when: "'v' not in node_version.stdout"

- name: Verify npm installation
  command: npm --version
  register: npm_version
  changed_when: false

- name: Install global npm packages
  npm:
    name: "{{ item }}"
    global: yes
    state: present
  loop: "{{ nodejs_global_packages }}"
