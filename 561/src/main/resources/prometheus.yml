global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'oauth2-monitor'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
           - alertmanager:9093

rule_files:
  - "oauth2_rules.yml"

scrape_configs:
  - job_name: 'oauth2-monitor-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['localhost:9000']
        labels:
          service: 'oauth2-authorization-server'
          environment: 'development'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
