input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  if [fields][application] == "oauth2-monitor-service" {
    mutate {
      add_field => {
        "service" => "oauth2-authorization-server"
        "log_type" => "oauth2-monitor"
      }
    }

    if [traceId] {
      mutate {
        add_field => { "trace_id" => "%{traceId}" }
      }
    }

    if [level] == "ERROR" or [level] == "WARN" {
      if [message] =~ /ALERT TRIGGERED|CRITICAL SECURITY EVENT|HIGH SECURITY EVENT/ {
        mutate {
          add_field => { "security_alert" => "true" }
          add_tag => ["security-alert"]
        }
      }
    }

    if [message] =~ /Authorization code issued/ {
      mutate {
        add_field => { "event_type" => "authorization_code_issued" }
        add_tag => ["oauth2-event"]
      }
    } else if [message] =~ /Token issued/ {
      mutate {
        add_field => { "event_type" => "token_issued" }
        add_tag => ["oauth2-event"]
      }
    } else if [message] =~ /Token revoked/ {
      mutate {
        add_field => { "event_type" => "token_revoked" }
        add_tag => ["oauth2-event"]
      }
    } else if [message] =~ /Authentication failed/ {
      mutate {
        add_field => { "event_type" => "authentication_failed" }
        add_tag => ["oauth2-event", "security-event"]
      }
    } else if [message] =~ /Brute force attempt/ {
      mutate {
        add_field => { "event_type" => "brute_force_attempt" }
        add_tag => ["oauth2-event", "security-event", "critical"]
      }
    } else if [message] =~ /Token expired/ {
      mutate {
        add_field => { "event_type" => "token_expired" }
        add_tag => ["oauth2-event"]
      }
    } else if [message] =~ /Invalid token/ {
      mutate {
        add_field => { "event_type" => "invalid_token" }
        add_tag => ["oauth2-event", "security-event"]
      }
    }

    grok {
      match => {
        "message" => [
          "clientId: %{DATA:client_id}",
          "userId: %{DATA:user_id}",
          "grantType: %{DATA:grant_type}",
          "traceId: %{DATA:trace_id}",
          "IP: %{IP:source_ip}"
        ]
      }
    }

    date {
      match => [ "@timestamp", "ISO8601" ]
      target => "@timestamp"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://localhost:9200"]
    index => "oauth2-monitor-%{+YYYY.MM.dd}"
  }

  if "security-alert" in [tags] {
    slack {
      url => "YOUR_SLACK_WEBHOOK_URL"
      channel => "#security-alerts"
      username => "OAuth2 Monitor"
      icon_emoji => ":warning:"
      format => "Security Alert: %{message} (Trace ID: %{traceId})"
    }
  }
}
