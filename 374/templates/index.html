<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电力负荷预测平台</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #e0e0e0;
        }

        .header {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px 40px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 28px;
            background: linear-gradient(90deg, #00d4ff, #7b68ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 600;
        }

        .header .status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4caf50;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .container {
            padding: 30px 40px;
        }

        .control-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            align-items: center;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00d4ff, #7b68ee);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .info-badge {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            font-size: 13px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, #00d4ff, #7b68ee);
        }

        .stat-card.warning::before {
            background: linear-gradient(180deg, #ff9800, #ff5722);
        }

        .stat-card.danger::before {
            background: linear-gradient(180deg, #f44336, #e91e63);
        }

        .stat-label {
            font-size: 13px;
            color: #999;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 600;
            color: #fff;
        }

        .stat-value.warning {
            color: #ff9800;
        }

        .stat-value.danger {
            color: #f44336;
        }

        .stat-unit {
            font-size: 14px;
            color: #666;
            margin-left: 5px;
        }

        .chart-section {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .section-title {
            font-size: 18px;
            color: #fff;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background: linear-gradient(180deg, #00d4ff, #7b68ee);
            border-radius: 2px;
        }

        .chart-container {
            width: 100%;
            height: 400px;
        }

        .two-column {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .alert-list {
            max-height: 350px;
            overflow-y: auto;
        }

        .alert-item {
            background: rgba(255, 152, 0, 0.1);
            border-left: 3px solid #ff9800;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .alert-item.danger {
            background: rgba(244, 67, 54, 0.1);
            border-left-color: #f44336;
        }

        .alert-time {
            font-size: 14px;
            color: #ccc;
        }

        .alert-value {
            font-size: 16px;
            font-weight: 600;
        }

        .alert-value.warning {
            color: #ff9800;
        }

        .alert-value.danger {
            color: #f44336;
        }

        .alert-exceed {
            font-size: 12px;
            color: #888;
        }

        .influence-item {
            display: flex;
            align-items: center;
            padding: 15px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .influence-icon {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .influence-icon.temp {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
        }

        .influence-icon.humidity {
            background: linear-gradient(135deg, #74b9ff, #0984e3);
        }

        .influence-icon.holiday {
            background: linear-gradient(135deg, #fdcb6e, #f39c12);
        }

        .influence-icon.pre-holiday {
            background: linear-gradient(135deg, #55efc4, #00b894);
        }

        .influence-icon.post-holiday {
            background: linear-gradient(135deg, #a29bfe, #6c5ce7);
        }

        .breakdown-card {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 3px solid #00d4ff;
        }

        .breakdown-name {
            font-size: 14px;
            color: #fff;
            margin-bottom: 5px;
        }

        .breakdown-bar-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .breakdown-bar {
            flex: 1;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .breakdown-value {
            font-size: 13px;
            color: #888;
            min-width: 80px;
            text-align: right;
        }

        .dr-strategy-card {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 12px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .dr-strategy-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .dr-strategy-name {
            font-size: 15px;
            font-weight: 600;
            color: #fff;
        }

        .dr-strategy-badge {
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            background: rgba(0,212,255,0.2);
            color: #00d4ff;
        }

        .dr-measures {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .dr-measure-tag {
            padding: 4px 10px;
            background: rgba(255,255,255,0.08);
            border-radius: 12px;
            font-size: 12px;
            color: #aaa;
        }

        .pv-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .pv-stat-item {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            border: 1px solid rgba(255,215,0,0.2);
        }

        .pv-stat-label {
            font-size: 13px;
            color: #888;
            margin-bottom: 5px;
        }

        .pv-stat-value {
            font-size: 22px;
            font-weight: 600;
            color: #ffd700;
        }

        .level-excellent {
            background: linear-gradient(135deg, #55efc4, #00b894);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .level-good {
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .level-limited {
            color: #999;
        }

        .influence-info {
            flex: 1;
        }

        .influence-name {
            font-size: 15px;
            color: #fff;
            margin-bottom: 5px;
        }

        .influence-desc {
            font-size: 13px;
            color: #888;
        }

        .influence-bar {
            width: 100px;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-left: 15px;
        }

        .influence-bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .loading-content {
            text-align: center;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(0, 212, 255, 0.2);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 16px;
            color: #00d4ff;
        }

        .hidden {
            display: none !important;
        }

        .alert-summary {
            background: rgba(244, 67, 54, 0.1);
            border: 1px solid rgba(244, 67, 54, 0.3);
            border-radius: 10px;
            padding: 15px 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .alert-summary.warning {
            background: rgba(255, 152, 0, 0.1);
            border-color: rgba(255, 152, 0, 0.3);
        }

        .alert-summary.normal {
            background: rgba(76, 175, 80, 0.1);
            border-color: rgba(76, 175, 80, 0.3);
        }

        .alert-icon {
            font-size: 32px;
        }

        .alert-text {
            flex: 1;
        }

        .alert-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .alert-desc {
            font-size: 13px;
            color: #999;
        }

        .alert-count {
            font-size: 24px;
            font-weight: 600;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="spinner"></div>
            <div class="loading-text">正在训练模型，请稍候...</div>
        </div>
    </div>

    <div class="header">
        <h1>⚡ 电力负荷预测平台</h1>
        <div class="status">
            <span class="status-dot"></span>
            <span>系统运行中</span>
        </div>
    </div>

    <div class="container">
        <div class="control-bar">
            <button class="btn btn-primary" onclick="refreshPrediction()">🔄 刷新预测</button>
            <button class="btn btn-secondary" onclick="showPVChart()">☀️ 光伏出力分析</button>
            <button class="btn btn-secondary" onclick="showBreakdownChart()">🔌 负荷分解</button>
            <button class="btn btn-secondary" onclick="showDRChart()">⚡ 需求响应</button>
            <button class="btn btn-secondary" onclick="showIndustryChart()">📊 行业用电分析</button>
            <button class="btn btn-secondary" onclick="showAttentionChart()">🎯 注意力权重</button>
            <span class="info-badge" id="modelInfo">LSTM + Attention + 位置编码</span>
            <span class="info-badge" id="dataRange">数据范围: 加载中...</span>
        </div>

        <div id="alertSummary" class="alert-summary hidden">
            <span class="alert-icon" id="alertIcon"></span>
            <div class="alert-text">
                <div class="alert-title" id="alertTitle"></div>
                <div class="alert-desc" id="alertDesc"></div>
            </div>
            <div class="alert-count" id="alertCount"></div>
        </div>

        <div class="cards-grid">
            <div class="stat-card">
                <div class="stat-label">预测峰值负荷</div>
                <div class="stat-value" id="peakLoad">--</div>
                <div class="stat-unit">MW</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">预测平均负荷</div>
                <div class="stat-value" id="avgLoad">--</div>
                <div class="stat-unit">MW</div>
            </div>
            <div class="stat-card" id="peakTimeCard">
                <div class="stat-label">高峰时段</div>
                <div class="stat-value" id="peakTime">--</div>
                <div class="stat-unit">时</div>
            </div>
            <div class="stat-card" id="alertCard">
                <div class="stat-label">预警等级</div>
                <div class="stat-value" id="alertLevel">--</div>
            </div>
        </div>

        <div class="chart-section">
            <div class="section-title">未来7天逐小时负荷预测</div>
            <div class="chart-container" id="mainChart"></div>
        </div>

        <div class="two-column">
            <div class="chart-section">
                <div class="section-title">负荷高峰预警</div>
                <div class="alert-list" id="alertList">
                    <div style="text-align:center;color:#666;padding:50px;">加载中...</div>
                </div>
            </div>

            <div class="chart-section">
                <div class="section-title">影响因素分析</div>
                <div id="influenceList">
                    <div style="text-align:center;color:#666;padding:50px;">加载中...</div>
                </div>
            </div>
        </div>

        <div class="chart-section hidden" id="industrySection">
            <div class="section-title">行业用电特征分析</div>
            <div class="chart-container" id="industryChart" style="height:350px;"></div>
        </div>

        <div class="chart-section hidden" id="pvSection">
            <div class="section-title">分布式光伏出力与净负荷分析</div>
            <div id="pvStats" class="pv-stats"></div>
            <div class="chart-container" id="pvChart" style="height:400px;"></div>
        </div>

        <div class="chart-section hidden" id="breakdownSection">
            <div class="section-title">负荷分解分析（NILM）</div>
            <div class="two-column">
                <div id="breakdownList"></div>
                <div class="chart-container" id="breakdownChart" style="height:350px;"></div>
            </div>
            <div class="chart-container" id="breakdownHourlyChart" style="height:300px;margin-top:20px;"></div>
        </div>

        <div class="chart-section hidden" id="drSection">
            <div class="section-title">需求响应潜力评估</div>
            <div class="cards-grid" style="grid-template-columns: repeat(3, 1fr);">
                <div class="stat-card">
                    <div class="stat-label">峰谷差</div>
                    <div class="stat-value" id="drPeakValleyDiff">--</div>
                    <div class="stat-unit">MW</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">总调节潜力</div>
                    <div class="stat-value" id="drTotalPotential">--</div>
                    <div class="stat-unit">MWh</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">调节能力等级</div>
                    <div class="stat-value" id="drLevel">--</div>
                </div>
            </div>
            <div id="drStrategies"></div>
            <div class="chart-container" id="drChart" style="height:300px;margin-top:20px;"></div>
        </div>

        <div class="chart-section hidden" id="attentionSection">
            <div class="section-title">模型注意力权重（关键历史时段）</div>
            <div class="chart-container" id="attentionChart" style="height:350px;"></div>
        </div>
    </div>

    <script>
        let mainChart, industryChart, attentionChart, pvChart, breakdownChart, breakdownHourlyChart, drChart;
        let currentData = null;

        function initCharts() {
            mainChart = echarts.init(document.getElementById('mainChart'));
            industryChart = echarts.init(document.getElementById('industryChart'));
            attentionChart = echarts.init(document.getElementById('attentionChart'));
            pvChart = echarts.init(document.getElementById('pvChart'));
            breakdownChart = echarts.init(document.getElementById('breakdownChart'));
            breakdownHourlyChart = echarts.init(document.getElementById('breakdownHourlyChart'));
            drChart = echarts.init(document.getElementById('drChart'));

            window.addEventListener('resize', function() {
                mainChart.resize();
                industryChart.resize();
                attentionChart.resize();
                pvChart.resize();
                breakdownChart.resize();
                breakdownHourlyChart.resize();
                drChart.resize();
            });
        }

        function renderMainChart(data) {
            const allTimestamps = [...data.history_timestamps, ...data.timestamps];
            const historyValues = [...data.history_values, ...new Array(data.timestamps.length).fill(null)];
            const predValues = [...new Array(data.history_timestamps.length).fill(null), ...data.predictions];

            const option = {
                backgroundColor: 'transparent',
                tooltip: {
                    trigger: 'axis',
                    backgroundColor: 'rgba(0,0,0,0.8)',
                    borderColor: '#333',
                    textStyle: { color: '#fff' },
                    formatter: function(params) {
                        let result = params[0].name + '<br/>';
                        params.forEach(p => {
                            if (p.value !== null && p.value !== undefined) {
                                result += p.marker + p.seriesName + ': ' + p.value.toFixed(2) + ' MW<br/>';
                            }
                        });
                        return result;
                    }
                },
                legend: {
                    data: ['历史负荷', '预测负荷'],
                    textStyle: { color: '#ccc' },
                    top: 10
                },
                grid: {
                    left: 60,
                    right: 30,
                    top: 50,
                    bottom: 60
                },
                xAxis: {
                    type: 'category',
                    data: allTimestamps,
                    axisLine: { lineStyle: { color: '#444' } },
                    axisLabel: {
                        color: '#888',
                        formatter: function(value) {
                            const date = new Date(value);
                            return (date.getMonth() + 1) + '/' + date.getDate() + ' ' + date.getHours() + ':00';
                        },
                        interval: Math.floor(allTimestamps.length / 12)
                    }
                },
                yAxis: {
                    type: 'value',
                    name: '负荷 (MW)',
                    nameTextStyle: { color: '#888' },
                    axisLine: { lineStyle: { color: '#444' } },
                    axisLabel: { color: '#888' },
                    splitLine: { lineStyle: { color: 'rgba(255,255,255,0.05)' } }
                },
                dataZoom: [
                    { type: 'inside', start: 0, end: 100 },
                    { type: 'slider', start: 0, end: 100, height: 20, bottom: 10,
                      textStyle: { color: '#888' }, borderColor: '#444' }
                ],
                series: [
                    {
                        name: '历史负荷',
                        type: 'line',
                        data: historyValues,
                        smooth: true,
                        lineStyle: { color: '#00d4ff', width: 2 },
                        itemStyle: { color: '#00d4ff' },
                        areaStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: 'rgba(0,212,255,0.3)' },
                                { offset: 1, color: 'rgba(0,212,255,0.05)' }
                            ])
                        }
                    },
                    {
                        name: '预测负荷',
                        type: 'line',
                        data: predValues,
                        smooth: true,
                        lineStyle: { color: '#ff9800', width: 2, type: 'dashed' },
                        itemStyle: { color: '#ff9800' },
                        areaStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: 'rgba(255,152,0,0.3)' },
                                { offset: 1, color: 'rgba(255,152,0,0.05)' }
                            ])
                        }
                    }
                ]
            };
            mainChart.setOption(option);
        }

        function renderAlerts(analysis) {
            const alertSummary = document.getElementById('alertSummary');
            const alertIcon = document.getElementById('alertIcon');
            const alertTitle = document.getElementById('alertTitle');
            const alertDesc = document.getElementById('alertDesc');
            const alertCount = document.getElementById('alertCount');

            const alertCard = document.getElementById('alertCard');
            alertCard.className = 'stat-card';

            if (analysis.alert_level === 'severe') {
                alertCard.classList.add('danger');
                alertSummary.className = 'alert-summary';
                alertIcon.textContent = '🔴';
                alertTitle.textContent = '严重预警';
                alertTitle.style.color = '#f44336';
                alertDesc.textContent = '未来7天将有多个时段负荷超过警戒线，请提前做好调度准备';
                alertCount.style.color = '#f44336';
            } else if (analysis.alert_level === 'warning') {
                alertCard.classList.add('warning');
                alertSummary.className = 'alert-summary warning';
                alertIcon.textContent = '🟡';
                alertTitle.textContent = '注意预警';
                alertTitle.style.color = '#ff9800';
                alertDesc.textContent = '部分时段负荷较高，建议关注电网运行状态';
                alertCount.style.color = '#ff9800';
            } else {
                alertSummary.className = 'alert-summary normal';
                alertIcon.textContent = '🟢';
                alertTitle.textContent = '运行正常';
                alertTitle.style.color = '#4caf50';
                alertDesc.textContent = '预测负荷处于正常范围，电网运行平稳';
                alertCount.style.color = '#4caf50';
            }

            const levelMap = { severe: '严重', warning: '注意', normal: '正常' };
            const levelColor = { severe: '#f44336', warning: '#ff9800', normal: '#4caf50' };
            document.getElementById('alertLevel').textContent = levelMap[analysis.alert_level];
            document.getElementById('alertLevel').style.color = levelColor[analysis.alert_level];

            alertCount.textContent = analysis.high_alert_count + ' 时段';
            alertSummary.classList.remove('hidden');

            const alertList = document.getElementById('alertList');
            if (analysis.peak_periods.length === 0) {
                alertList.innerHTML = '<div style="text-align:center;color:#666;padding:50px;">暂无高峰预警</div>';
                return;
            }

            alertList.innerHTML = analysis.peak_periods.map(p => {
                const isDanger = p.level === 'danger';
                const date = new Date(p.time);
                const timeStr = (date.getMonth() + 1) + '/' + date.getDate() + ' ' +
                               date.getHours().toString().padStart(2, '0') + ':00';
                const thresholdStr = p.threshold ? ` (基线: ${p.threshold.toFixed(0)} MW)` : '';
                return `
                    <div class="alert-item ${isDanger ? 'danger' : ''}">
                        <div>
                            <div class="alert-time">${timeStr}${thresholdStr}</div>
                            <div class="alert-exceed">超出基线 ${p.exceed_pct.toFixed(1)}%</div>
                        </div>
                        <div class="alert-value ${isDanger ? 'danger' : 'warning'}">${p.value.toFixed(2)} MW</div>
                    </div>
                `;
            }).join('');
        }

        function renderInfluences(analysis) {
            const influenceList = document.getElementById('influenceList');
            const icons = {

                '节后效应': '⬇️'
            };
            const iconClasses = {
                '温度': 'temp',

                '节假日': 'holiday',
                '节前效应': 'pre-holiday',
                '节后效应': 'post-holiday'
            };

            influenceList.innerHTML = analysis.influences.map(inf => {
                const barWidth = (inf.correlation * 100).toFixed(1);
                const barColor = inf.impact === 'positive' ? '#00d4ff' : '#ff9800';
                return `
                    <div class="influence-item">
                        <div class="influence-icon ${iconClasses[inf.factor]}">${icons[inf.factor]}</div>
                        <div class="influence-info">
                            <div class="influence-name">${inf.factor}</div>

                        </div>

        async function refreshPrediction() {
            showLoading();
            try {
                const response = await fetch('/api/predict');
                const result = await response.json();

                if (result.success) {
                    currentData = result.data;
                    renderMainChart(currentData);
                    renderStats(currentData.analysis);
                    renderAlerts(currentData.analysis);
                    renderInfluences(currentData.analysis);

                    const startDate = new Date(currentData.timestamps[0]);
                    const endDate = new Date(currentData.timestamps[currentData.timestamps.length - 1]);
                    document.getElementById('dataRange').textContent =
                        `预测: ${startDate.getMonth() + 1}/${startDate.getDate()} - ${endDate.getMonth() + 1}/${endDate.getDate()}`;
                }
            } catch (error) {
                console.error('预测失败:', error);
                alert('预测失败，请检查后端服务是否正常启动');
            }
            hideLoading();
        }

        function renderDRChart(data) {
            document.getElementById('drPeakValleyDiff').textContent = data.peak_valley_diff.toFixed(1);
            document.getElementById('drTotalPotential').textContent = data.total_dr_potential_mwh.toFixed(1);

            const levelMap = { excellent: '优秀', good: '良好', limited: '有限' };
            const levelClass = { excellent: 'level-excellent', good: 'level-good', limited: 'level-limited' };
            const levelEl = document.getElementById('drLevel');
            levelEl.textContent = levelMap[data.dr_level] || data.dr_level;
            levelEl.className = 'stat-value ' + levelClass[data.dr_level];

            const typeNames = { peak_shaving: '削峰', valley_filling: '填谷', pv_local_consumption: '光伏消纳' };
            const typeColors = { peak_shaving: '#ff6b6b', valley_filling: '#55efc4', pv_local_consumption: '#ffd700' };

            const strategiesHtml = data.strategies.map(s => {
                const potential = s.potential_mw || s.total_reduction_mwh || s.total_increase_mwh || 0;
                const potentialKey = s.total_reduction_mwh ? '总削减' : (s.total_increase_mwh ? '总增加' : '总消纳');
                const potentialValue = s.total_reduction_mwh || s.total_increase_mwh || s.total_consumption_mwh || 0;
                const economicKey = s.economic_saving ? '节约电费' : '经济效益';
                const economicValue = s.economic_saving || s.economic_benefit || 0;

                return `
                    <div class="dr-strategy-card">
                        <div class="dr-strategy-header">
                            <div class="dr-strategy-name">${s.name}</div>
                            <span class="dr-strategy-badge" style="background:${typeColors[s.type]}20;color:${typeColors[s.type]}">${typeNames[s.type]}</span>
                        </div>
                        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px;">
                            <div>
                                <div style="font-size:12px;color:#888;">目标时段</div>
                                <div style="color:#fff;font-size:14px;">${s.target_hours.map(h=>h+':00').join(', ')}</div>
                            </div>
                            <div>
                                <div style="font-size:12px;color:#888;">调节潜力</div>
                                <div style="color:${typeColors[s.type]};font-size:16px;font-weight:600;">${potential.toFixed(1)} MW</div>
                            </div>
                            <div>
                                <div style="font-size:12px;color:#888;">${potentialKey}</div>
                                <div style="color:#fff;font-size:14px;">${potentialValue.toFixed(1)} MWh</div>
                            </div>
                        </div>
                        <div style="margin-top:8px;">
                            <div style="font-size:12px;color:#888;">${economicKey}: ¥${economicValue.toFixed(0)}</div>
                        </div>
                        <div class="dr-measures">
                            ${s.measures.map(m => `<span class="dr-measure-tag">${m}</span>`).join('')}
                        </div>
                    </div>
                `;
            }).join('');
            document.getElementById('drStrategies').innerHTML = strategiesHtml;

            if (data.flexibility_by_hour) {
                const hours = Object.keys(data.flexibility_by_hour).sort();
                const flexData = hours.map(h => data.flexibility_by_hour[h]);

                const drOption = {
                    backgroundColor: 'transparent',
                    tooltip: {
                        trigger: 'axis',
                        backgroundColor: 'rgba(0,0,0,0.8)',
                        textStyle: { color: '#fff' },
                        formatter: '{b}<br/>灵活性占比: {c}%'
                    },
                    grid: { left: 50, right: 20, top: 30, bottom: 30 },
                    xAxis: {
                        type: 'category',
                        data: hours.map(h => h + ':00'),
                        axisLine: { lineStyle: { color: '#444' } },
                        axisLabel: { color: '#888', fontSize: 11 }
                    },
                    yAxis: {
                        type: 'value',
                        name: '灵活性 (%)',
                        nameTextStyle: { color: '#888' },
                        axisLine: { lineStyle: { color: '#444' } },
                        axisLabel: { color: '#888', formatter: '{value}%' },
                        splitLine: { lineStyle: { color: 'rgba(255,255,255,0.05)' } }
                    },
                    series: [{
                        type: 'line',
                        data: flexData,
                        smooth: true,
                        lineStyle: { color: '#7b68ee', width: 2 },
                        itemStyle: { color: '#7b68ee' },
                        areaStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: 'rgba(123,104,238,0.4)' },
                                { offset: 1, color: 'rgba(123,104,238,0.05)' }
                            ])
                        }
                    }]
                };
                drChart.setOption(drOption);
            }
        }

        function showLoading() {
            document.getElementById('loadingOverlay').classList.remove('hidden');
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').classList.add('hidden');
        }

        document.addEventListener('DOMContentLoaded', function() {
            initCharts();
            setTimeout(refreshPrediction, 2000);
        });
