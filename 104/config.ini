[Settings]
log_dir = ./logs
archive_dir = ./archive
retention_days = 7
compress_level = 6
content_filter = ERROR|WARN
case_sensitive = false

[Email]
smtp_host = smtp.example.com
smtp_port = 465
smtp_user = noreply@example.com
smtp_password = your_password
from_addr = Log Archiver <noreply@example.com>
to_addrs = admin@example.com, dev@example.com
use_tls = true
