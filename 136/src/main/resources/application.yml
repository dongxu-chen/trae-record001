server:
  port: 8080
  servlet:
    context-path: /risk-engine

spring:
  application:
    name: risk-engine
  datasource:
    url: jdbc:h2:mem:riskdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  redis:
    host: localhost
    port: 6379
    password:
    database: 0
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1ms

logging:
  level:
    com.risk.engine: DEBUG
    org.drools: INFO
    org.springframework.data.redis: INFO

springfox:
  documentation:
    enabled: true
    swagger-ui:
      enabled: true

risk:
  engine:
    bloom-filter:
      expected-insertions: 1000000
      fpp: 0.01
    cache:
      expire-hours: 24
