<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交通态势仿真系统</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>🚦 交通态势仿真系统</h1>
            <div class="header-info">
                <span id="sim-time">时间: 0</span>
                <span id="congestion-index">拥堵指数: 0.00</span>
                <span id="avg-speed">平均车速: 0 m/s</span>
            </div>
        </header>

        <div class="main-content">
            <div class="sidebar">
                <div class="panel">
                    <h2>📊 仿真控制</h2>
                    <div class="control-group">
                        <label>仿真步数</label>
                        <input type="number" id="sim-steps" value="100" min="1">
                    </div>
                    <div class="control-group">
                        <label>车辆生成率</label>
                        <input type="number" id="gen-rate" value="0.3" min="0" max="1" step="0.1">
                    </div>
                    <div class="control-group">
                        <label>最大车速 (m/s)</label>
                        <input type="number" id="max-speed" value="14" min="1">
                    </div>
                    <div class="button-group">
                        <button id="btn-init" class="btn btn-primary">初始化仿真</button>
                        <button id="btn-step" class="btn btn-secondary">单步运行</button>
                        <button id="btn-run" class="btn btn-success">开始仿真</button>
                        <button id="btn-reset" class="btn btn-danger">重置</button>
                    </div>
                </div>

                <div class="panel">
                    <h2>📈 实时数据</h2>
                    <div class="metric-card">
                        <div class="metric-label">总车辆数</div>
                        <div class="metric-value" id="total-vehicles">0</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">已完成车辆</div>
                        <div class="metric-value" id="completed-vehicles">0</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">平均排队长度</div>
                        <div class="metric-value" id="avg-queue">0</div>
                    </div>
                </div>

                <div class="panel">
                    <h2>🛣️ 路段状态</h2>
                    <div id="road-status" class="road-status-container">
                    </div>
                </div>

                <div class="panel">
                    <h2>⚙️ 信号配时优化</h2>
                    <div class="control-group">
                        <label>优化算法</label>
                        <select id="opt-algorithm">
                            <option value="hill_climb">爬山法</option>
                            <option value="genetic">遗传算法</option>
                            <option value="grid_search">网格搜索</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label>迭代次数</label>
                        <input type="number" id="opt-iterations" value="10" min="1">
                    </div>
                    <div class="button-group">
                        <button id="btn-optimize" class="btn btn-warning">开始优化</button>
                        <button id="btn-apply-opt" class="btn btn-info" disabled>应用优化结果</button>
                    </div>
                    <div id="opt-result" class="opt-result"></div>
                </div>
            </div>

            <div class="map-container">
                <div id="map"></div>
                <div class="map-controls">
                    <label class="checkbox-label">
                        <input type="checkbox" id="show-heatmap" checked>
                        显示车速热力图
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="show-vehicles" checked>
                        显示车辆
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="show-roads" checked>
                        显示路段
                    </label>
                </div>
                <div class="legend">
                    <h3>图例</h3>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #2ecc71;"></div>
                        <span>畅通 (密度 < 30%)</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #f39c12;"></div>
                        <span>缓行 (30% - 60%)</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #e67e22;"></div>
                        <span>拥堵 (60% - 80%)</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #e74c3c;"></div>
                        <span>严重拥堵 (> 80%)</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: linear-gradient(to right, #2ecc71, #e74c3c);"></div>
                        <span>车速热力 (高→低)</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    <script src="{{ url_for('static', filename='js/config.js') }}"></script>
    <script src="{{ url_for('static', filename='js/map.js') }}"></script>
    <script src="{{ url_for('static', filename='js/simulation.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
