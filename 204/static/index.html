<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>销售数据可视化仪表板</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 20px 30px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .filters {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .filter-group label {
            color: #555;
            font-weight: 500;
            white-space: nowrap;
        }

        .filter-group input,
        .filter-group select {
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .filter-group input:focus,
        .filter-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .btn-success {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
        }

        .btn-warning {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .card-title {
            color: #666;
            font-size: 14px;
            font-weight: 500;
        }

        .card-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .card-value {
            font-size: 32px;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
            transition: all 0.3s;
        }

        .card-value.updating {
            opacity: 0.6;
            transform: scale(0.98);
        }

        .card-change {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }

        .card-change.positive {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .card-change.negative {
            background: #ffebee;
            color: #c62828;
        }

        .growth-subtitle {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
        }

        .charts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .chart-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .chart-card.full {
            grid-column: 1 / -1;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .chart-title {
            color: #333;
            font-size: 18px;
            font-weight: 600;
        }

        .chart-actions {
            display: flex;
            gap: 10px;
        }

        .year-select {
            padding: 6px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
        }

        .chart-container {
            width: 100%;
            height: 350px;
        }

        .loading {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .modal-footer {
            display: flex;
            gap: 10px;
            margin-top: 25px;
            justify-content: flex-end;
        }

        .subscription-list {
            margin-top: 15px;
        }

        .subscription-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .subscription-info {
            flex: 1;
        }

        .subscription-email {
            font-weight: 500;
            color: #333;
        }

        .subscription-meta {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }

        .subscription-actions {
            display: flex;
            gap: 8px;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
        }

        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            margin-left: 8px;
        }

        .status-active {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status-inactive {
            background: #ffebee;
            color: #c62828;
        }

        @media (max-width: 992px) {
            .charts {
                grid-template-columns: 1fr;
            }
            
            .header-row {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 销售数据可视化仪表板</h1>
            <div class="header-row">
                <div class="filters">
                    <div class="filter-group">
                        <label>开始日期:</label>
                        <input type="date" id="startDate">
                    </div>
                    <div class="filter-group">
                        <label>结束日期:</label>
                        <input type="date" id="endDate">
                    </div>
                    <div class="filter-group">
                        <label>品类:</label>
                        <select id="category">
                            <option value="全部">全部</option>
                        </select>
                    </div>
                    <button class="btn" onclick="loadData()">🔍 查询</button>
                    <button class="btn btn-secondary" onclick="resetFilters()">🔄 重置</button>
                    <span id="loadingIndicator" class="loading" style="display: none;"></span>
                </div>
                <div class="btn-group">
                    <button class="btn btn-secondary" onclick="exportData('excel')">📥 导出Excel</button>
                    <button class="btn btn-success" onclick="exportData('csv')">📄 导出CSV</button>
                    <button class="btn btn-warning" onclick="openSubscriptionModal()">📧 订阅推送</button>
                </div>
            </div>
        </div>

        <div class="cards">
            <div class="card">
                <div class="card-header">
                    <span class="card-title">总销售额</span>
                    <div class="card-icon" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">💰</div>
                </div>
                <div class="card-value" id="totalSales">¥0</div>
                <div class="card-change positive" id="salesChange">
                    <span>↑</span> 0%
                </div>
            </div>
            <div class="card">
                <div class="card-header">
                    <span class="card-title">订单数</span>
                    <div class="card-icon" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">📦</div>
                </div>
                <div class="card-value" id="totalOrders">0</div>
                <div class="card-change positive">
                    <span>📈</span> 累计订单
                </div>
            </div>
            <div class="card">
                <div class="card-header">
                    <span class="card-title">客单价</span>
                    <div class="card-icon" style="background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);">💳</div>
                </div>
                <div class="card-value" id="avgOrder">¥0</div>
                <div class="card-change positive">
                    <span>📊</span> 平均每单
                </div>
            </div>
            <div class="card">
                <div class="card-header">
                    <span class="card-title">日环比增长率</span>
                    <div class="card-icon" style="background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);">🚀</div>
                </div>
                <div class="card-value" id="growthRate">0%</div>
                <div class="card-change positive" id="growthStatus">
                    <span>↑</span> 较昨日
                </div>
                <div class="growth-subtitle" id="periodGrowth">期间环比: 0%</div>
            </div>
        </div>

        <div class="charts">
            <div class="chart-card full">
                <div class="chart-title">📈 每日销售额趋势</div>
                <div class="chart-container" id="salesTrendChart"></div>
            </div>
        </div>

        <div class="charts">
            <div class="chart-card">
                <div class="chart-title">🥧 各品类销售占比</div>
                <div class="chart-container" id="categoryChart"></div>
            </div>
            <div class="chart-card">
                <div class="chart-title">🏆 各区域销售排行</div>
                <div class="chart-container" id="regionChart"></div>
            </div>
        </div>

        <div class="charts">
            <div class="chart-card full">
                <div class="chart-header">
                    <div class="chart-title">📅 同比分析 - 年度销售对比</div>
                    <div class="chart-actions">
                        <select class="year-select" id="yearSelect" onchange="loadYearlyComparison()">
                        </select>
                    </div>
                </div>
                <div class="chart-container" id="yearlyChart"></div>
            </div>
        </div>
    </div>

    <div class="modal" id="subscriptionModal">
        <div class="modal-content">
            <div class="modal-title">📧 仪表板订阅管理</div>
            
            <div class="form-group">
                <label>邮箱地址</label>
                <input type="email" id="subscribeEmail" placeholder="请输入接收邮件的邮箱">
            </div>
            
            <div class="form-group">
                <label>推送频率</label>
                <select id="subscribeFrequency">
                    <option value="daily">每日推送（每天早上9点）</option>
                    <option value="weekly">每周推送（每周一早上9点）</option>
                </select>
            </div>
            
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeSubscriptionModal()">取消</button>
                <button class="btn" onclick="addSubscription()">添加订阅</button>
            </div>
            
            <div class="subscription-list" id="subscriptionList">
            </div>
        </div>
    </div>

    <script>
        let salesTrendChart, categoryChart, regionChart, yearlyChart;
        let currentData = null;
        let isLoading = false;
        let debounceTimer = null;

        const CHART_COLORS = ['#667eea', '#764ba2', '#f093fb', '#f5576c', '#4facfe', '#43e97b', '#fa709a', '#fee140'];

        function initCharts() {
            salesTrendChart = echarts.init(document.getElementById('salesTrendChart'));
            categoryChart = echarts.init(document.getElementById('categoryChart'));
            regionChart = echarts.init(document.getElementById('regionChart'));
            yearlyChart = echarts.init(document.getElementById('yearlyChart'));

            initEmptyCharts();
            initYearSelect();

            window.addEventListener('resize', function() {
                salesTrendChart.resize();
                categoryChart.resize();
                regionChart.resize();
                yearlyChart.resize();
            });
        }

        function initEmptyCharts() {
            salesTrendChart.setOption({
                tooltip: {
                    trigger: 'axis',
                    formatter: function(params) {
                        let result = params[0].axisValue + '<br/>';
                        params.forEach(item => {
                            result += item.marker + item.seriesName + ': ' + 
                                (item.seriesName === '销售额' ? formatCurrency(item.value) : item.value + '单') + '<br/>';
                        });
                        return result;
                    }
                },
                legend: { data: ['销售额', '订单数'], top: 0 },
                grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
                xAxis: { type: 'category', boundaryGap: false, data: [], axisLabel: { rotate: 45, fontSize: 11 } },
                yAxis: [
                    { type: 'value', name: '销售额(元)', position: 'left' },
                    { type: 'value', name: '订单数', position: 'right' }
                ],
                series: [
                    {
                        name: '销售额',
                        type: 'line',
                        smooth: true,
                        yAxisIndex: 0,
                        data: [],
                        lineStyle: {
                            width: 3,
                            color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
                                { offset: 0, color: '#667eea' },
                                { offset: 1, color: '#764ba2' }
                            ])
                        },
                        areaStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: 'rgba(102, 126, 234, 0.3)' },
                                { offset: 1, color: 'rgba(118, 75, 162, 0.1)' }
                            ])
                        },
                        itemStyle: { color: '#667eea' }
                    },
                    {
                        name: '订单数',
                        type: 'bar',
                        yAxisIndex: 1,
                        data: [],
                        itemStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: '#43e97b' },
                                { offset: 1, color: '#38f9d7' }
                            ])
                        }
                    }
                ]
            }, false);

            categoryChart.setOption({
                tooltip: { trigger: 'item', formatter: '{b}: {c}元 ({d}%)' },
                legend: { orient: 'vertical', right: 10, top: 'center' },
                series: [{
                    type: 'pie',
                    radius: ['40%', '70%'],
                    center: ['40%', '50%'],
                    avoidLabelOverlap: false,
                    itemStyle: { borderRadius: 10, borderColor: '#fff', borderWidth: 2 },
                    label: { show: true, formatter: '{b}\n{d}%' },
                    emphasis: { label: { show: true, fontSize: 16, fontWeight: 'bold' } },
                    data: [],
                    color: CHART_COLORS
                }]
            }, false);

            regionChart.setOption({
                tooltip: {
                    trigger: 'axis',
                    axisPointer: { type: 'shadow' },
                    formatter: function(params) {
                        return params[0].name + '<br/>' + 
                               params[0].marker + '销售额: ' + formatCurrency(params[0].value);
                    }
                },
                grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
                xAxis: { type: 'value' },
                yAxis: { type: 'category', data: [] },
                series: [{
                    type: 'bar',
                    data: [],
                    itemStyle: {
                        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
                            { offset: 0, color: '#667eea' },
                            { offset: 1, color: '#764ba2' }
                        ]),
                        borderRadius: [0, 8, 8, 0]
                    },
                    label: {
                        show: true,
                        position: 'right',
                        formatter: function(params) {
                            return (params.value / 10000).toFixed(1) + '万';
                        }
                    }
                }]
            }, false);

            yearlyChart.setOption({
                tooltip: {
                    trigger: 'axis',
                    axisPointer: { type: 'shadow' },
                    formatter: function(params) {
                        let result = params[0].axisValue + '<br/>';
                        params.forEach(item => {
                            result += item.marker + item.seriesName + ': ' + formatCurrency(item.value) + '<br/>';
                        });
                        return result;
                    }
                },
                legend: { data: ['今年销售额', '去年销售额'], top: 0 },
                grid: { left: '3%', right: '4%', bottom: '15%', containLabel: true },
                xAxis: { type: 'category', data: [] },
                yAxis: { type: 'value', name: '销售额(元)' },
                series: [
                    {
                        name: '今年销售额',
                        type: 'bar',
                        data: [],
                        itemStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: '#667eea' },
                                { offset: 1, color: '#764ba2' }
                            ])
                        }
                    },
                    {
                        name: '去年销售额',
                        type: 'bar',
                        data: [],
                        itemStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: '#e0e0e0' },
                                { offset: 1, color: '#bdbdbd' }
                            ])
                        }
                    }
                ]
            }, false);
        }

        function initYearSelect() {
            const currentYear = new Date().getFullYear();
            const select = document.getElementById('yearSelect');
            for (let year = currentYear; year >= currentYear - 5; year--) {
                const option = document.createElement('option');
                option.value = year;
                option.textContent = year + '年';
                select.appendChild(option);
            }
        }

        function formatCurrency(value) {
            return '¥' + value.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function setDefaultDates() {
            const end = new Date();
            const start = new Date();
            start.setDate(start.getDate() - 30);

            document.getElementById('startDate').value = start.toISOString().split('T')[0];
            document.getElementById('endDate').value = end.toISOString().split('T')[0];
        }

        async function loadCategories() {
            try {
                const response = await fetch('/api/categories');
                const data = await response.json();
                const select = document.getElementById('category');
                select.innerHTML = '<option value="全部">全部</option>';
                data.categories.forEach(cat => {
                    if (cat !== '全部') {
                        const option = document.createElement('option');
                        option.value = cat;
                        option.textContent = cat;
                        select.appendChild(option);
                    }
                });
            } catch (error) {
                console.error('加载品类失败:', error);
            }
        }

        function setLoading(loading) {
            isLoading = loading;
            const indicator = document.getElementById('loadingIndicator');
            indicator.style.display = loading ? 'inline-block' : 'none';
        }

        function debounce(func, wait) {
            return function(...args) {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => func.apply(this, args), wait);
            };
        }

        function getFilterParams() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const category = document.getElementById('category').value;

            const params = new URLSearchParams();
            if (startDate) params.append('start_date', startDate);
            if (endDate) params.append('end_date', endDate);
            if (category) params.append('category', category);
            return params;
        }

        async function loadData() {
            if (isLoading) return;

            const params = getFilterParams();
            setLoading(true);
            animateValuesUpdating(true);

            try {
                const response = await fetch(`/api/all-data?${params}`);
                const data = await response.json();
                currentData = data;

                updateSummary(data.summary);
                updateSalesTrendChartIncremental(data.daily_sales);
                updateCategoryChartIncremental(data.category_sales);
                updateRegionChartIncremental(data.region_sales);
            } catch (error) {
                console.error('加载数据失败:', error);
            } finally {
                setLoading(false);
                animateValuesUpdating(false);
            }
        }

        async function loadYearlyComparison() {
            const year = document.getElementById('yearSelect').value;
            const category = document.getElementById('category').value;

            const params = new URLSearchParams();
            params.append('year', year);
            if (category && category !== '全部') params.append('category', category);

            try {
                const response = await fetch(`/api/yearly-comparison?${params}`);
                const data = await response.json();
                updateYearlyChart(data);
            } catch (error) {
                console.error('加载同比数据失败:', error);
            }
        }

        function updateYearlyChart(data) {
            yearlyChart.setOption({
                xAxis: { data: data.months },
                series: [
                    { name: '今年销售额', data: data.current_year_sales },
                    { name: '去年销售额', data: data.last_year_sales }
                ]
            }, {
                notMerge: false,
                lazyUpdate: true,
                silent: true
            });
        }

        function animateValuesUpdating(updating) {
            const elements = ['totalSales', 'totalOrders', 'avgOrder', 'growthRate'];
            elements.forEach(id => {
                const el = document.getElementById(id);
                if (updating) {
                    el.classList.add('updating');
                } else {
                    el.classList.remove('updating');
                }
            });
        }

        function updateSummary(data) {
            animateValue('totalSales', data.total_sales, 'currency');
            animateValue('totalOrders', data.total_orders, 'number');
            animateValue('avgOrder', data.avg_order_value, 'currency');
            animateValue('growthRate', data.daily_growth_rate, 'percent');

            const growthStatus = document.getElementById('growthStatus');
            const salesChange = document.getElementById('salesChange');
            const periodGrowth = document.getElementById('periodGrowth');
            
            if (data.daily_growth_rate >= 0) {
                growthStatus.className = 'card-change positive';
                growthStatus.innerHTML = '<span>↑</span> 较昨日增长';
            } else {
                growthStatus.className = 'card-change negative';
                growthStatus.innerHTML = '<span>↓</span> 较昨日下降';
            }

            if (data.period_growth_rate >= 0) {
                salesChange.className = 'card-change positive';
                salesChange.innerHTML = `<span>↑</span> 期间 ${data.period_growth_rate.toFixed(2)}%`;
            } else {
                salesChange.className = 'card-change negative';
                salesChange.innerHTML = `<span>↓</span> 期间 ${Math.abs(data.period_growth_rate).toFixed(2)}%`;
            }

            periodGrowth.textContent = `期间环比: ${data.period_growth_rate >= 0 ? '+' : ''}${data.period_growth_rate.toFixed(2)}%`;
        }

        function animateValue(elementId, endValue, type) {
            const element = document.getElementById(elementId);
            const startValue = parseCurrentValue(element.textContent, type);
            const duration = 500;
            const startTime = performance.now();

            function update(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easeProgress = 1 - Math.pow(1 - progress, 3);
                const currentValue = startValue + (endValue - startValue) * easeProgress;

                element.textContent = formatValue(currentValue, type);

                if (progress < 1) {
                    requestAnimationFrame(update);
                }
            }

            requestAnimationFrame(update);
        }

        function parseCurrentValue(text, type) {
            const cleaned = text.replace(/[¥,%]/g, '').replace(/,/g, '');
            const value = parseFloat(cleaned);
            return isNaN(value) ? 0 : value;
        }

        function formatValue(value, type) {
            switch (type) {
                case 'currency':
                    return formatCurrency(value);
                case 'number':
                    return Math.round(value).toLocaleString();
                case 'percent':
                    return value.toFixed(2) + '%';
                default:
                    return value.toFixed(2);
            }
        }

        function updateSalesTrendChartIncremental(data) {
            salesTrendChart.setOption({
                xAxis: { data: data.dates },
                series: [
                    { name: '销售额', data: data.sales },
                    { name: '订单数', data: data.orders }
                ]
            }, {
                notMerge: false,
                lazyUpdate: true,
                silent: true
            });
        }

        function updateCategoryChartIncremental(data) {
            const pieData = data.categories.map((cat, index) => ({
                value: data.sales[index],
                name: cat
            }));

            categoryChart.setOption({
                series: [{ data: pieData }]
            }, {
                notMerge: false,
                lazyUpdate: true,
                silent: true
            });
        }

        function updateRegionChartIncremental(data) {
            regionChart.setOption({
                yAxis: { data: data.regions },
                series: [{ data: data.sales }]
            }, {
                notMerge: false,
                lazyUpdate: true,
                silent: true
            });
        }

        function resetFilters() {
            setDefaultDates();
            document.getElementById('category').value = '全部';
            loadData();
            loadYearlyComparison();
        }

        function exportData(format) {
            const params = getFilterParams();
            const url = format === 'excel' ? '/api/export/excel' : '/api/export/csv';
            window.open(`${url}?${params}`, '_blank');
        }

        function openSubscriptionModal() {
            document.getElementById('subscriptionModal').classList.add('show');
            loadSubscriptions();
        }

        function closeSubscriptionModal() {
            document.getElementById('subscriptionModal').classList.remove('show');
        }

        async function loadSubscriptions() {
            try {
                const response = await fetch('/api/subscriptions');
                const data = await response.json();
                renderSubscriptions(data.subscriptions);
            } catch (error) {
                console.error('加载订阅列表失败:', error);
            }
        }

        function renderSubscriptions(subscriptions) {
            const container = document.getElementById('subscriptionList');
            if (subscriptions.length === 0) {
                container.innerHTML = '<p style="color: #888; text-align: center; padding: 20px;">暂无订阅</p>';
                return;
            }

            container.innerHTML = subscriptions.map(sub => `
                <div class="subscription-item">
                    <div class="subscription-info">
                        <div>
                            <span class="subscription-email">${sub.email}</span>
                            <span class="status-badge ${sub.is_active ? 'status-active' : 'status-inactive'}">
                                ${sub.is_active ? '已激活' : '已停用'}
                            </span>
                        </div>
                        <div class="subscription-meta">
                            ${sub.frequency === 'daily' ? '每日推送' : '每周推送'} | 
                            创建于: ${new Date(sub.created_at).toLocaleDateString()}
                            ${sub.last_sent ? ' | 上次发送: ' + new Date(sub.last_sent).toLocaleDateString() : ''}
                        </div>
                    </div>
                    <div class="subscription-actions">
                        <button class="btn btn-small btn-secondary" onclick="toggleSubscription(${sub.id})">
                            ${sub.is_active ? '停用' : '激活'}
                        </button>
                        <button class="btn btn-small btn-warning" onclick="deleteSubscription(${sub.id})">
                            删除
                        </button>
                    </div>
                </div>
            `).join('');
        }

        async function addSubscription() {
            const email = document.getElementById('subscribeEmail').value;
            const frequency = document.getElementById('subscribeFrequency').value;

            if (!email) {
                alert('请输入邮箱地址');
                return;
            }

            const params = new URLSearchParams();
            params.append('email', email);
            params.append('frequency', frequency);

            try {
                const response = await fetch(`/api/subscriptions?${params}`, { method: 'POST' });
                const data = await response.json();
                alert(data.message);
                document.getElementById('subscribeEmail').value = '';
                loadSubscriptions();
            } catch (error) {
                console.error('添加订阅失败:', error);
                alert('添加订阅失败');
            }
        }

        async function toggleSubscription(id) {
            try {
                await fetch(`/api/subscriptions/${id}/toggle`, { method: 'PUT' });
                loadSubscriptions();
            } catch (error) {
                console.error('切换订阅状态失败:', error);
            }
        }

        async function deleteSubscription(id) {
            if (!confirm('确定要删除这个订阅吗？')) return;

            try {
                await fetch(`/api/subscriptions/${id}`, { method: 'DELETE' });
                loadSubscriptions();
            } catch (error) {
                console.error('删除订阅失败:', error);
            }
        }

        const debouncedLoadData = debounce(loadData, 300);

        function setupFilterListeners() {
            const startDate = document.getElementById('startDate');
            const endDate = document.getElementById('endDate');
            const category = document.getElementById('category');

            startDate.addEventListener('change', () => {
                debouncedLoadData();
                loadYearlyComparison();
            });
            endDate.addEventListener('change', () => {
                debouncedLoadData();
                loadYearlyComparison();
            });
            category.addEventListener('change', () => {
                debouncedLoadData();
                loadYearlyComparison();
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            initCharts();
            setDefaultDates();
            loadCategories();
            setupFilterListeners();
            loadData();
            loadYearlyComparison();
        });

        document.getElementById('subscriptionModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeSubscriptionModal();
            }
        });
    </script>
</body>
</html>
