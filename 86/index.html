<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 卫星轨迹可视化</title>
    <link href="https://cdn.jsdelivr.net/npm/cesium@1.114.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        #cesiumContainer {
            width: 100%;
            height: 100%;
        }
        
        #controlPanel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            z-index: 100;
            max-width: 350px;
        }
        
        #controlPanel h2 {
            margin-bottom: 10px;
            font-size: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.3);
            padding-bottom: 5px;
        }
        
        .control-group {
            margin-bottom: 10px;
        }
        
        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
        }
        
        #timeDisplay {
            font-size: 14px;
            margin-bottom: 10px;
            padding: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
        }
        
        button {
            padding: 6px 12px;
            margin-right: 5px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        
        button:hover {
            opacity: 0.8;
        }
        
        .btn-primary {
            background: #2ecc71;
            color: white;
        }
        
        .btn-danger {
            background: #e74c3c;
            color: white;
        }
        
        .btn-info {
            background: #3498db;
            color: white;
        }
        
        #satelliteList {
            max-height: 150px;
            overflow-y: auto;
            margin-top: 10px;
        }
        
        .satellite-item {
            padding: 5px;
            margin: 2px 0;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .satellite-item:hover {
            background: rgba(255,255,255,0.2);
        }
        
        .satellite-item.active {
            background: rgba(52, 152, 219, 0.5);
            border-left: 3px solid #3498db;
        }
        
        .time-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }
        
        .time-controls input[type="range"] {
            flex: 1;
        }
        
        #speedDisplay {
            min-width: 60px;
            text-align: center;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>
    
    <div id="controlPanel">
        <h2>卫星轨迹可视化</h2>
        
        <div id="timeDisplay">当前时间: 计算中...</div>
        
        <div class="control-group">
            <label>控制按钮:</label>
            <button class="btn-primary" onclick="togglePlay()">播放/暂停</button>
            <button class="btn-info" onclick="resetTime()">重置</button>
        </div>
        
        <div class="control-group">
            <label>时间速度:</label>
            <div class="time-controls">
                <input type="range" id="speedSlider" min="-100" max="100" value="1">
                <span id="speedDisplay">1x</span>
            </div>
        </div>
        
        <div class="control-group">
            <label>卫星列表:</label>
            <div id="satelliteList"></div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/cesium@1.114.0/Build/Cesium/Cesium.js"></script>
    <script src="satellite.js"></script>
    <script src="orbit.js"></script>
    <script src="timeline.js"></script>
    <script src="satellite_list.js"></script>
    <script src="ground_station.js"></script>
    <script src="cesium_init.js"></script>
</body>
</html>
