apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-service
  namespace: gray-release
  labels:
    app: release-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: release-service
  template:
    metadata:
      labels:
        app: release-service
    spec:
      containers:
        - name: release-service
          image: gray-release/release-service:1.0.0
          ports:
            - containerPort: 8081
          env:
            - name: KAFKA_SERVERS
              value: "kafka:9092"
            - name: PROMETHEUS_URL
              value: "http://prometheus:9090"
            - name: K8S_NAMESPACE
              value: "gray-release"
            - name: K8S_USE_ENDPOINTSLICE
              value: "true"
            - name: ROUTING_USE_K8S_WEIGHTED
              value: "true"
            - name: REGISTRY_URL
              value: "http://registry:5000"
            - name: REGISTRY_TYPE
              value: "docker"
            - name: ROLLBACK_CHECK_IMAGE
              value: "true"
            - name: ROLLBACK_FORCE_AUTO
              value: "true"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /release-service/actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /release-service/actuator/health
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: release-service
  namespace: gray-release
  labels:
    app: release-service
spec:
  type: ClusterIP
  selector:
    app: release-service
  ports:
    - port: 8081
      targetPort: 8081
      protocol: TCP