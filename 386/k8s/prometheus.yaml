apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: gray-release
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: 'gateway-service'
        static_configs:
          - targets: ['gateway-service:8080']
        metrics_path: '/actuator/prometheus'
      - job_name: 'release-service'
        static_configs:
          - targets: ['release-service:8081']
        metrics_path: '/release-service/actuator/prometheus'
      - job_name: 'monitor-service'
        static_configs:
          - targets: ['monitor-service:8082']
        metrics_path: '/monitor-service/actuator/prometheus'
      - job_name: 'application-services'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: '.*-service'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: gray-release
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: gray-release
  labels:
    app: prometheus
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      protocol: TCP