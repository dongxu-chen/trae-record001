apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitor-service
  namespace: gray-release
  labels:
    app: monitor-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monitor-service
  template:
    metadata:
      labels:
        app: monitor-service
    spec:
      containers:
        - name: monitor-service
          image: gray-release/monitor-service:1.0.0
          ports:
            - containerPort: 8082
          env:
            - name: KAFKA_SERVERS
              value: "kafka:9092"
            - name: PROMETHEUS_URL
              value: "http://prometheus:9090"
            - name: ANOMALY_USE_DYNAMIC_BASELINE
              value: "true"
            - name: ANOMALY_STD_DEV_MULTIPLIER
              value: "3.0"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /monitor-service/actuator/health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /monitor-service/actuator/health
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: monitor-service
  namespace: gray-release
  labels:
    app: monitor-service
spec:
  type: ClusterIP
  selector:
    app: monitor-service
  ports:
    - port: 8082
      targetPort: 8082
      protocol: TCP