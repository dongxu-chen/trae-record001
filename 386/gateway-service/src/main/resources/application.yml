server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: default-route
          uri: lb://default-service
          predicates:
            - Path=/api/**
          filters:
            - StripPrefix=1
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: gateway-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: latest

kubernetes:
  service-suffix: ${K8S_SERVICE_SUFFIX:svc.cluster.local}

kafka:
  topics:
    traffic-update: ${KAFKA_TOPIC_TRAFFIC:traffic-update}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.grayrelease: INFO
    org.springframework.cloud.gateway: INFO