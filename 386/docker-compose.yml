version: '3.8'

services:
  zookeeper:
    image: bitnami/zookeeper:latest
    container_name: gray-release-zookeeper
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    ports:
      - "2181:2181"

  kafka:
    image: bitnami/kafka:latest
    container_name: gray-release-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_KRAFT_CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk
    depends_on:
      - zookeeper

  prometheus:
    image: prom/prometheus:latest
    container_name: gray-release-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  release-service:
    build:
      context: .
      dockerfile: Dockerfile.release
    container_name: gray-release-release-service
    ports:
      - "8081:8081"
    environment:
      - KAFKA_SERVERS=kafka:9092
      - PROMETHEUS_URL=http://prometheus:9090
      - K8S_NAMESPACE=gray-release
    depends_on:
      - kafka
      - prometheus

  gateway-service:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: gray-release-gateway-service
    ports:
      - "8080:8080"
    environment:
      - KAFKA_SERVERS=kafka:9092
      - K8S_SERVICE_SUFFIX=svc.cluster.local
    depends_on:
      - kafka
      - release-service

  monitor-service:
    build:
      context: .
      dockerfile: Dockerfile.monitor
    container_name: gray-release-monitor-service
    ports:
      - "8082:8082"
    environment:
      - KAFKA_SERVERS=kafka:9092
      - PROMETHEUS_URL=http://prometheus:9090
    depends_on:
      - kafka
      - prometheus