global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'rate-limit-center'
    metrics_path: '/rate-limit/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['127.0.0.1:8090']
        labels:
          application: 'rate-limit-center'

  - job_name: 'sentinel-dashboard'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['127.0.0.1:8858']
        labels:
          application: 'sentinel-dashboard'
