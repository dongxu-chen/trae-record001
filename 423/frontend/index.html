<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务依赖拓扑分析平台</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
    <div id="app">
        <header class="app-header">
            <div class="logo">
                <svg width="32" height="32" viewBox="0 0 32 32">
                    <circle cx="16" cy="16" r="14" fill="none" stroke="#4fc3f7" stroke-width="2"/>
                    <circle cx="16" cy="16" r="6" fill="#4fc3f7"/>
                    <circle cx="6" cy="10" r="3" fill="#81c784"/>
                    <circle cx="26" cy="10" r="3" fill="#ffb74d"/>
                    <circle cx="6" cy="22" r="3" fill="#e57373"/>
                    <circle cx="26" cy="22" r="3" fill="#ba68c8"/>
                </svg>
                <h1>服务依赖拓扑分析平台</h1>
            </div>
            <div class="controls">
                <div class="time-window">
                    <label>时间窗口:</label>
                    <select id="timeWindowSelect">
                        <option value="15">15 分钟</option>
                        <option value="30">30 分钟</option>
                        <option value="60" selected>1 小时</option>
                        <option value="240">4 小时</option>
                        <option value="1440">24 小时</option>
                    </select>
                </div>
                <button id="refreshBtn" class="btn btn-primary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
                    </svg>
                    刷新
                </button>
                <button id="importBtn" class="btn btn-success">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/>
                    </svg>
                    导入Trace
                </button>
                <button id="snapshotBtn" class="btn btn-warning">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M9 3L7.17 5H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.11-.9-2-2-2h-3.17L15 3H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/>
                    </svg>
                    创建快照
                </button>
            </div>
        </header>

        <nav class="tabs">
            <button class="tab-btn active" data-tab="topology">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <circle cx="12" cy="12" r="3"/>
                    <circle cx="5" cy="5" r="2"/>
                    <circle cx="19" cy="5" r="2"/>
                    <circle cx="5" cy="19" r="2"/>
                    <circle cx="19" cy="19" r="2"/>
                    <path d="M7 7l3 3M17 7l-3 3M7 17l3-3M17 17l-3-3"/>
                </svg>
                拓扑视图
            </button>
            <button class="tab-btn" data-tab="analysis">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M3 13h2v8H3zm4-8h2v16H7zm4-2h2v18h-2zm4 4h2v14h-2zm4-4h2v18h-2z"/>
                </svg>
                分析面板
            </button>
            <button class="tab-btn" data-tab="fault">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                </svg>
                故障分析
            </button>
            <button class="tab-btn" data-tab="history">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/>
                </svg>
                历史对比
            </button>
        </nav>

        <main class="content">
            <div class="tab-content active" id="topology">
                <div class="panel stats-panel">
                    <div class="stat-card">
                        <div class="stat-value" id="statServices">0</div>
                        <div class="stat-label">服务数量</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="statEdges">0</div>
                        <div class="stat-label">依赖关系</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="statCalls">0</div>
                        <div class="stat-label">调用次数</div>
                    </div>
                    <div class="stat-card stat-error">
                        <div class="stat-value" id="statErrors">0</div>
                        <div class="stat-label">错误次数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="statErrorRate">0%</div>
                        <div class="stat-label">错误率</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="statLatency">0ms</div>
                        <div class="stat-label">平均延迟</div>
                    </div>
                </div>

                <div class="panel topology-container">
                    <div class="panel-header">
                        <h2>服务依赖拓扑图</h2>
                        <div style="display:flex; align-items:center; gap:16px; flex-wrap:wrap;">
                            <div class="group-controls">
                                <button id="collapseAllBtn" class="group-toggle-btn">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M7 14l5 5 5-5H7zM12 4l5 5H7l5-5z"/>
                                    </svg>
                                    折叠全部
                                </button>
                                <button id="expandAllBtn" class="group-toggle-btn">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M7 10l5-5 5 5H7zM12 18l-5-5h10l-5 5z"/>
                                    </svg>
                                    展开全部
                                </button>
                            </div>
                            <div class="animation-controls">
                                <button id="animateBtn" class="animation-btn">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M8 5v14l11-7z"/>
                                    </svg>
                                    演示路径
                                </button>
                                <button id="animateCriticalBtn" class="animation-btn" style="background: linear-gradient(135deg, #ff9800, #f57c00);">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                                    </svg>
                                    关键路径
                                </button>
                                <button id="stopAnimateBtn" class="animation-btn stop" style="display:none;">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M6 6h12v12H6z"/>
                                    </svg>
                                    停止
                                </button>
                                <span id="animationStatus" class="animation-status" style="display:none;">演示中...</span>
                            </div>
                            <div class="legend">
                                <div class="legend-item">
                                    <span class="legend-line" style="background:#4fc3f7;"></span>
                                    <span>正常</span>
                                </div>
                                <div class="legend-item">
                                    <span class="legend-line" style="background:#ff9800;"></span>
                                    <span>高延迟</span>
                                </div>
                                <div class="legend-item">
                                    <span class="legend-line" style="background:#f44336;"></span>
                                    <span>高错误率</span>
                                </div>
                                <div class="legend-item">
                                    <span class="legend-line" style="background:#ffb74d; stroke-dasharray:4,4;"></span>
                                    <span>生产</span>
                                </div>
                                <div class="legend-item">
                                    <span class="legend-line" style="background:#4db6ac; stroke-dasharray:4,4;"></span>
                                    <span>消费</span>
                                </div>
                                <div class="legend-item">
                                    <span class="legend-node" style="background:#81c784;"></span>
                                    <span>入口层</span>
                                </div>
                                <div class="legend-item">
                                    <span class="legend-node" style="background:#4fc3f7;"></span>
                                    <span>中间层</span>
                                </div>
                                <div class="legend-item">
                                    <span class="legend-node" style="background:#ba68c8;"></span>
                                    <span>数据层</span>
                                </div>
                                <div class="legend-item">
                                    <span class="legend-node" style="background:#f06292; border-radius:4px;"></span>
                                    <span>消息队列</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div id="topologyGraph" class="graph-container"></div>
                </div>

                <div class="panel details-panel">
                    <div class="panel-header">
                        <h2>服务详情</h2>
                        <div class="layer-filter">
                            <label>层级筛选:</label>
                            <select id="layerFilter">
                                <option value="all">全部</option>
                            </select>
                        </div>
                    </div>
                    <div id="serviceDetails" class="service-details">
                        <p class="placeholder">选择图中的服务节点查看详情</p>
                    </div>
                </div>
            </div>

            <div class="tab-content" id="analysis">
                <div class="panel">
                    <div class="panel-header">
                        <h2>拓扑分析</h2>
                    </div>
                    <div id="analysisContent" class="analysis-content">
                        <div class="analysis-grid">
                            <div class="analysis-section">
                                <h3>层级分布</h3>
                                <div id="layerDistribution"></div>
                            </div>
                            <div class="analysis-section">
                                <h3>关键路径</h3>
                                <div id="criticalPaths"></div>
                            </div>
                        </div>
                        <div class="analysis-grid">
                            <div class="analysis-section">
                                <h3>服务依赖指标</h3>
                                <div id="dependencyMetrics"></div>
                            </div>
                            <div class="analysis-section">
                                <h3>异常检测</h3>
                                <div id="anomaliesList"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="version-panel">
                    <div class="version-panel-header">
                        <div class="version-panel-title">接口版本演化跟踪</div>
                        <span style="font-size:12px;color:#8b949e;">分析API变更对下游服务的影响范围</span>
                    </div>
                    <div class="version-form">
                        <div class="version-form-group">
                            <label>选择服务</label>
                            <select id="versionServiceSelect">
                                <option value="">-- 选择服务 --</option>
                            </select>
                        </div>
                        <div class="version-form-group">
                            <label>原版本</label>
                            <input type="text" id="oldVersion" placeholder="例如: 1.0.0" value="1.0.0">
                        </div>
                        <div class="version-form-group">
                            <label>新版本</label>
                            <input type="text" id="newVersion" placeholder="例如: 2.0.0" value="2.0.0">
                        </div>
                        <button id="analyzeVersionBtn" class="version-analyze-btn">分析影响</button>
                    </div>
                    <div id="versionResult" class="version-result" style="display:none;"></div>
                </div>
            </div>

            <div class="tab-content" id="fault">
                <div class="panel">
                    <div class="panel-header">
                        <h2>故障影响分析</h2>
                        <div class="fault-controls">
                            <label>选择故障服务:</label>
                            <select id="faultServiceSelect">
                                <option value="">-- 选择服务 --</option>
                            </select>
                            <label>深度:</label>
                            <select id="faultDepth">
                                <option value="2">2</option>
                                <option value="3" selected>3</option>
                                <option value="5">5</option>
                            </select>
                            <button id="analyzeFaultBtn" class="btn btn-primary">分析</button>
                        </div>
                    </div>
                    <div id="faultContent" class="fault-content">
                        <p class="placeholder">选择服务后点击分析按钮查看故障影响</p>
                    </div>
                </div>

                <div class="panel">
                    <div class="panel-header">
                        <h2>故障传播风险评估</h2>
                    </div>
                    <div id="broadcastRisk" class="broadcast-risk"></div>
                </div>
            </div>

            <div class="tab-content" id="history">
                <div class="panel">
                    <div class="panel-header">
                        <h2>拓扑历史对比</h2>
                        <div class="history-controls">
                            <label>快照A:</label>
                            <select id="snapshotA">
                                <option value="">-- 选择快照 --</option>
                            </select>
                            <label>快照B:</label>
                            <select id="snapshotB">
                                <option value="">-- 选择快照 --</option>
                            </select>
                            <button id="compareBtn" class="btn btn-primary">对比</button>
                        </div>
                    </div>
                    <div id="historyContent" class="history-content">
                        <div class="history-grid">
                            <div class="history-section">
                                <h3>新增服务</h3>
                                <div id="newServices" class="diff-list"></div>
                            </div>
                            <div class="history-section">
                                <h3>移除服务</h3>
                                <div id="removedServices" class="diff-list"></div>
                            </div>
                            <div class="history-section">
                                <h3>新增依赖</h3>
                                <div id="newEdges" class="diff-list"></div>
                            </div>
                            <div class="history-section">
                                <h3>移除依赖</h3>
                                <div id="removedEdges" class="diff-list"></div>
                            </div>
                            <div class="history-section full-width">
                                <h3>变化的依赖</h3>
                                <div id="changedEdges" class="diff-list table"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="panel">
                    <div class="panel-header">
                        <h2>历史快照</h2>
                        <button id="listSnapshotsBtn" class="btn btn-secondary">刷新快照列表</button>
                    </div>
                    <div id="snapshotsList" class="snapshots-list"></div>
                </div>
            </div>
        </main>

        <div id="modal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 id="modalTitle">详情</h3>
                    <button class="modal-close" onclick="closeModal()">&times;</button>
                </div>
                <div class="modal-body" id="modalBody"></div>
            </div>
        </div>
    </div>

    <script src="js/topology.js"></script>
    <script src="js/analysis.js"></script>
    <script src="js/fault.js"></script>
    <script src="js/history.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
