server:
  port: 8081
  servlet:
    context-path: /api

spring:
  application:
    name: tracking-query
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

clickhouse:
  host: ${CLICKHOUSE_HOST:localhost}
  port: ${CLICKHOUSE_PORT:8123}
  database: ${CLICKHOUSE_DB:tracking}
  username: ${CLICKHOUSE_USER:default}
  password: ${CLICKHOUSE_PASSWORD:}
  max-pool-size: 20
  min-idle: 5

redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}
  password: ${REDIS_PASSWORD:}
  database: 0
  max-total: 128
  max-idle: 64
  min-idle: 16

springfox:
  documentation:
    swagger-ui:
      enabled: true
    enabled: true

logging:
  level:
    com.tracking: INFO
    org.springframework.jdbc.core: DEBUG
