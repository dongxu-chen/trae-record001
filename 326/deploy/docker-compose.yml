version: '3.8'

services:
  zookeeper:
    image: zookeeper:3.7.0
    container_name: tracking-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: server.1=zookeeper:2888:3888
    networks:
      - tracking-network

  kafka:
    image: wurstmeister/kafka:2.13-2.8.1
    container_name: tracking-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_HOST_NAME: kafka
      KAFKA_ADVERTISED_PORT: 9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    depends_on:
      - zookeeper
    networks:
      - tracking-network

  kafka-manager:
    image: sheepkiller/kafka-manager:latest
    container_name: tracking-kafka-manager
    ports:
      - "9000:9000"
    environment:
      ZK_HOSTS: zookeeper:2181
    depends_on:
      - zookeeper
      - kafka
    networks:
      - tracking-network

  redis:
    image: redis:7.0-alpine
    container_name: tracking-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 1G --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - tracking-network

  clickhouse:
    image: clickhouse/clickhouse-server:23.3-alpine
    container_name: tracking-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: tracking
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./init-clickhouse.sql:/docker-entrypoint-initdb.d/init-clickhouse.sql
    networks:
      - tracking-network

  flink-jobmanager:
    image: flink:1.17-scala_2.12
    container_name: tracking-flink-jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        state.backend: filesystem
        state.checkpoints.dir: file:///tmp/flink-checkpoints
      - TZ=Asia/Shanghai
    volumes:
      - flink-checkpoints:/tmp/flink-checkpoints
    networks:
      - tracking-network

  flink-taskmanager:
    image: flink:1.17-scala_2.12
    container_name: tracking-flink-taskmanager
    depends_on:
      - flink-jobmanager
    command: taskmanager
    deploy:
      replicas: 2
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
      - TZ=Asia/Shanghai
    volumes:
      - flink-checkpoints:/tmp/flink-checkpoints
    networks:
      - tracking-network

  collector:
    build:
      context: ../
      dockerfile: deploy/Dockerfile-collector
    container_name: tracking-collector
    ports:
      - "8080:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TZ: Asia/Shanghai
    depends_on:
      - kafka
    networks:
      - tracking-network
    restart: always

  query:
    build:
      context: ../
      dockerfile: deploy/Dockerfile-query
    container_name: tracking-query
    ports:
      - "8081:8081"
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TZ: Asia/Shanghai
    depends_on:
      - clickhouse
      - redis
    networks:
      - tracking-network
    restart: always

volumes:
  redis-data:
  clickhouse-data:
  flink-checkpoints:

networks:
  tracking-network:
    driver: bridge
