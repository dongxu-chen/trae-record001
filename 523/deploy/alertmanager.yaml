global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.example.com:587'
  smtp_from: 'alerts@example.com'
  smtp_auth_username: 'alerts@example.com'
  smtp_auth_password: 'your-password'

route:
  group_by: ['alertname', 'container_id', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'default-receiver'
  routes:
    - match:
        severity: critical
      receiver: 'critical-receiver'
      continue: true
    - match:
        severity: high
      receiver: 'high-receiver'
    - match:
        category: security
      receiver: 'security-receiver'
      continue: true

receivers:
  - name: 'default-receiver'
    email_configs:
      - to: 'admin@example.com'
        send_resolved: true
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/XXX/YYY/ZZZ'
        channel: '#security-alerts'
        send_resolved: true
        title: '{{ .CommonAnnotations.summary }}'
        text: '{{ .CommonAnnotations.description }}'

  - name: 'critical-receiver'
    email_configs:
      - to: 'oncall@example.com,security-team@example.com'
        send_resolved: true
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/XXX/YYY/ZZZ'
        channel: '#security-critical'
        send_resolved: true
        title: '[CRITICAL] {{ .CommonAnnotations.summary }}'
        text: |
          *Severity:* {{ .CommonLabels.severity }}
          *Container:* {{ .CommonAnnotations.container }}
          *Description:* {{ .CommonAnnotations.description }}
          *Attack Type:* {{ .CommonAnnotations.attack_type }}
          *Risk Score:* {{ .CommonAnnotations.risk_score }}
    webhook_configs:
      - url: 'http://your-api.example.com/webhooks/alerts'
        send_resolved: true
        http_config:
          bearer_token: 'your-webhook-token'

  - name: 'high-receiver'
    email_configs:
      - to: 'security-team@example.com'
        send_resolved: true
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/XXX/YYY/ZZZ'
        channel: '#security-alerts'
        send_resolved: true
        title: '[HIGH] {{ .CommonAnnotations.summary }}'
        text: '{{ .CommonAnnotations.description }}'

  - name: 'security-receiver'
    pagerduty_configs:
      - service_key: 'your-pagerduty-key'
        severity: '{{ .CommonLabels.severity }}'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['container_id', 'alertname']
