# 外部配置文件 - 支持热加载
# 修改此文件后，应用会自动刷新配置

app.name=hot-config-demo-external
app.version=1.0.0-SNAPSHOT
app.env=prod
app.feature.toggle=true
app.connection.timeout=5000
app.max.connections=200
app.allowed.ips=127.0.0.1,localhost,192.168.1.0/24
app.cache.ttl=7200
app.threshold=0.95

custom.message=This is from external properties file!
