worker_processes auto;

events {
    worker_connections 1024;
    server_name should_not_be_here;
}

http {
    listen 80;
    server_name example.com;

    server {
        listen 80 default_server backlog=512;
        server_name example.com;
        worker_processes 2;

        location / {
            root /var/www;
            return 999;
            return invalid_code;
            client_max_body_size invalid_size;
            proxy_connect_timeout invalid_time;
            gzip maybe;
        }
    }

    upstream backend {
        server {
            127.0.0.1:8080;
        }
    }
}
