worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name example.com;

        location / {
            set $my_var "hello";
            set $my_var "world";
            root /var/www;
            index index.html;
            try_files $uri $undefined_var =404;
            proxy_pass http://$backend_server;
        }

        location /api {
            proxy_set_header X-Forwarded-For ${bad_var_syntax;
        }
    }
}
