name: Code Quality Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  code-quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        npm install -g eslint
        pip install pylint

    - name: Download Checkstyle
      run: |
        if [ ! -f checkstyle.jar ]; then
          wget -q https://github.com/checkstyle/checkstyle/releases/download/checkstyle-10.12.6/checkstyle-10.12.6-all.jar -O checkstyle.jar
        fi

    - name: Run code quality check (Pull Request)
      if: github.event_name == 'pull_request'
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        echo "Running incremental check for PR #$PR_NUMBER against ${{ github.base_ref }}"
        python -m code_quality_checker check --incremental --base-branch ${{ github.base_ref }} --format json

    - name: Run code quality check (Push)
      if: github.event_name == 'push'
      run: |
        echo "Running full check on push to ${{ github.ref_name }}"
        python -m code_quality_checker check --no-incremental --format json

    - name: Upload quality reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: quality-reports
        path: quality-reports/

    - name: Add PR comment with quality report
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          const reportsDir = 'quality-reports';
          const files = fs.readdirSync(reportsDir).filter(f => f.endsWith('.json'));
          
          if (files.length > 0) {
            const latestFile = files.sort().pop();
            const reportPath = path.join(reportsDir, latestFile);
            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            
            let body = '## Code Quality Report\n\n';
            body += `**Total Errors:** ${report.total_errors}\n`;
            body += `**Total Warnings:** ${report.total_warnings}\n`;
            body += `**Files Checked:** ${report.total_files_checked}\n\n`;
            
            if (report.threshold_violations && report.threshold_violations.length > 0) {
              body += '### ⚠️ Threshold Violations\n';
              for (const v of report.threshold_violations) {
                body += `- ${v}\n`;
              }
              body += '\n';
            }
            
            body += '### Summary by Linter\n\n';
            body += '| Linter | Errors | Warnings | Score |\n';
            body += '|--------|--------|----------|-------|\n';
            
            for (const [name, data] of Object.entries(report.summary.by_linter)) {
              const score = data.score !== null ? data.score.toFixed(2) : 'N/A';
              body += `| ${name} | ${data.errors} | ${data.warnings} | ${score} |\n`;
            }
            
            if (report.total_errors > 0 || !report.threshold_passed) {
              body += '\n❌ **Quality checks failed!**';
            } else {
              body += '\n✅ **All quality checks passed!**';
            }
            
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
          }
