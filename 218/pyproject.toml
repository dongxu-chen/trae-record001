[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "code-quality-checker"
version = "1.0.0"
description = "A comprehensive code quality checking tool with Git integration"
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Code Quality Team" }]
license = { text = "MIT" }
dependencies = [
    "click>=8.1.0",
    "PyYAML>=6.0",
    "gitpython>=3.1.40",
    "tabulate>=0.9.0",
    "colorama>=0.4.6",
]

[project.scripts]
code-quality-checker = "code_quality_checker.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["code_quality_checker*"]
