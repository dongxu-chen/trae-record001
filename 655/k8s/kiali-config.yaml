apiVersion: v1
kind: ConfigMap
metadata:
  name: kiali
  namespace: istio-system
data:
  config.yaml: |
    istio_namespace: istio-system
    auth:
      strategy: anonymous
    deployment:
      accessible_namespaces:
        - "**"
    external_services:
      prometheus:
        url: "http://prometheus.istio-system:9090"
      grafana:
        url: "http://grafana.istio-system:3000"
      tracing:
        url: "http://tracing.istio-system:16686"
    kiali_feature_flags:
      clustering:
        enabled: true
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: kiali-virtualservice
  namespace: istio-system
spec:
  hosts:
    - "kiali.local"
  gateways:
    - mesh-gateway
  http:
    - route:
        - destination:
            host: kiali
            port:
              number: 20001
