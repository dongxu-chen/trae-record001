model:
  scale_factor: 4
  num_channels: 3
  num_features: 64

training:
  batch_size: 16
  num_epochs: 100
  learning_rate: 1e-4
  lr_decay_step: 20
  lr_decay_gamma: 0.5
  weight_decay: 1e-4

data:
  div2k_train_dir: ./data/DIV2K/DIV2K_train_HR
  div2k_valid_dir: ./data/DIV2K/DIV2K_valid_HR
  patch_size: 96
  num_workers: 4

output:
  checkpoint_dir: ./checkpoints
  result_dir: ./results
  log_dir: ./logs
