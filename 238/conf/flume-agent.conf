# ============================================
# 日志采集传输工具 - Flume 配置文件
# Kafka -> Flume -> ClickHouse/HDFS
# ============================================

# Agent 名称定义
a1.sources = r1
a1.sinks = k1 k2 k3
a1.channels = c1 c2 c3

# ============================================
# Source 配置 - 从 Kafka 消费数据
# ============================================
a1.sources.r1.type = com.log.collector.source.ReliableKafkaSource
a1.sources.r1.kafka.bootstrap.servers = kafka1:9092,kafka2:9092,kafka3:9092
a1.sources.r1.kafka.topic = application_logs
a1.sources.r1.kafka.group.id = flume-log-collector
a1.sources.r1.auto.offset.reset = earliest
a1.sources.r1.max.batch.size = 1000
a1.sources.r1.poll.timeout.ms = 1000
a1.sources.r1.async.commit = true
a1.sources.r1.async.commit.interval.ms = 5000

# 幂等配置 (Redis去重)
a1.sources.r1.idempotent.enabled = true
a1.sources.r1.redis.host = localhost
a1.sources.r1.redis.port = 6379
a1.sources.r1.redis.password = 
a1.sources.r1.redis.database = 0
a1.sources.r1.redis.ttl.seconds = 86400

# 背压配置
a1.sources.r1.backpressure.high.watermark = 0.85
a1.sources.r1.backpressure.low.watermark = 0.50
a1.sources.r1.backpressure.min.duration.ms = 1000
a1.sources.r1.backpressure.max.duration.ms = 30000

# Interceptor 链配置
a1.sources.r1.interceptors = i1 i2 i3 i4 i5

# Interceptor 1: 字段注入 (采集时间、主机名、topic等系统字段)
a1.sources.r1.interceptors.i1.type = com.log.collector.interceptor.FieldInjectionInterceptor$Builder
a1.sources.r1.interceptors.i1.fields = collect_timestamp,collect_time,hostname,agent_id,topic,partition,offset,ip
a1.sources.r1.interceptors.i1.agentId = flume-agent-01

# Interceptor 2: 采样率控制 (按日志级别动态调整)
a1.sources.r1.interceptors.i2.type = com.log.collector.interceptor.SamplingInterceptor$Builder
a1.sources.r1.interceptors.i2.defaultSampleRate = 1.0
a1.sources.r1.interceptors.i2.forceErrorFull = true
a1.sources.r1.interceptors.i2.sampleRate.debug = 0.01
a1.sources.r1.interceptors.i2.sampleRate.trace = 0.01
a1.sources.r1.interceptors.i2.sampleRate.info = 0.1
a1.sources.r1.interceptors.i2.sampleRate.warn = 0.5
a1.sources.r1.interceptors.i2.sampleRate.error = 1.0

# Interceptor 3: 正则过滤
a1.sources.r1.interceptors.i3.type = com.log.collector.interceptor.RegexFilterInterceptor$Builder
a1.sources.r1.interceptors.i3.includeRegex = .*(ERROR|WARN|INFO|DEBUG).*
a1.sources.r1.interceptors.i3.excludeRegex = .*healthcheck.*
a1.sources.r1.interceptors.i3.filterOnMatch = true

# Interceptor 4: 日志解析 (JSON/Logstash格式)
a1.sources.r1.interceptors.i4.type = com.log.collector.interceptor.LogParseInterceptor$Builder
a1.sources.r1.interceptors.i4.format = json
a1.sources.r1.interceptors.i4.flattenNested = true
a1.sources.r1.interceptors.i4.timestampField = timestamp

# Interceptor 5: 数据脱敏 (动态规则 + 热更新)
a1.sources.r1.interceptors.i5.type = com.log.collector.interceptor.DataMaskingInterceptor$Builder
a1.sources.r1.interceptors.i5.maskBody = true
a1.sources.r1.interceptors.i5.maskFields = phone,email,idcard
a1.sources.r1.interceptors.i5.configFilePath = conf/masking-rules.json
a1.sources.r1.interceptors.i5.enableHotReload = true

# Source 连接到 Channel Selector (用于多路输出)
a1.sources.r1.selector.type = replicating
a1.sources.r1.channels = c1 c2

# ============================================
# Channel 1 配置 - 主处理通道 (内存通道)
# ============================================
a1.channels.c1.type = memory
a1.channels.c1.capacity = 100000
a1.channels.c1.transactionCapacity = 1000
a1.channels.c1.byteCapacityBufferPercentage = 20
a1.channels.c1.keep-alive = 3

# ============================================
# Channel 2 配置 - HDFS 通道
# ============================================
a1.channels.c2.type = memory
a1.channels.c2.capacity = 50000
a1.channels.c2.transactionCapacity = 1000

# ============================================
# Channel 3 配置 - 死信队列通道
# ============================================
a1.channels.c3.type = file
a1.channels.c3.checkpointDir = /data/flume/checkpoint/dlq
a1.channels.c3.dataDirs = /data/flume/data/dlq
a1.channels.c3.capacity = 1000000
a1.channels.c3.transactionCapacity = 1000

# ============================================
# Sink 1 配置 - ClickHouse 输出 (异步写入 + 幂等 + 背压)
# ============================================
a1.sinks.k1.type = com.log.collector.sink.ClickHouseSink
a1.sinks.k1.host = clickhouse1
a1.sinks.k1.port = 8123
a1.sinks.k1.database = logs_db
a1.sinks.k1.table = application_logs
a1.sinks.k1.username = default
a1.sinks.k1.password = your_password
a1.sinks.k1.batchSize = 5000
a1.sinks.k1.batchTimeoutMs = 30000
a1.sinks.k1.maxRetries = 3
a1.sinks.k1.retryIntervalMs = 1000
a1.sinks.k1.columns = timestamp, level, service, host, trace_id, message, body

# 异步写入配置
a1.sinks.k1.asyncWrite = true
a1.sinks.k1.asyncQueueSize = 10

# 幂等配置
a1.sinks.k1.idempotent.enabled = true
a1.sinks.k1.redis.host = localhost
a1.sinks.k1.redis.port = 6379
a1.sinks.k1.redis.password = 

# 背压配置
a1.sinks.k1.backpressure.enabled = true
a1.sinks.k1.backpressure.threshold = 0.7

# Sink 1 连接到 Channel 1
a1.sinks.k1.channel = c1

# ============================================
# Sink 2 配置 - HDFS 输出
# ============================================
a1.sinks.k2.type = com.log.collector.sink.HDFSSink
a1.sinks.k2.hdfsUri = hdfs://namenode:9000
a1.sinks.k2.path = /data/flume/logs
a1.sinks.k2.filePrefix = log-
a1.sinks.k2.fileSuffix = .log
a1.sinks.k2.rollInterval = 300
a1.sinks.k2.rollSize = 134217728
a1.sinks.k2.rollCount = 100000
a1.sinks.k2.batchSize = 1000
a1.sinks.k2.useCompression = false

# Sink 2 连接到 Channel 2
a1.sinks.k2.channel = c2

# ============================================
# Sink 3 配置 - 死信队列
# ============================================
a1.sinks.k3.type = com.log.collector.sink.DeadLetterQueueSink
a1.sinks.k3.sinkType = kafka
a1.sinks.k3.kafka.bootstrap.servers = kafka1:9092,kafka2:9092,kafka3:9092
a1.sinks.k3.kafka.topic = dlq_logs
a1.sinks.k3.batchSize = 100

# Sink 3 连接到 Channel 3
a1.sinks.k3.channel = c3

# ============================================
# Sink 处理器配置 - 背压控制
# ============================================
a1.sinks.k1.backoff = true
a1.sinks.k1.batchTimeout = 30000
