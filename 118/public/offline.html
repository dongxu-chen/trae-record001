<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>离线模式 - 电子书阅读器</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .container {
      text-align: center;
      padding: 40px;
      max-width: 500px;
    }

    .offline-icon {
      font-size: 80px;
      margin-bottom: 20px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    h1 {
      font-size: 28px;
      margin-bottom: 15px;
    }

    p {
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 30px;
      opacity: 0.9;
    }

    .books-section {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .books-section h2 {
      font-size: 18px;
      margin-bottom: 15px;
    }

    .book-list {
      display: grid;
      gap: 10px;
    }

    .book-item {
      background: rgba(255, 255, 255, 0.15);
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
      text-align: left;
    }

    .book-item:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .book-title {
      font-weight: 600;
      margin-bottom: 4px;
    }

    .book-meta {
      font-size: 12px;
      opacity: 0.8;
    }

    .refresh-btn {
      background: white;
      color: #667eea;
      border: none;
      padding: 12px 32px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .refresh-btn:hover {
      transform: scale(1.05);
    }

    .refresh-btn:active {
      transform: scale(0.98);
    }

    .empty-state {
      padding: 20px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="offline-icon">📴</div>
    <h1>当前处于离线模式</h1>
    <p>网络连接不可用，但你仍可以阅读已下载的书籍</p>
    
    <div class="books-section">
      <h2>📚 已下载的书籍</h2>
      <div class="book-list" id="bookList">
        <div class="empty-state">加载中...</div>
      </div>
    </div>

    <button class="refresh-btn" onclick="location.reload()">
      🔄 尝试重新连接
    </button>
  </div>

  <script>
    async function loadOfflineBooks() {
      const bookList = document.getElementById('bookList')
      
      if (!('indexedDB' in window)) {
        bookList.innerHTML = '<div class="empty-state">您的浏览器不支持离线存储</div>'
        return
      }

      try {
        const db = await openDatabase()
        const books = await getBooks(db)
        
        if (books.length === 0) {
          bookList.innerHTML = '<div class="empty-state">还没有下载的书籍，联网后下载即可离线阅读</div>'
          return
        }

        bookList.innerHTML = books.map(book => `
          <div class="book-item" onclick="openBook(${book.id})">
            <div class="book-title">${escapeHtml(book.title)}</div>
            <div class="book-meta">
              ${book.author || '未知作者'} · ${formatFileSize(book.fileSize || 0)}
            </div>
          </div>
        `).join('')
      } catch (error) {
        bookList.innerHTML = '<div class="empty-state">加载离线书籍失败</div>'
      }
    }

    function openDatabase() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open('EPUBReaderDB', 1)
        request.onsuccess = () => resolve(request.result)
        request.onerror = () => reject(request.error)
      })
    }

    function getBooks(db) {
      return new Promise((resolve) => {
        const tx = db.transaction('books', 'readonly')
        const store = tx.objectStore('books')
        const request = store.getAll()
        request.onsuccess = () => resolve(request.result)
      })
    }

    function openBook(bookId) {
      location.href = `/reader/${bookId}`
    }

    function escapeHtml(text) {
      const div = document.createElement('div')
      div.textContent = text
      return div.innerHTML
    }

    function formatFileSize(bytes) {
      if (bytes === 0) return '0 B'
      const k = 1024
      const sizes = ['B', 'KB', 'MB', 'GB']
      const i = Math.floor(Math.log(bytes) / Math.log(k))
      return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i]
    }

    loadOfflineBooks()
  </script>
</body>
</html>
