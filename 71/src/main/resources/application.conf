ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [com.example.ApplicationKt.module]
    }
}

weather {
    api {
        openMeteoUrl = "https://api.open-meteo.com"
        sevenTimerUrl = "https://www.7timer.info"
    }
    cache {
        ttlSeconds = 600
        maxEntries = 1000
    }
    alert {
        highTempThreshold = 35.0
        cooldownSeconds = 300
    }
}
