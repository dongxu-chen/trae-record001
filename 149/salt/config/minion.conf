# Salt Minion 配置
# 高性能补丁客户端配置

master:
  - salt-master.example.com

# 多 Master 高可用
master_alive_interval: 30
master_shuffle: true
master_tries: 3

# 心跳配置
ping_interval: 1
ping_timeout: 3

# 事件配置
event_listen: true
events:
  enabled: true
  max_events: 10000

# 执行配置
timeout: 10
auth_timeout: 5
acceptance_wait_time: 10

# 文件目录
file_roots:
  base:
    - /srv/salt/minion

# 性能优化
random_reauth_delay: 60
recon_default: 1000
recon_max: 10000
recon_randomize: true

# 调度器配置
schedule:
  __master__:
    enable: true

# 监控调度
schedule:
  health_check:
    function: status.health
    minutes: 1
    returner: redis

  patch_monitor:
    function: pkg.list_upgrades
    minutes: 15
    returner: redis

# 日志配置
log_level: info
log_file: /var/log/salt/minion

# 状态缓存
enable_state_cache: true
state_cache_time: 300

# 性能优化
multiprocessing: true
hard_crash: false
