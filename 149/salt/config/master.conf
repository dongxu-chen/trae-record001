# Salt Master 高性能配置
# SaltStack Patch Management System - v1.0

# 网络配置
interface: 0.0.0.0
publish_port: 4505
ret_port: 4506

# 高并发优化
worker_threads: 64
publisher_threads: 16

# 超时配置（秒级响应）
timeout: 5
gather_job_timeout: 10

# 事件总线配置
event_listen: true
event_publisher: true
max_event_size: 10485760

# 文件服务
file_roots:
  base:
    - /srv/salt/states
    - /srv/salt/patch

# Pillar 配置
pillar_roots:
  base:
    - /srv/salt/pillar

# 作业缓存
keep_jobs: 24
job_cache: true
job_cache_size: 100000

# 返回器配置
return: redis
redis.db: '0'
redis.host: '127.0.0.1'
redis.port: 6379

# Reactor 配置（实时事件处理）
reactor:
  - 'salt/job/*/ret/*':
    - /srv/salt/reactor/patch_result.sls
  
  - 'salt/minion/*/start':
    - /srv/salt/reactor/minion_register.sls

  - 'patch/monitor/*':
    - /srv/salt/reactor/health_check.sls

# Peer 配置（允许 minion 发布事件）
peer:
  .*:
    - event.send
    - grains.get

# 性能优化
ipv6: false
tcp_keepalive: true
tcp_keepalive_cnt: 3
tcp_keepalive_idle: 300
tcp_keepalive_intvl: 60

# 批处理配置
batch_size: 30%
batch_wait: 1

# 日志配置
log_level: info
log_file: /var/log/salt/master
log_file_max_size: 100mb
log_file_num_backups: 5
