# Security Patch Manager Configuration File

# Inventory file location
INVENTORY_FILE="${SCRIPT_DIR}/config/inventory.ini"

# Reports directory
REPORTS_DIR="${SCRIPT_DIR}/reports"

# Logs directory
LOG_DIR="${SCRIPT_DIR}/logs"

# Default batch size for parallel execution
BATCH_SIZE="30%"

# Only install security updates (not all updates)
ONLY_SECURITY_UPDATES=true

# Reboot after patch installation
REBOOT_AFTER_UPDATE=false

# Reboot timeout in seconds
REBOOT_TIMEOUT=600

# Patch backup directory on remote hosts
PATCH_BACKUP_DIR="/var/log/patch-backups"

# Ansible configuration
ANSIBLE_FORKS=10
ANSIBLE_TIMEOUT=30

# Compliance thresholds
COMPLIANCE_THRESHOLD_CRITICAL=0
COMPLIANCE_THRESHOLD_HIGH=0
COMPLIANCE_THRESHOLD_MEDIUM=3
