---
- name: Send Patch Management Notification
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    notification_type: "patch_report"
    report_file: ""
    webhook_url: ""
    webhook_type: "dingtalk"
    notification_title: "安全补丁管理报告"

  tasks:
    - name: Validate required parameters
      ansible.builtin.fail:
        msg: "Both report_file and webhook_url are required"
      when: report_file == "" or webhook_url == ""

    - name: Check if report file exists
      ansible.builtin.stat:
        path: "{{ report_file }}"
      register: report_stat

    - name: Fail if report file not found
      ansible.builtin.fail:
        msg: "Report file not found: {{ report_file }}"
      when: not report_stat.stat.exists

    - name: Load report data
      ansible.builtin.slurp:
        src: "{{ report_file }}"
      register: report_content

    - name: Parse report JSON
      ansible.builtin.set_fact:
        report_data: "{{ report_content.content | b64decode | from_json }}"

    - name: Extract report summary (baseline scan)
      ansible.builtin.set_fact:
        summary_text: |
          【安全基线扫描报告】
          
          📊 扫描概况
          ├── 扫描主机: {{ report_data.total_hosts | default(0) }} 台
          ├── 合规主机: {{ report_data.compliant_count | default(0) }} 台
          ├── 警告主机: {{ report_data.warning_count | default(0) }} 台
          └── 不合规主机: {{ report_data.non_compliant_count | default(0) }} 台
          
          📈 平均合规分数: {{ report_data.average_score | default(0) }}%
          
          📅 扫描时间: {{ report_data.scan_date | default('N/A') }}
      when: report_data.scan_date is defined

    - name: Extract report summary (patch simulation)
      ansible.builtin.set_fact:
        summary_text: |
          【补丁预演分析报告】
          
          📊 主机概况
          ├── 扫描主机: {{ report_data.summary.total_hosts | default(0) }} 台
          ├── 有更新主机: {{ report_data.summary.hosts_with_updates | default(0) }} 台
          ├── 有安全更新: {{ report_data.summary.hosts_with_security_updates | default(0) }} 台
          └── 需要重启: {{ report_data.summary.hosts_needing_reboot | default(0) }} 台
          
          ⚠️ 补丁优先级统计
          ├── 严重 (CVSS ≥ 9.0): {{ report_data.summary.total_critical_patches | default(0) }} 个
          ├── 高危 (CVSS ≥ 7.0): {{ report_data.summary.total_high_patches | default(0) }} 个
          ├── 中危 (CVSS ≥ 4.0): {{ report_data.summary.total_medium_patches | default(0) }} 个
          └── 低危 (CVSS ≥ 0.0): {{ report_data.summary.total_low_patches | default(0) }} 个
          
          ⏰ SLA修复期限
          ├── 严重: {{ report_data.patch_sla.critical_days | default(3) }} 天内
          ├── 高危: {{ report_data.patch_sla.high_days | default(7) }} 天内
          ├── 中危: {{ report_data.patch_sla.medium_days | default(15) }} 天内
          └── 低危: {{ report_data.patch_sla.low_days | default(30) }} 天内
          
          📅 扫描时间: {{ report_data.simulation_date | default('N/A') }}
      when: report_data.simulation_date is defined

    - name: Extract report summary (patch installation)
      ansible.builtin.set_fact:
        summary_text: |
          【补丁安装执行报告】
          
          📊 执行概况
          ├── 目标主机: {{ report_data.total_hosts | default(0) }} 台
          ├── 成功主机: {{ report_data.success_count | default(0) }} 台
          ├── 变更主机: {{ report_data.changed_count | default(0) }} 台
          ├── 需重启主机: {{ report_data.reboot_required_count | default(0) }} 台
          └── 已跳过(当日已更新): {{ report_data.already_patched_count | default(0) }} 台
          
          📅 执行时间: {{ report_data.install_date | default('N/A') }}
      when: report_data.install_date is defined

    - name: Extract report summary (compliance report)
      ansible.builtin.set_fact:
        summary_text: |
          【合规性分析报告】
          
          📊 补丁状态统计
          ├── 已修复 (FIXED): {{ report_data.patch_statistics.fixed_count | default(0) }} 台
          ├── 待修复 (UNFIXED): {{ report_data.patch_statistics.unfixed_count | default(0) }} 台
          └── 不适用 (N/A): {{ report_data.patch_statistics.na_count | default(0) }} 台
          
          📈 合规状态
          ├── 合规主机: {{ report_data.compliance_statistics.compliant_hosts | default(0) }} 台
          ├── 警告主机: {{ report_data.compliance_statistics.warning_hosts | default(0) }} 台
          ├── 不合规主机: {{ report_data.compliance_statistics.non_compliant_hosts | default(0) }} 台
          └── 平均分数: {{ report_data.compliance_statistics.average_score | default(0) }}%
          
          📅 报告时间: {{ report_data.report_date | default('N/A') }}
      when: report_data.report_date is defined

    - name: Set default summary if none matched
      ansible.builtin.set_fact:
        summary_text: |
          【安全补丁管理报告】
          
          📊 报告已生成，请查看详细报告文件
          
          📅 时间: {{ ansible_date_time.iso8601 }}
      when: summary_text is not defined

    - name: Send DingTalk notification
      block:
        - name: Send markdown message to DingTalk
          ansible.builtin.uri:
            url: "{{ webhook_url }}"
            method: POST
            body_format: json
            body:
              msgtype: markdown
              markdown:
                title: "{{ notification_title }}"
                text: |
                  ## {{ notification_title }}
                  
                  {{ summary_text | indent(2) }}
                  
                  > 💡 请查看完整报告获取详细信息
            status_code: 200
            timeout: 10
          register: dingtalk_response
          retries: 3
          delay: 5
          until: dingtalk_response.status == 200

        - name: Check DingTalk response
          ansible.builtin.fail:
            msg: "DingTalk notification failed: {{ dingtalk_response.json }}"
          when: dingtalk_response.json.errcode | default(0) != 0
      when: webhook_type == 'dingtalk'

    - name: Send WeChat Work notification
      block:
        - name: Send markdown message to WeChat Work
          ansible.builtin.uri:
            url: "{{ webhook_url }}"
            method: POST
            body_format: json
            body:
              msgtype: markdown
              markdown:
                content: |
                  ## {{ notification_title }}
                  
                  {{ summary_text | indent(2) }}
                  
                  > 💡 请查看完整报告获取详细信息
            status_code: 200
            timeout: 10
          register: wechat_response
          retries: 3
          delay: 5
          until: wechat_response.status == 200

        - name: Check WeChat response
          ansible.builtin.fail:
            msg: "WeChat notification failed: {{ wechat_response.json }}"
          when: wechat_response.json.errcode | default(0) != 0
      when: webhook_type == 'wechat'

    - name: Debug output
      ansible.builtin.debug:
        msg:
          - "Notification type: {{ webhook_type }}"
          - "Summary sent successfully"
          - "Summary preview: {{ summary_text | truncate(200) }}"
