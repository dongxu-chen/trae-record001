<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社交媒体舆情分析系统</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.2/dist/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1920px;
            margin: 0 auto;
        }
        
        .header {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px 30px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            font-size: 28px;
            color: #1a202c;
            font-weight: 700;
        }
        
        .header .subtitle {
            color: #718096;
            font-size: 14px;
            margin-top: 4px;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 14px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }
        
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(17, 153, 142, 0.4);
        }
        
        select {
            padding: 10px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            background: white;
            cursor: pointer;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-4px);
        }
        
        .stat-card .label {
            color: #718096;
            font-size: 14px;
            margin-bottom: 8px;
        }
        
        .stat-card .value {
            font-size: 36px;
            font-weight: 700;
            color: #1a202c;
        }
        
        .stat-card .trend {
            font-size: 12px;
            margin-top: 4px;
        }
        
        .trend.positive {
            color: #38a169;
        }
        
        .trend.negative {
            color: #e53e3e;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 16px;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        .card h2 {
            font-size: 18px;
            color: #1a202c;
            margin-bottom: 16px;
            font-weight: 600;
        }
        
        .col-6 {
            grid-column: span 6;
        }
        
        .col-4 {
            grid-column: span 4;
        }
        
        .col-8 {
            grid-column: span 8;
        }
        
        .col-12 {
            grid-column: span 12;
        }
        
        @media (max-width: 1200px) {
            .col-6, .col-4, .col-8 {
                grid-column: span 12;
            }
        }
        
        .chart-container {
            height: 300px;
            position: relative;
        }
        
        .sentiment-doughnut {
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .alerts-list {
            max-height: 300px;
            overflow-y: auto;
        }
        
        .alert-item {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 4px solid;
            transition: all 0.3s ease;
        }
        
        .alert-item:hover {
            transform: translateX(4px);
        }
        
        .alert-item.high {
            background: #fff5f5;
            border-color: #e53e3e;
        }
        
        .alert-item.medium {
            background: #fffaf0;
            border-color: #dd6b20;
        }
        
        .alert-item.low {
            background: #f7fffc;
            border-color: #38a169;
        }
        
        .alert-title {
            font-weight: 600;
            color: #1a202c;
            margin-bottom: 4px;
        }
        
        .alert-desc {
            font-size: 12px;
            color: #718096;
            margin-bottom: 4px;
        }
        
        .alert-time {
            font-size: 11px;
            color: #a0aec0;
        }
        
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            margin-right: 4px;
        }
        
        .badge-high {
            background: #fed7d7;
            color: #c53030;
        }
        
        .badge-medium {
            background: #feebc8;
            color: #c05621;
        }
        
        .badge-low {
            background: #c6f6d5;
            color: #276749;
        }
        
        .platform-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            margin: 2px;
        }
        
        .weibo { background: #ffb6b9; color: #c53030; }
        .twitter { background: #bee3f8; color: #2b6cb0; }
        .zhihu { background: #c6f6d5; color: #276749; }
        .hupu { background: #e9d8fd; color: #6b46c1; }
        .tieba { background: #feebc8; color: #c05621; }
        
        .keyword-cloud {
            height: 300px;
        }
        
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
            color: #718096;
        }
        
        .spinner {
            border: 3px solid #e2e8f0;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 16px 24px;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }
        
        .toast.success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }
        
        .toast.info {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #a0aec0;
        }
        
        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        
        .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #e53e3e;
            animation: pulse 2s infinite;
        }
        
        .status-dot.connected {
            background: #38a169;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>📊 社交媒体舆情分析系统</h1>
                <div class="subtitle">实时监控微博、推特、论坛等平台的舆情动态</div>
            </div>
            <div class="controls">
                <div class="connection-status">
                    <div class="status-dot" id="statusDot"></div>
                    <span id="statusText">连接中...</span>
                </div>
                <select id="timeRange">
                    <option value="1">最近 1 小时</option>
                    <option value="6">最近 6 小时</option>
                    <option value="12">最近 12 小时</option>
                    <option value="24" selected>最近 24 小时</option>
                    <option value="72">最近 3 天</option>
                    <option value="168">最近 7 天</option>
                </select>
                <button class="btn btn-success" onclick="generateMockData()">🎲 生成测试数据</button>
                <button class="btn btn-primary" onclick="refreshData()">🔄 刷新数据</button>
            </div>
        </div>
        
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="label">总讨论量</div>
                <div class="value" id="totalPosts">0</div>
                <div class="trend positive">↑ 实时更新中</div>
            </div>
            <div class="stat-card">
                <div class="label">正面情绪</div>
                <div class="value" id="positiveCount" style="color: #38a169;">0</div>
                <div class="trend positive" id="positivePercent">0%</div>
            </div>
            <div class="stat-card">
                <div class="label">负面情绪</div>
                <div class="value" id="negativeCount" style="color: #e53e3e;">0</div>
                <div class="trend negative" id="negativePercent">0%</div>
            </div>
            <div class="stat-card">
                <div class="label">中性情绪</div>
                <div class="value" id="neutralCount" style="color: #dd6b20;">0</div>
                <div class="trend" id="neutralPercent">0%</div>
            </div>
            <div class="stat-card">
                <div class="label">未处理预警</div>
                <div class="value" id="alertCount" style="color: #e53e3e;">0</div>
                <div class="trend negative">需要关注</div>
            </div>
        </div>
        
        <div class="grid">
            <div class="card col-6">
                <h2>📈 舆情趋势图</h2>
                <div class="chart-container">
                    <canvas id="trendChart"></canvas>
                </div>
            </div>
            
            <div class="card col-4">
                <h2>😊 情绪分布</h2>
                <div class="sentiment-doughnut">
                    <canvas id="sentimentChart"></canvas>
                </div>
            </div>
            
            <div class="card col-8">
                <h2>☁️ 热点关键词</h2>
                <div class="keyword-cloud" id="keywordCloud"></div>
            </div>
            
            <div class="card col-4">
                <h2>🚨 实时预警</h2>
                <div class="alerts-list" id="alertsList">
                    <div class="loading"><div class="spinner"></div></div>
                </div>
            </div>
            
            <div class="card col-6">
                <h2>💬 平台分布</h2>
                <div class="chart-container">
                    <canvas id="platformChart"></canvas>
                </div>
            </div>
            
            <div class="card col-6">
                <h2>⚡ 关键词变化趋势</h2>
                <div class="chart-container">
                    <canvas id="keywordTrendChart"></canvas>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let trendChart, sentimentChart, platformChart, keywordTrendChart;
        let keywordCloudChart;
        let socket;
        
        function initSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const socketUrl = `${protocol}//${window.location.host}`;
            socket = io(socketUrl);
            
            socket.on('connect', () => {
                document.getElementById('statusDot').classList.add('connected');
                document.getElementById('statusText').textContent = '已连接';
            });
            
            socket.on('disconnect', () => {
                document.getElementById('statusDot').classList.remove('connected');
                document.getElementById('statusText').textContent = '已断开';
            });
            
            socket.on('new_data', (data) => {
                showToast(`收到 ${data.count} 条新数据`, 'info');
                refreshData();
            });
        }
        
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }
        
        async function fetchData() {
            const hours = document.getElementById('timeRange').value;
            const response = await fetch(`/api/dashboard?hours=${hours}`);
            return await response.json();
        }
        
        function updateStats(data) {
            const dist = data.sentiment_distribution;
            const total = dist.total || 0;
            
            document.getElementById('totalPosts').textContent = total.toLocaleString();
            document.getElementById('positiveCount').textContent = (dist.counts?.positive || 0).toLocaleString();
            document.getElementById('negativeCount').textContent = (dist.counts?.negative || 0).toLocaleString();
            document.getElementById('neutralCount').textContent = (dist.counts?.neutral || 0).toLocaleString();
            
            document.getElementById('positivePercent').textContent = `${((dist.percentages?.positive || 0) * 100).toFixed(1)}%`;
            document.getElementById('negativePercent').textContent = `${((dist.percentages?.negative || 0) * 100).toFixed(1)}%`;
            document.getElementById('neutralPercent').textContent = `${((dist.percentages?.neutral || 0) * 100).toFixed(1)}%`;
            
            document.getElementById('alertCount').textContent = data.alert_summary?.unacknowledged || 0;
        }
        
        function initTrendChart(trendData) {
            const ctx = document.getElementById('trendChart').getContext('2d');
            
            if (trendChart) {
                trendChart.destroy();
            }
            
            const labels = trendData.map(d => d.hour);
            const positiveData = trendData.map(d => d.positive);
            const negativeData = trendData.map(d => d.negative);
            const neutralData = trendData.map(d => d.neutral);
            const scoreData = trendData.map(d => d.sentiment_score);
            
            trendChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: '正面',
                            data: positiveData,
                            borderColor: '#38a169',
                            backgroundColor: 'rgba(56, 161, 105, 0.1)',
                            fill: true,
                            tension: 0.4
                        },
                        {
                            label: '负面',
                            data: negativeData,
                            borderColor: '#e53e3e',
                            backgroundColor: 'rgba(229, 62, 62, 0.1)',
                            fill: true,
                            tension: 0.4
                        },
                        {
                            label: '中性',
                            data: neutralData,
                            borderColor: '#dd6b20',
                            backgroundColor: 'rgba(221, 107, 32, 0.1)',
                            fill: true,
                            tension: 0.4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        intersect: false,
                        mode: 'index'
                    },
                    plugins: {
                        legend: {
                            position: 'top'
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }
        
        function initSentimentChart(dist) {
            const ctx = document.getElementById('sentimentChart').getContext('2d');
            
            if (sentimentChart) {
                sentimentChart.destroy();
            }
            
            sentimentChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['正面', '负面', '中性'],
                    datasets: [{
                        data: [
                            dist.percentages?.positive || 0,
                            dist.percentages?.negative || 0,
                            dist.percentages?.neutral || 0
                        ],
                        backgroundColor: ['#38a169', '#e53e3e', '#dd6b20'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const value = context.parsed;
                                    return `${context.label}: ${(value * 100).toFixed(1)}%`;
                                }
                            }
                        }
                    },
                    cutout: '60%'
                }
            });
        }
        
        function initKeywordCloud(keywords) {
            const chartDom = document.getElementById('keywordCloud');
            
            if (keywordCloudChart) {
                keywordCloudChart.dispose();
            }
            
            if (!keywords || keywords.length === 0) {
                chartDom.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🔍</div><div>暂无关键词数据</div></div>';
                return;
            }
            
            keywordCloudChart = echarts.init(chartDom);
            
            const maxFreq = Math.max(...keywords.map(k => k.frequency));
            const minFreq = Math.min(...keywords.map(k => k.frequency));
            
            const data = keywords.map(k => ({
                name: k.keyword,
                value: k.frequency,
                textStyle: {
                    fontSize: Math.floor(12 + (k.frequency - minFreq) / (maxFreq - minFreq || 1) * 30)
                }
            }));
            
            const option = {
                series: [{
                    type: 'wordCloud',
                    shape: 'circle',
                    left: 'center',
                    top: 'center',
                    width: '90%',
                    height: '90%',
                    sizeRange: [12, 50],
                    rotationRange: [-45, 45],
                    rotationStep: 15,
                    gridSize: 8,
                    drawOutOfBound: false,
                    layoutAnimation: true,
                    data: data,
                    textStyle: {
                        fontFamily: 'sans-serif',
                        fontWeight: 'bold',
                        color: function() {
                            return 'rgb(' + [
                                Math.round(Math.random() * 160 + 40),
                                Math.round(Math.random() * 160 + 40),
                                Math.round(Math.random() * 160 + 40)
                            ].join(',') + ')';
                        }
                    },
                    emphasis: {
                        focus: 'self',
                        textStyle: {
                            textShadowBlur: 10,
                            textShadowColor: 'rgba(0, 0, 0, 0.25)'
                        }
                    }
                }]
            };
            
            keywordCloudChart.setOption(option);
        }
        
        function initPlatformChart(stats) {
            const ctx = document.getElementById('platformChart').getContext('2d');
            
            if (platformChart) {
                platformChart.destroy();
            }
            
            const platforms = Object.keys(stats);
            const postCounts = platforms.map(p => stats[p].posts_count || 0);
            
            const colors = {
                weibo: '#e53e3e',
                twitter: '#3182ce',
                zhihu: '#38a169',
                hupu: '#805ad5',
                tieba: '#dd6b20'
            };
            
            platformChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: platforms,
                    datasets: [{
                        label: '帖子数量',
                        data: postCounts,
                        backgroundColor: platforms.map(p => colors[p] || '#718096'),
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }
        
        function initKeywordTrendChart(trendData) {
            const ctx = document.getElementById('keywordTrendChart').getContext('2d');
            
            if (keywordTrendChart) {
                keywordTrendChart.destroy();
            }
            
            const labels = trendData.map(d => d.hour);
            const totalData = trendData.map(d => d.total);
            
            keywordTrendChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '讨论热度',
                        data: totalData,
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        fill: true,
                        tension: 0.4,
                        pointRadius: 4,
                        pointHoverRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }
        
        function updateAlerts(alerts) {
            const container = document.getElementById('alertsList');
            
            if (!alerts || alerts.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">✅</div><div>暂无预警信息</div></div>';
                return;
            }
            
            container.innerHTML = alerts.map(alert => `
                <div class="alert-item ${alert.severity}">
                    <div class="alert-title">
                        <span class="badge badge-${alert.severity}">${alert.severity === 'high' ? '高' : alert.severity === 'medium' ? '中' : '低'}</span>
                        ${alert.title}
                    </div>
                    <div class="alert-desc">${alert.description}</div>
                    <div class="alert-time">${new Date(alert.triggered_at).toLocaleString('zh-CN')}</div>
                    ${alert.platform ? `<span class="platform-badge ${alert.platform}">${alert.platform}</span>` : ''}
                </div>
            `).join('');
        }
        
        async function refreshData() {
            try {
                const data = await fetchData();
                
                updateStats(data);
                initTrendChart(data.trend_data || []);
                initSentimentChart(data.sentiment_distribution || {});
                initKeywordCloud(data.top_keywords || []);
                initPlatformChart(data.platform_stats || {});
                initKeywordTrendChart(data.trend_data || []);
                updateAlerts(data.recent_alerts || []);
                
            } catch (error) {
                console.error('Error refreshing data:', error);
                showToast('数据加载失败', 'info');
            }
        }
        
        async function generateMockData() {
            try {
                const response = await fetch('/api/data/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ count: 50 })
                });
                
                const result = await response.json();
                showToast(`成功生成并处理 ${result.processed} 条数据`, 'success');
                refreshData();
            } catch (error) {
                console.error('Error generating mock data:', error);
                showToast('生成数据失败', 'info');
            }
        }
        
        window.addEventListener('resize', () => {
            if (keywordCloudChart) {
                keywordCloudChart.resize();
            }
        });
        
        document.getElementById('timeRange').addEventListener('change', refreshData);
        
        document.addEventListener('DOMContentLoaded', () => {
            initSocket();
            refreshData();
            setInterval(refreshData, 30000);
        });
    </script>
</body>
</html>
