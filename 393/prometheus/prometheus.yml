global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'kafka-jmx'
    static_configs:
      - targets:
          - 'kafka1:9997'
          - 'kafka2:9998'
          - 'kafka3:9999'
    metrics_path: '/metrics'
    params:
      pattern: [".*"]

  - job_name: 'jmx-exporter'
    static_configs:
      - targets:
          - 'jmx-exporter:5556'

  - job_name: 'kafka-exporter'
    static_configs:
      - targets:
          - 'kafka-exporter:9308'

  - job_name: 'node-exporter'
    static_configs:
      - targets:
          - 'node-exporter:9100'

  - job_name: 'prometheus'
    static_configs:
      - targets:
          - 'localhost:9090'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - "rules/*.yml"
