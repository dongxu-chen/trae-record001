# 日志格式: text, json, xml
log.format=text

# 是否启用默认规则
rules.default.enable=true

# 正则引擎: dfa (高性能, 默认), nfa (兼容模式)
regex.engine=dfa

# 自定义脱敏规则示例
# 优先级说明: 数字越大优先级越高，先执行高优先级规则
# rules.custom.1.name=custom_field
# rules.custom.1.regex=customField[=:]['\"]?([^'\"\\s,;]+)['\"]?
# rules.custom.1.groupIndex=1
# rules.custom.1.replacement=***
# rules.custom.1.priority=50
# rules.custom.1.enabled=true
