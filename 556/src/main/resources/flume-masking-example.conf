# Flume 脱敏拦截器配置示例

# 定义 Agent 组件
agent.sources = source1
agent.channels = channel1
agent.sinks = sink1

# 配置 Source
agent.sources.source1.type = exec
agent.sources.source1.command = tail -F /var/log/app.log
agent.sources.source1.shell = /bin/bash -c

# 配置 Source 拦截器 - 使用脱敏拦截器
agent.sources.source1.interceptors = masking
agent.sources.source1.interceptors.masking.type = com.log.mask.flume.MaskingInterceptor$Builder
agent.sources.source1.interceptors.masking.log.format = text
agent.sources.source1.interceptors.masking.config.file = mask-config.properties

# 配置 Channel
agent.channels.channel1.type = memory
agent.channels.channel1.capacity = 10000
agent.channels.channel1.transactionCapacity = 1000

# 配置 Sink
agent.sinks.sink1.type = hdfs
agent.sinks.sink1.hdfs.path = hdfs://namenode:8020/logs/masked/
agent.sinks.sink1.hdfs.filePrefix = log-
agent.sinks.sink1.hdfs.round = true
agent.sinks.sink1.hdfs.roundValue = 10
agent.sinks.sink1.hdfs.roundUnit = minute
agent.sinks.sink1.hdfs.fileType = DataStream

# 绑定组件
agent.sources.source1.channels = channel1
agent.sinks.sink1.channel = channel1
