forecasting:
  forecast_horizon: 180
  forecast_frequency: "D"
  hierarchy_levels: ["product", "region", "warehouse"]
  confidence_level: 0.95

models:
  prophet:
    changepoint_prior_scale: 0.05
    seasonality_prior_scale: 10.0
    yearly_seasonality: true
    weekly_seasonality: true
    daily_seasonality: false
    seasonality_mode: "additive"
  
  lightgbm:
    num_leaves: 31
    max_depth: -1
    learning_rate: 0.05
    n_estimators: 500
    objective: "regression"
    metric: "rmse"
    early_stopping_rounds: 50

ramp_up:
  ramp_period_days: 90
  growth_curve: "logistic"
  saturation_multiplier: 1.5

safety_stock:
  service_level: 0.95
  lead_time_days: 7
  review_period_days: 7
  min_stock_days: 3

replenishment:
  order_frequency_days: 7
  min_order_qty: 100
  safety_stock_multiplier: 1.0

tableau:
  server_url: "https://your-tableau-server.com"
  site_id: ""
  project_name: "Supply Chain Forecasting"
  datasource_name: "Demand Forecast"
