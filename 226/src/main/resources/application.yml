server:
  port: 8080

spring:
  application:
    name: push-center

  redis:
    host: localhost
    port: 6379
    password:
    database: 0
    lettuce:
      pool:
        max-active: 200
        max-idle: 50
        min-idle: 10
        max-wait: 3000ms

disruptor:
  buffer-size: 1048576
  consumer-threads: 8

pushcenter:
  rate-limit:
    sms:
      rate: 100
      capacity: 1000
    email:
      rate: 500
      capacity: 5000
    dingtalk:
      rate: 200
      capacity: 2000
    wechat-work:
      rate: 200
      capacity: 2000
    app-push:
      rate: 1000
      capacity: 10000

  health:
    window-minutes: 10
    degrade-threshold: 0.7
    recover-threshold: 0.9

logging:
  level:
    com.pushcenter: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
