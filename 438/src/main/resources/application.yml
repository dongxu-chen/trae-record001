spring:
  application:
    name: gateway-deduplication
  redis:
    host: localhost
    port: 6379
    password:
    database: 0
    timeout: 3000
    lettuce:
      pool:
        max-active: 50
        max-idle: 20
        min-idle: 5
        max-wait: 3000

server:
  port: 8080

deduplication:
  enabled: true
  window-seconds: 10
  cache-expire-seconds: 300
  user-id-header: X-User-Id
  include-query-params: true
  include-body: true
  include-headers:
    - X-User-Id
    - Content-Type
  bloom-filter:
    expected-insertions: 1000000
    fpp: 0.01
    redis-confirmation-enabled: true
    confirmation-ttl-seconds: 3600
  caffeine:
    maximum-size: 10000
    expire-after-write-seconds: 60
  quorum:
    enabled: true
    total-nodes: 3
    write-quorum: 2
    operation-timeout-ms: 500
  dynamic-window:
    enabled: true
    min-window-seconds: 5
    max-window-seconds: 30
    default-window-seconds: 10
    qps-threshold-high: 1000
    qps-threshold-low: 100
    adjustment-factor: 2
    statistics-window-seconds: 60
  fingerprint-learning:
    enabled: true
    learning-window-seconds: 3600
    min-occurrences-for-pattern: 5
    similarity-threshold: 0.95
    max-patterns: 10000
    pattern-expire-hours: 24
    auto-optimize-hash: true
  audit:
    enabled: true
    log-to-console: true
    persist-to-redis: true
    audit-log-ttl-seconds: 86400
    max-audit-records: 100000
    include-request-details: true
    include-response-details: false
  bypass-validation:
    enabled: true
    sample-rate: 0.01
    min-interval-ms: 1000
    compare-responses: true
    log-mismatches: true
    validation-window-seconds: 300
    max-parallel-validations: 10

logging:
  level:
    com.example.deduplication: DEBUG
    org.springframework.cloud.gateway: INFO
