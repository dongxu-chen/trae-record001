publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  sqflite: ^2.3.2
  path: ^1.8.3
  flutter_local_notifications: ^16.3.2
  timezone: ^0.9.2
  intl: ^0.19.0
  uuid: ^4.2.1
  synchronized: ^3.1.0
  table_calendar: ^3.0.9
