server:
  port: 8080
  servlet:
    context-path: /sms

spring:
  application:
    name: sms-platform
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/sms_platform?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
  redis:
    host: localhost
    port: 6379
    password:
    database: 0
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5
        max-wait: 3000ms

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

sms:
  channel:
    health-check-interval: 60000
    fail-threshold: 3
  rate-limit:
    enabled: true
    window-size-seconds: 60
  verification:
    expire-minutes: 5
    length: 6
  aliyun:
    enabled: true
    access-key-id: test-access-key
    access-key-secret: test-secret
    sign-name: 【阿里云】
  tencent:
    enabled: true
    secret-id: test-secret-id
    secret-key: test-secret-key
    sign-name: 【腾讯云】
