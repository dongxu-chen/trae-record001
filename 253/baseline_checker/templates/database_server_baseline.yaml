name: 数据库服务器安全基线
version: "1.0"
description: 适用于MySQL/PostgreSQL等数据库服务器的安全配置基线

checks:
  database:
    - id: DB-001
      name: MySQL服务运行状态
      description: 确保MySQL服务正常运行
      severity: high
      check_type: service_status
      service_name: mysqld
      expected_status: active
      alt_service_name: postgresql
      fix_command: systemctl start mysqld && systemctl enable mysqld

    - id: DB-002
      name: MySQL配置文件权限
      description: 确保my.cnf文件权限安全
      severity: high
      check_type: file_permission
      file_path: /etc/my.cnf
      expected_permission: "644"
      expected_owner: root
      expected_group: root
      fix_command: chmod 644 /etc/my.cnf && chown root:root /etc/my.cnf

    - id: DB-003
      name: 禁用MySQL匿名用户
      description: 确保MySQL没有匿名用户
      severity: critical
      check_type: command
      command: "mysql -e \"SELECT User, Host FROM mysql.user WHERE User='';\" 2>/dev/null || echo skip"
      match_type: exact
      fix_command: "mysql -e \"DELETE FROM mysql.user WHERE User=''; FLUSH PRIVILEGES;\""

    - id: DB-004
      name: 检查MySQL弱密码用户
      description: 确保MySQL用户密码强度足够
      severity: critical
      check_type: command
      command: "mysql -e \"SELECT User, Host FROM mysql.user WHERE LENGTH(Password) < 40 OR Password='';\" 2>/dev/null || echo skip"
      match_type: exact
      fix_command: "mysql -e \"ALTER USER 'user'@'host' IDENTIFIED BY 'StrongPassword123!'; FLUSH PRIVILEGES;\""

    - id: DB-005
      name: 限制MySQL监听地址
      description: 确保MySQL只监听必要的地址
      severity: high
      check_type: regex_match
      file_path: /etc/my.cnf
      pattern: bind-address\s*=\s*127\.0\.0\.1
      match_type: matches
      fix_command: |
        # 在[mysqld]段添加: bind-address = 127.0.0.1
        # 或只监听内网地址: bind-address = 192.168.1.100

    - id: DB-006
      name: 禁用MySQL LOAD DATA LOCAL
      description: 禁用本地文件加载防止数据泄露
      severity: medium
      check_type: regex_match
      file_path: /etc/my.cnf
      pattern: local-infile\s*=\s*0
      match_type: matches
      fix_command: |
        # 在[mysqld]段添加: local-infile = 0

    - id: DB-007
      name: MySQL数据目录权限
      description: 确保MySQL数据目录权限安全
      severity: high
      check_type: file_permission
      file_path: /var/lib/mysql
      expected_permission: "700"
      expected_owner: mysql
      expected_group: mysql
      fix_command: chown -R mysql:mysql /var/lib/mysql && chmod 700 /var/lib/mysql

    - id: DB-008
      name: 检查MySQL远程root登录
      description: 确保root用户不能远程登录
      severity: critical
      check_type: command
      command: "mysql -e \"SELECT User, Host FROM mysql.user WHERE User='root' AND Host='%';\" 2>/dev/null || echo skip"
      match_type: exact
      fix_command: "mysql -e \"DELETE FROM mysql.user WHERE User='root' AND Host='%'; FLUSH PRIVILEGES;\""

    - id: DB-009
      name: 启用MySQL慢查询日志
      description: 确保慢查询日志已启用
      severity: low
      check_type: regex_match
      file_path: /etc/my.cnf
      pattern: slow_query_log\s*=\s*1
      match_type: matches
      fix_command: |
        # 在[mysqld]段添加:
        # slow_query_log = 1
        # slow_query_log_file = /var/log/mysql-slow.log
        # long_query_time = 2

  ssh:
    - id: SSH-001
      name: 禁止root用户直接登录
      severity: high
      check_type: ssh_config
      sshd_key: PermitRootLogin
      expected_value: "no"
      fix_command: sed -i 's/^PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config && systemctl restart sshd

  firewall:
    - id: FIREWALL-001
      name: 防火墙已启用
      severity: high
      check_type: service_status
      service_name: firewalld
      expected_status: active
      fix_command: systemctl enable firewalld && systemctl start firewalld

    - id: FIREWALL-002
      name: 限制数据库端口访问
      description: 确保数据库端口只允许特定IP访问
      severity: high
      check_type: command
      command: iptables -S INPUT | grep -E 'dport 3306.*-s' || echo "not_restricted"
      expected_output: "3306"
      match_type: contains
      fix_command: |
        # 只允许特定IP访问MySQL:
        # iptables -A INPUT -p tcp --dport 3306 -s 192.168.1.0/24 -j ACCEPT
        # iptables -A INPUT -p tcp --dport 3306 -j DROP
