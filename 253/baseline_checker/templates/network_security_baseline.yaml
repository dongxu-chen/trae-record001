name: 网络安全增强基线
version: "1.0"
description: 增强的网络安全配置，适用于高安全要求的服务器

checks:
  network:
    - id: NET-001
      name: 禁用IP源路由
      description: 禁用所有接口的IP源路由接受
      severity: high
      check_type: sysctl
      parameter: net.ipv4.conf.all.accept_source_route
      expected_value: "0"
      fix_command: echo 'net.ipv4.conf.all.accept_source_route = 0' >> /etc/sysctl.conf && sysctl -p

    - id: NET-002
      name: 禁用IP定向广播
      description: 禁用定向广播防止Smurf攻击
      severity: medium
      check_type: sysctl
      parameter: net.ipv4.icmp_echo_ignore_broadcasts
      expected_value: "1"
      fix_command: echo 'net.ipv4.icmp_echo_ignore_broadcasts = 1' >> /etc/sysctl.conf && sysctl -p

    - id: NET-003
      name: 忽略ICMP重定向
      description: 忽略ICMP重定向报文
      severity: medium
      check_type: sysctl
      parameter: net.ipv4.conf.all.accept_redirects
      expected_value: "0"
      fix_command: echo 'net.ipv4.conf.all.accept_redirects = 0' >> /etc/sysctl.conf && sysctl -p

    - id: NET-004
      name: 不发送ICMP重定向
      description: 不发送ICMP重定向报文
      severity: low
      check_type: sysctl
      parameter: net.ipv4.conf.all.send_redirects
      expected_value: "0"
      fix_command: echo 'net.ipv4.conf.all.send_redirects = 0' >> /etc/sysctl.conf && sysctl -p

    - id: NET-005
      name: 启用反向路径过滤
      description: 启用反向路径过滤防止IP欺骗
      severity: high
      check_type: sysctl
      parameter: net.ipv4.conf.all.rp_filter
      expected_value: "1"
      fix_command: echo 'net.ipv4.conf.all.rp_filter = 1' >> /etc/sysctl.conf && sysctl -p

    - id: NET-006
      name: 记录伪造地址数据包
      description: 记录伪造源地址的数据包
      severity: low
      check_type: sysctl
      parameter: net.ipv4.conf.all.log_martians
      expected_value: "1"
      fix_command: echo 'net.ipv4.conf.all.log_martians = 1' >> /etc/sysctl.conf && sysctl -p

    - id: NET-007
      name: TCP SYN Cookies
      description: 启用SYN Cookies防范SYN洪水攻击
      severity: high
      check_type: sysctl
      parameter: net.ipv4.tcp_syncookies
      expected_value: "1"
      fix_command: echo 'net.ipv4.tcp_syncookies = 1' >> /etc/sysctl.conf && sysctl -p

    - id: NET-008
      name: TCP FIN超时时间
      description: 缩短TCP FIN超时时间，加快连接回收
      severity: low
      check_type: sysctl
      parameter: net.ipv4.tcp_fin_timeout
      expected_value: "30"
      unit: seconds
      compare: le
      fix_command: echo 'net.ipv4.tcp_fin_timeout = 30' >> /etc/sysctl.conf && sysctl -p

    - id: NET-009
      name: TCP keepalive时间
      description: 设置TCP keepalive探测间隔
      severity: low
      check_type: sysctl
      parameter: net.ipv4.tcp_keepalive_time
      expected_value: "300"
      unit: seconds
      compare: le
      fix_command: echo 'net.ipv4.tcp_keepalive_time = 300' >> /etc/sysctl.conf && sysctl -p

    - id: NET-010
      name: TCP SYN重试次数
      description: 减少SYN重试次数
      severity: low
      check_type: sysctl
      parameter: net.ipv4.tcp_syn_retries
      expected_value: "2"
      unit: count
      compare: le
      fix_command: echo 'net.ipv4.tcp_syn_retries = 2' >> /etc/sysctl.conf && sysctl -p

    - id: NET-011
      name: TCP SYN-ACK重试次数
      description: 减少SYN-ACK重试次数
      severity: low
      check_type: sysctl
      parameter: net.ipv4.tcp_synack_retries
      expected_value: "2"
      unit: count
      compare: le
      fix_command: echo 'net.ipv4.tcp_synack_retries = 2' >> /etc/sysctl.conf && sysctl -p

    - id: NET-012
      name: 禁用IP转发
      description: 禁用IP转发（非路由器）
      severity: high
      check_type: sysctl
      parameter: net.ipv4.ip_forward
      expected_value: "0"
      fix_command: echo 'net.ipv4.ip_forward = 0' >> /etc/sysctl.conf && sysctl -p

  firewall:
    - id: FIREWALL-001
      name: 防火墙已启用
      severity: high
      check_type: service_status
      service_name: firewalld
      expected_status: active
      alt_service_name: iptables
      fix_command: systemctl enable firewalld && systemctl start firewalld

    - id: FIREWALL-002
      name: 默认拒绝策略
      severity: high
      check_type: command
      command: iptables -L INPUT --line-numbers | head -1
      expected_output: "policy DROP"
      match_type: contains
      fix_command: iptables -P INPUT DROP && iptables -P FORWARD DROP && iptables -P OUTPUT ACCEPT

    - id: FIREWALL-003
      name: 已建立连接允许
      description: 允许已建立和相关的连接
      severity: high
      check_type: command
      command: iptables -S INPUT | grep "RELATED,ESTABLISHED" || true
      expected_output: RELATED,ESTABLISHED
      match_type: contains
      fix_command: iptables -A INPUT -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT

    - id: FIREWALL-004
      name: 环回接口允许
      description: 允许环回接口的所有流量
      severity: high
      check_type: command
      command: iptables -S INPUT | grep "lo" || true
      expected_output: "-i lo"
      match_type: contains
      fix_command: iptables -A INPUT -i lo -j ACCEPT

  ssh:
    - id: SSH-001
      name: 禁止root用户直接登录
      severity: critical
      check_type: ssh_config
      sshd_key: PermitRootLogin
      expected_value: "no"
      fix_command: sed -i 's/^PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config && systemctl restart sshd

    - id: SSH-002
      name: 禁用空密码登录
      severity: critical
      check_type: ssh_config
      sshd_key: PermitEmptyPasswords
      expected_value: "no"
      fix_command: sed -i 's/^PermitEmptyPasswords.*/PermitEmptyPasswords no/' /etc/ssh/sshd_config && systemctl restart sshd

    - id: SSH-003
      name: 禁用密码认证
      severity: high
      check_type: ssh_config
      sshd_key: PasswordAuthentication
      expected_value: "no"
      fix_command: sed -i 's/^PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config && systemctl restart sshd

    - id: SSH-004
      name: SSH空闲超时
      severity: medium
      check_type: ssh_config
      sshd_key: ClientAliveInterval
      expected_value: "300"
      unit: seconds
      compare: le
      fix_command: echo -e 'ClientAliveInterval 300\nClientAliveCountMax 0' >> /etc/ssh/sshd_config && systemctl restart sshd

    - id: SSH-005
      name: 最大认证尝试次数
      severity: high
      check_type: ssh_config
      sshd_key: MaxAuthTries
      expected_value: "3"
      unit: count
      compare: le
      fix_command: sed -i 's/^MaxAuthTries.*/MaxAuthTries 3/' /etc/ssh/sshd_config && systemctl restart sshd

    - id: SSH-006
      name: SSH端口监听
      severity: high
      check_type: port_listening
      expected_status: listening
      fix_command: systemctl restart sshd
