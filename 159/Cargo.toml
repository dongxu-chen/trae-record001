[package]
name = "git-commitlint"
version = "1.0.0"
edition = "2021"
description = "高性能Git提交消息规范检查工具 - Rust实现"
license = "MIT"
readme = "README.md"
repository = ""
categories = ["command-line-utilities", "development-tools"]
keywords = ["git", "commit", "lint", "husky"]

[dependencies]
clap = { version = "4.0", features = ["derive", "color"] }
colored = "2.0"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
thiserror = "1.0"
once_cell = "1.19"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
