# Git Commit Message 规范配置文件
# 由 git-commitlint Rust 工具使用

# 允许的提交类型
types = [
  # 功能类
  "feat",
  "feature",
  "fix",
  "bugfix",
  "hotfix",
  
  # 文档类
  "docs",
  "doc",
  "readme",
  "comment",
  
  # 代码样式
  "style",
  "format",
  "lint",
  "typo",
  
  # 重构类
  "refactor",
  "rework",
  "rewrite",
  "cleanup",
  
  # 性能类
  "perf",
  "performance",
  "optimize",
  
  # 测试类
  "test",
  "tests",
  "unittest",
  "e2e",
  
  # 构建类
  "build",
  "bundle",
  "compile",
  "package",
  
  # CI/CD
  "ci",
  "cd",
  "deploy",
  "workflow",
  
  # 依赖管理
  "deps",
  "deps-dev",
  "upgrade",
  "downgrade",
  
  # 其他
  "chore",
  "task",
  "misc",
  "wip",
  
  # 回滚
  "revert",
  "rollback",
  "revert-feat",
  
  # 安全
  "security",
  "sec",
  "patch",
  
  # 国际化
  "i18n",
  "l10n",
  "translation",
  
  # 设计
  "design",
  "ui",
  "ux",
  "theme",
  
  # 数据
  "db",
  "database",
  "migration",
  "seed",
  
  # 配置
  "config",
  "env",
  "settings",
  
  # 日志
  "log",
  "logging",
  "debug",
  "trace",
]

# 各类型对应的 emoji
[type_emojis]
# 功能类
feat = "✨"
feature = "✨"
fix = "🐛"
bugfix = "🐛"
hotfix = "🔥"

# 文档类
docs = "📝"
doc = "📝"
readme = "📖"
comment = "💬"

# 代码样式
style = "💄"
format = "🎨"
lint = "🔍"
typo = "✏️"

# 重构类
refactor = "♻️"
rework = "🔄"
rewrite = "📝"
cleanup = "🧹"

# 性能类
perf = "⚡"
performance = "⚡"
optimize = "🚀"

# 测试类
test = "✅"
tests = "✅"
unittest = "🧪"
e2e = "🔬"

# 构建类
build = "📦"
bundle = "📦"
compile = "🔨"
package = "📦"

# CI/CD
ci = "🤖"
cd = "🚀"
deploy = "🚀"
workflow = "🔄"

# 依赖管理
deps = "📦"
"deps-dev" = "🔧"
upgrade = "⬆️"
downgrade = "⬇️"

# 其他
chore = "🔧"
task = "📋"
misc = "📍"
wip = "🚧"

# 回滚
revert = "⏪"
rollback = "⏪"
"revert-feat" = "⏪✨"

# 安全
security = "🔒"
sec = "🔒"
patch = "🩹"

# 国际化
i18n = "🌍"
l10n = "🌐"
translation = "📚"

# 设计
design = "🎨"
ui = "🖼️"
ux = "🎯"
theme = "🎭"

# 数据
db = "🗄️"
database = "🗄️"
migration = "📊"
seed = "🌱"

# 配置
config = "⚙️"
env = "🌿"
settings = "⚙️"

# 日志
log = "📜"
logging = "📜"
debug = "🔍"
trace = "🔍"

# 各类型的中文描述
[type_descriptions]
# 功能类
feat = "新功能"
feature = "新功能"
fix = "修复Bug"
bugfix = "修复Bug"
hotfix = "紧急修复"

# 文档类
docs = "文档更新"
doc = "文档更新"
readme = "README更新"
comment = "代码注释"

# 代码样式
style = "代码格式"
format = "格式化"
lint = "Lint修复"
typo = "拼写错误"

# 重构类
refactor = "代码重构"
rework = "代码重写"
rewrite = "重写代码"
cleanup = "代码清理"

# 性能类
perf = "性能优化"
performance = "性能优化"
optimize = "优化代码"

# 测试类
test = "测试相关"
tests = "测试相关"
unittest = "单元测试"
e2e = "端到端测试"

# 构建类
build = "构建系统"
bundle = "打包相关"
compile = "编译相关"
