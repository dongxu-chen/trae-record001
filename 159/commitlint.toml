# CI/CD
ci = "持续集成"
cd = "持续部署"
deploy = "部署相关"
workflow = "工作流"

# 依赖管理
deps = "依赖更新"
"deps-dev" = "开发依赖"
upgrade = "升级依赖"
downgrade = "降级依赖"

# 其他
chore = "日常维护"
task = "任务处理"
misc = "杂项"
wip = "开发中"

# 回滚
revert = "回滚提交"
rollback = "代码回滚"
