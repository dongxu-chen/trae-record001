# 安全
security = "安全修复"
sec = "安全相关"
patch = "安全补丁"

# 国际化
i18n = "国际化"
l10n = "本地化"
translation = "翻译更新"

# 设计
design = "设计更新"
ui = "界面更新"
ux = "体验优化"
theme = "主题更新"

# 数据
