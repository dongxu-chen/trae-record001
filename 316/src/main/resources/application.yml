server:
  port: 8080

spring:
  application:
    name: mfa-authentication-service

  datasource:
    url: jdbc:h2:mem:mfa_db;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000
      lettuce:
        pool:
          max-active: 8
          max-wait: -1
          max-idle: 8
          min-idle: 0

  mail:
    host: smtp.example.com
    port: 587
    username: noreply@example.com
    password: password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  cache:
    type: redis
    redis:
      time-to-live: 3600000

mfa:
  sms:
    expire-minutes: 5
    code-length: 6
  email:
    expire-minutes: 10
    code-length: 6
  totp:
    time-step: 30
    digits: 6
    window-size: 1
  weauthn:
    relying-party-id: localhost
    relying-party-name: MFA Authentication Service
    origin: http://localhost:8080
  jwt:
    secret: your-256-bit-secret-key-here-must-be-at-least-32-characters
    expiration-ms: 86400000
  risk:
    threshold-medium: 30
    threshold-high: 70
    max-risk-score: 100

logging:
  level:
    com.mfa: DEBUG
    org.springframework.security: DEBUG
