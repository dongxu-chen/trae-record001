<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>归因分析 - 欺诈检测系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .sidebar {
            min-height: 100vh;
            background: #1a1a2e;
        }
        .sidebar a {
            color: #aaa;
            text-decoration: none;
            padding: 12px 20px;
            display: block;
            transition: all 0.3s;
        }
        .sidebar a:hover, .sidebar a.active {
            background: #16213e;
            color: #fff;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 12px;
            padding: 20px;
        }
        .stat-card.green {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }
        .stat-card.red {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
        }
        .stat-card.orange {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 d-none d-md-block sidebar">
                <div class="p-3 text-white border-bottom">
                    <h5>🛡️ 欺诈检测系统</h5>
                </div>
                <a href="/">📊 控制台</a>
                <a href="/review">🔍 人工审核</a>
                <a href="/network">🕸️ 发布商网络</a>
                <a href="/attribution" class="active">💰 归因分析</a>
            </nav>

            <main class="col-md-10 ms-sm-auto px-4 py-4">
                <h2 class="mb-4">💰 转化归因与损失分析</h2>

                <div class="row mb-4">
                    <div class="col-md-3">
                        <div class="stat-card">
                            <h6>总点击量</h6>
                            <h2 id="totalClicks">0</h2>
                            <small>全部点击</small>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-card green">
                            <h6>转化数</h6>
                            <h2 id="totalConversions">0</h2>
                            <small>成功转化</small>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-card red">
                            <h6>欺诈成本</h6>
                            <h2 id="fraudCost">¥0</h2>
                            <small>已浪费金额</small>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-card orange">
                            <h6>损失收入</h6>
                            <h2 id="lostRevenue">¥0</h2>
                            <small>欺诈导致损失</small>
                        </div>
                    </div>
                </div>

                <div class="row mb-4">
                    <div class="col-md-12">
                        <div class="card">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <h5 class="mb-0">流量与转化趋势</h5>
                                <select class="form-select w-auto" id="timeRange" onchange="loadTimeSeries()">
                                    <option value="24">最近24小时</option>
                                    <option value="7">最近7天</option>
                                    <option value="30">最近30天</option>
                                </select>
                            </div>
                            <div class="card-body">
                                <canvas id="trendChart" height="200"></canvas>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="mb-0">发布商表现排行</h5>
                            </div>
                            <div class="card-body p-0">
                                <table class="table table-hover mb-0">
                                    <thead>
                                        <tr>
                                            <th>发布商</th>
                                            <th>点击数</th>
                                            <th>转化数</th>
                                            <th>欺诈率</th>
                                            <th>ROI</th>
                                        </tr>
                                    </thead>
                                    <tbody id="publisherTable">
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="mb-0">智能建议</h5>
                            </div>
                            <div class="card-body">
                                <div id="recommendations" class="list-group">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row mt-4">
                    <div class="col-md-12">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="mb-0">欺诈影响分析报告</h5>
                            </div>
                            <div class="card-body" id="impactReport">
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        let trendChart = null;

        function loadData() {
            fetch('/api/attribution/summary')
                .then(res => res.json())
                .then(data => {
                    const s = data.summary;
                    document.getElementById('totalClicks').textContent = s.total_clicks;
                    document.getElementById('totalConversions').textContent = s.total_conversions;
                    document.getElementById('fraudCost').textContent = '¥' + s.fraud_cost.toFixed(2);
                    document.getElementById('lostRevenue').textContent = '¥' + s.lost_revenue.toFixed(2);

                    const impactHtml = `
                        <div class="row">
                            <div class="col-md-4">
                                <div class="text-center">
                                    <h4 class="text-danger">欺诈率</h4>
                                    <p class="display-4 text-danger">${(s.fraud_rate * 100).toFixed(1)}%</p>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="text-center">
                                    <h4 class="text-warning">欺诈成本占比</h4>
                                    <p class="display-4 text-warning">${(s.fraud_cost_percentage * 100).toFixed(1)}%</p>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="text-center">
                                    <h4 class="text-info">总ROI</h4>
                                    <p class="display-4 text-info">${((s.total_attributed_revenue - s.total_cost) / Math.max(s.total_cost, 0.01)).toFixed(2)}x</p>
                                </div>
                            </div>
                        </div>
                        <hr>
                        <div class="alert alert-info">
                            <strong>💡 摘要：</strong>
                            在 ${s.total_clicks} 次点击中，检测到 ${s.fraud_clicks} 次欺诈点击（${(s.fraud_rate * 100).toFixed(1)}%），
                            造成直接成本损失 ¥${s.fraud_cost.toFixed(2)}，
                            间接收入损失约 ¥${s.fraud_related_revenue_loss.toFixed(2)}。
                            ${s.fraud_rate > 0.2 ? '<span class="text-danger">欺诈率较高，建议立即采取措施！</span>' : '<span class="text-success">欺诈率在可控范围内。</span>'}
                        </div>
                    `;
                    document.getElementById('impactReport').innerHTML = impactHtml;
                });

            fetch('/api/attribution/publishers')
                .then(res => res.json())
                .then(publishers => {
                    publishers.sort((a, b) => (b.fraud_clicks / b.total_clicks) - (a.fraud_clicks / a.total_clicks));
                    
                    const html = publishers.map(p => {
                        const fraudRate = p.fraud_clicks / Math.max(p.total_clicks, 1);
                        const roiColor = p.roi < 0 ? 'text-danger' : p.roi < 1 ? 'text-warning' : 'text-success';
                        return `
                            <tr>
                                <td><strong>${p.publisher_id}</strong></td>
                                <td>${p.total_clicks}</td>
                                <td>${p.total_conversions}</td>
                                <td><span class="badge ${fraudRate > 0.3 ? 'bg-danger' : fraudRate > 0.1 ? 'bg-warning' : 'bg-success'}">${(fraudRate * 100).toFixed(1)}%</span></td>
                                <td class="${roiColor}">${p.roi.toFixed(2)}x</td>
                            </tr>
                        `;
                    }).join('');
                    document.getElementById('publisherTable').innerHTML = html || '<tr><td colspan="5" class="text-center text-muted">暂无数据</td></tr>';
                });

            fetch('/api/attribution/report')
                .then(res => res.json())
                .then(report => {
                    const recHtml = report.recommendations.map(r => 
                        `<li class="list-group-item">⚠️ ${r}</li>`
                    ).join('');
                    document.getElementById('recommendations').innerHTML = recHtml || '<li class="list-group-item text-muted">暂无建议</li>';
                });
        }

        function loadTimeSeries() {
            const hours = parseInt(document.getElementById('timeRange').value);
            fetch(`/api/attribution/timeseries?hours=${hours}`)
                .then(res => res.json())
                .then(data => {
                    const ctx = document.getElementById('trendChart').getContext('2d');
                    
                    if (trendChart) {
                        trendChart.destroy();
                    }

                    trendChart = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: data.time_labels,
                            datasets: [
                                {
                                    label: '总点击',
                                    data: data.clicks.total,
                                    borderColor: '#667eea',
                                    backgroundColor: 'rgba(102, 126, 234, 0.1)',
                                    fill: true,
                                    tension: 0.4
                                },
                                {
                                    label: '欺诈点击',
                                    data: data.clicks.fraud,
                                    borderColor: '#f5576c',
                                    backgroundColor: 'rgba(245, 87, 108, 0.1)',
                                    fill: true,
                                    tension: 0.4
                                },
                                {
                                    label: '转化',
                                    data: data.conversions.attributed,
                                    borderColor: '#38ef7d',
                                    backgroundColor: 'rgba(56, 239, 125, 0.1)',
                                    fill: true,
                                    tension: 0.4,
                                    yAxisID: 'y1'
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            interaction: {
                                mode: 'index',
                                intersect: false
                            },
                            scales: {
                                y: {
                                    type: 'linear',
                                    display: true,
                                    position: 'left',
                                    title: { display: true, text: '点击数' }
                                },
                                y1: {
                                    type: 'linear',
                                    display: true,
                                    position: 'right',
                                    title: { display: true, text: '转化数' },
                                    grid: { drawOnChartArea: false }
                                }
                            },
                            plugins: {
                                legend: { position: 'top' }
                            }
                        }
                    });
                });
        }

        loadData();
        loadTimeSeries();
    </script>
</body>
</html>
