global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'mq-monitor'

rule_files:
  - 'alerts.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'mq-monitor-app'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['mq-monitor-app:8080']
        labels:
          service: 'mq-monitor-platform'

  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka-exporter:9308']

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq-exporter:9419']

  - job_name: 'rocketmq'
    static_configs:
      - targets: ['rocketmq-exporter:5557']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
