apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-event-bot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-event-bot-role
rules:
- apiGroups: [""]
  resources: ["events", "pods", "pods/log"]
  verbs: ["get", "list", "watch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-event-bot-rolebinding
subjects:
- kind: ServiceAccount
  name: k8s-event-bot
  namespace: default
roleRef:
  kind: ClusterRole
  name: k8s-event-bot-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-event-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-event-bot
  template:
    metadata:
      labels:
        app: k8s-event-bot
    spec:
      serviceAccountName: k8s-event-bot
      containers:
      - name: bot
        image: k8s-event-bot:latest
        envFrom:
        - secretRef:
            name: k8s-event-bot-env
        volumeMounts:
        - name: config
          mountPath: /app/config.yaml
          subPath: config.yaml
      volumes:
      - name: config
        configMap:
          name: k8s-event-bot-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: k8s-event-bot-config
data:
  config.yaml: |
    event:
      namespaces:
        - default
      watch_interval: 5
      dedup_ttl: 300

    actions:
      restart:
        enabled: true
        max_retries: 3
      logs:
        enabled: true
        tail_lines: 100

    slack:
      bot_name: K8s Event Bot
      bot_icon: ':kubernetes:'
