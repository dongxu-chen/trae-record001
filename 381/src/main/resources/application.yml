server:
  port: 8080
  servlet:
    context-path: /points

spring:
  application:
    name: points-management

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/points_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: root
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  redis:
    host: localhost
    port: 6379
    password:
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 16
        max-idle: 8
        min-idle: 2
        max-wait: 3000ms

  rocketmq:
    name-server: 127.0.0.1:9876
    producer:
      group: points-producer-group
      send-message-timeout: 3000
      retry-times-when-send-failed: 2
      retry-times-when-send-async-failed: 2
    consumer:
      group: points-consumer-group

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.platform.points.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

redisson:
  address: redis://localhost:6379
  database: 0
  lock-watchdog-timeout: 30

points:
  expire:
    days: 365
  rank:
    top-size: 100
    shard-count: 16
  lock:
    wait-time: 3
    lease-time: -1
    watchdog: true
    time-unit: SECONDS
  mq:
    topic:
      points-grant: POINTS_GRANT_TOPIC
      points-deduct: POINTS_DEDUCT_TOPIC
      points-expire: POINTS_EXPIRE_TOPIC
