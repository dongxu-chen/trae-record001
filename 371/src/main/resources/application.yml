server:
  port: 8080
  servlet:
    context-path: /sso

spring:
  application:
    name: sso-server

  datasource:
    url: jdbc:h2:mem:sso_db;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  session:
    store-type: redis
    timeout: 30m
    redis:
      namespace: sso:session

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8

sso:
  login:
    title: "企业统一身份认证平台"
    logo: "/images/logo.png"
    background-image: "/images/login-bg.jpg"
    show-copyright: true
    copyright-text: "© 2024 企业SSO认证中心"
    enable-remember-me: true
    mfa-enabled: true
    mfa-required: false

  ldap:
    enabled: false
    urls: ldap://localhost:389
    base: dc=example,dc=com
    user-dn-pattern: uid={0},ou=users
    group-search-base: ou=groups
    group-search-filter: member={0}
    manager-dn: cn=admin,dc=example,dc=com
    manager-password: admin

  saml2:
    entity-id: https://sso.example.com/sso/saml2
    base-url: https://sso.example.com/sso
    signing-key-location: classpath:credentials/saml-signing.key
    signing-cert-location: classpath:credentials/saml-signing.crt
    encryption-key-location: classpath:credentials/saml-encryption.key
    encryption-cert-location: classpath:credentials/saml-encryption.crt

  oauth2:
    issuer: https://sso.example.com/sso
    jks-keystore: classpath:credentials/oauth2.jks
    jks-password: changeit
    key-alias: oauth2-key
    key-password: changeit

  cas:
    server-url: https://cas.example.com/cas
    service-url: https://sso.example.com/sso

  sync:
    ldap-sync-cron: "0 0 2 * * ?"
    sync-on-startup: false

logging:
  level:
    org.springframework.security: DEBUG
    com.sso: DEBUG
    org.springframework.session: DEBUG
