<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${loginConfig.title}">统一身份认证</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
<div class="login-container">
    <div class="login-background" th:style="'background-image: url(' + ${loginConfig.backgroundImage} + ')'"></div>

    <div class="login-box">
        <div class="login-header">
            <img th:src="${loginConfig.logo}" alt="Logo" class="login-logo">
            <h1 class="login-title" th:text="${loginConfig.title}">统一身份认证</h1>
        </div>

        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

        <form th:action="@{/login/process}" method="post" class="login-form">
            <input type="hidden" name="redirect_uri" th:value="${redirectUri}" th:if="${redirectUri}">
            <input type="hidden" name="client_id" th:value="${clientId}" th:if="${clientId}">
            <input type="hidden" name="protocol" th:value="${protocol}" th:if="${protocol}">

            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" required
                       placeholder="请输入用户名" autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" required
                       placeholder="请输入密码" autocomplete="current-password">
            </div>

            <div class="form-group" th:if="${loginConfig.mfaEnabled}">
                <label for="mfaCode">动态验证码 (MFA)</label>
                <input type="text" id="mfaCode" name="mfaCode"
                       placeholder="如已开启MFA请输入6位验证码"
                       autocomplete="one-time-code" maxlength="6">
            </div>

            <div class="form-options">
                <label class="checkbox" th:if="${loginConfig.enableRememberMe}">
                    <input type="checkbox" name="remember-me">
                    <span>记住我</span>
                </label>
                <a href="#" class="forgot-password">忘记密码?</a>
            </div>

            <button type="submit" class="btn btn-primary btn-block">登 录</button>

            <div class="login-divider">
                <span>其他登录方式</span>
            </div>

            <div class="social-login">
                <a th:href="@{/saml2/authenticate/default}" class="btn btn-saml">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                    </svg>
                    SAML2 登录
                </a>
                <a th:href="@{/oauth2/authorization/cas}" class="btn btn-cas">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                    </svg>
                    CAS 登录
                </a>
            </div>
        </form>

        <div class="login-footer" th:if="${loginConfig.showCopyright}">
            <p th:text="${loginConfig.copyrightText}">© 2024 SSO Center</p>
        </div>
    </div>
</div>

<script th:src="@{/js/login.js}"></script>
</body>
</html>
