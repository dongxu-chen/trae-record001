<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D室内漫游展示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            background: #1a1a2e;
            touch-action: none;
        }

        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
        }

        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 26, 46, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s ease;
        }

        #start-screen h1 {
            color: #fff;
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(100, 200, 255, 0.5);
        }

        #start-screen p {
            color: #aaa;
            font-size: 18px;
            margin-bottom: 40px;
        }

        #start-btn {
            padding: 15px 50px;
            font-size: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        #start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        #controls-hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #888;
            font-size: 14px;
            text-align: center;
            line-height: 1.8;
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 14px;
            z-index: 10;
            display: none;
        }

        .hud-item {
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 15px;
            margin-bottom: 8px;
            border-radius: 5px;
            backdrop-filter: blur(5px);
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            pointer-events: none;
            z-index: 5;
            display: none;
        }

        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
        }

        #crosshair::before {
            width: 2px;
            height: 20px;
            left: 50%;
            transform: translateX(-50%);
        }

        #crosshair::after {
            width: 20px;
            height: 2px;
            top: 50%;
            transform: translateY(-50%);
        }

        #info-panel {
            position: absolute;
            top: 50%;
            right: 30px;
            transform: translateY(-50%);
            width: 320px;
            background: rgba(20, 20, 40, 0.95);
            border-radius: 15px;
            padding: 25px;
            color: white;
            z-index: 20;
            display: none;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        #info-panel.active {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-50%) translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateY(-50%) translateX(0);
            }
        }

        #info-panel h2 {
            font-size: 22px;
            margin-bottom: 15px;
            color: #667eea;
            border-bottom: 2px solid rgba(102, 126, 234, 0.3);
            padding-bottom: 10px;
        }

        #info-panel .info-content {
            font-size: 14px;
            line-height: 1.8;
            color: #ccc;
        }

        #info-panel .info-content p {
            margin-bottom: 10px;
        }

        #info-panel .info-label {
            color: #888;
            display: inline-block;
            width: 80px;
        }

        #info-panel .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 30px;
            height: 30px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            transition: background 0.3s;
        }

        #info-panel .close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        #interact-hint {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 14px;
            z-index: 15;
            display: none;
            backdrop-filter: blur(5px);
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 20px;
            z-index: 50;
            display: none;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #outline-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
            display: none;
        }

        #joystick-container {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 120px;
            height: 120px;
            z-index: 50;
            display: none;
            touch-action: none;
        }

        #joystick-base {
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.4);
            position: relative;
            backdrop-filter: blur(5px);
        }

        #joystick-stick {
            width: 50px;
            height: 50px;
            background: rgba(102, 126, 234, 0.8);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: background 0.2s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.5);
        }

        #joystick-stick:active {
            background: rgba(102, 126, 234, 1);
        }

        #mobile-interact-btn {
            position: absolute;
            bottom: 60px;
            right: 60px;
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            z-index: 50;
            display: none;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.5);
            touch-action: none;
            user-select: none;
        }

        #mobile-interact-btn:active {
            transform: scale(0.95);
        }

        #mobile-look-area {
            position: absolute;
            top: 0;
            right: 0;
            width: 50%;
            height: 100%;
            z-index: 40;
            display: none;
            touch-action: none;
        }

        #floor-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(20, 20, 40, 0.9);
            border-radius: 15px;
            padding: 20px;
            color: white;
            z-index: 25;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: none;
            min-width: 180px;
        }

        #floor-panel.active {
            display: block;
        }

        #floor-panel h3 {
            font-size: 16px;
            margin-bottom: 15px;
            color: #667eea;
        }

        .floor-btn {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
            width: 100%;
            text-align: left;
            font-size: 14px;
        }

        .floor-btn:hover {
            background: rgba(102, 126, 234, 0.2);
            border-color: #667eea;
        }

        .floor-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: transparent;
        }

        .floor-btn .floor-icon {
            margin-right: 10px;
            font-size: 18px;
        }

        #record-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 40, 0.9);
            border-radius: 50px;
            padding: 10px 20px;
            color: white;
            z-index: 25;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: none;
            align-items: center;
            gap: 10px;
        }

        #record-panel.active {
            display: flex;
        }

        .record-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .record-btn.start {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
        }

        .record-btn.stop {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
            animation: pulse 1s infinite;
        }

        .record-btn.play {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            color: white;
        }

        .record-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        #record-status {
            font-size: 14px;
            color: #aaa;
            min-width: 120px;
        }

        #nav-panel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 40, 0.9);
            border-radius: 15px;
            padding: 15px 25px;
            color: white;
            z-index: 25;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: none;
            align-items: center;
            gap: 15px;
        }

        #nav-panel.active {
            display: flex;
        }

        #nav-target {
            font-size: 14px;
            color: #667eea;
        }

        #nav-cancel {
            padding: 8px 15px;
            background: rgba(231, 76, 60, 0.8);
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.3s;
        }

        #nav-cancel:hover {
            background: rgba(231, 76, 60, 1);
        }

        #nav-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 6;
        }

        #minimap {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 200px;
            height: 200px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            border: 2px solid rgba(102, 126, 234, 0.5);
            z-index: 25;
            display: none;
            overflow: hidden;
        }

        #minimap.active {
            display: block;
        }

        #minimap-canvas {
            width: 100%;
            height: 100%;
        }

        #minimap-label {
            position: absolute;
            top: 5px;
            left: 10px;
            color: white;
            font-size: 12px;
            text-shadow: 0 0 3px black;
        }

        .minimap-room {
            position: absolute;
            border: 1px solid rgba(102, 126, 234, 0.8);
            background: rgba(102, 126, 234, 0.3);
            cursor: pointer;
            transition: all 0.3s;
        }

        .minimap-room:hover {
            background: rgba(102, 126, 234, 0.6);
        }

        .minimap-room.active {
            background: rgba(46, 204, 113, 0.6);
            border-color: #2ecc71;
        }

        .minimap-player {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #e74c3c;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            box-shadow: 0 0 10px #e74c3c;
        }

        .minimap-room-label {
            position: absolute;
            color: white;
            font-size: 10px;
            pointer-events: none;
            text-shadow: 0 0 3px black;
        }

        #elevator-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        #elevator-overlay.active {
            display: flex;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        #elevator-display {
            font-size: 72px;
            color: #e74c3c;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(231, 76, 60, 0.5);
            margin-bottom: 20px;
        }

        #elevator-text {
            color: #aaa;
            font-size: 18px;
        }

        #tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 12px;
            pointer-events: none;
            z-index: 1000;
            display: none;
            white-space: nowrap;
        }

        @media (max-width: 768px) {
            #start-screen h1 {
                font-size: 32px;
            }

            #start-screen p {
                font-size: 14px;
            }

            #controls-hint {
                font-size: 12px;
            }

            #hud {
                display: none !important;
            }

            #floor-panel {
                right: 10px;
                top: 10px;
                padding: 10px;
                min-width: 140px;
            }

            #record-panel {
                bottom: 180px;
            }

            #minimap {
                width: 150px;
                height: 150px;
                bottom: 10px;
                right: 10px;
            }
        }

        @media (hover: none) and (pointer: coarse) {
            #joystick-container,
            #mobile-interact-btn,
            #mobile-look-area {
                display: block;
            }

            #mobile-interact-btn {
                display: flex;
            }

            #crosshair {
                display: block !important;
            }
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="canvas-container"></div>
        
        <div id="start-screen">
            <h1>🏠 3D室内漫游</h1>
            <p>沉浸式体验现代化室内设计</p>
            <button id="start-btn">开始漫游</button>
            <div id="controls-hint">
                桌面端: WASD移动 | 鼠标环视 | 点击交互 | ESC退出<br>
                移动端: 左侧摇杆移动 | 右侧滑动环视 | 右下角按钮交互<br>
                功能: R录制/停止 | P播放 | F楼层切换 | 小地图点击导航
            </div>
        </div>

        <div id="hud">
            <div class="hud-item">🎮 WASD 移动</div>
            <div class="hud-item">🖱️ 鼠标环视</div>
            <div class="hud-item">👆 点击交互</div>
            <div class="hud-item">🎥 R录制 | P播放</div>
            <div class="hud-item">🏢 F楼层切换</div>
        </div>

        <div id="crosshair"></div>
        <div id="interact-hint">按 E 或 点击 查看详情</div>

        <div id="info-panel">
            <button class="close-btn" onclick="closeInfoPanel()">×</button>
            <h2 id="info-title">物体信息</h2>
            <div class="info-content" id="info-content"></div>
        </div>

        <div id="loading">
            <div class="spinner"></div>
            <div>加载中...</div>
        </div>

        <canvas id="outline-overlay"></canvas>

        <div id="joystick-container">
            <div id="joystick-base">
                <div id="joystick-stick"></div>
            </div>
        </div>

        <div id="mobile-interact-btn">👆</div>
        <div id="mobile-look-area"></div>

        <div id="floor-panel">
            <h3>🏢 楼层选择</h3>
            <div id="floor-buttons"></div>
        </div>

        <div id="record-panel">
            <button id="record-btn" class="record-btn start" title="开始录制 (R)">⏺</button>
            <button id="play-btn" class="record-btn play" title="播放录制 (P)" disabled>▶</button>
            <div id="record-status">待机中</div>
        </div>

        <div id="nav-panel">
            <span>🧭 导航至:</span>
            <span id="nav-target">--</span>
            <button id="nav-cancel">取消</button>
        </div>

        <div id="minimap">
            <div id="minimap-label">📍 一层平面图</div>
            <canvas id="minimap-canvas"></canvas>
        </div>

        <div id="elevator-overlay">
            <div id="elevator-display">1F</div>
            <div id="elevator-text">电梯运行中...</div>
        </div>

        <div id="tooltip"></div>

        <canvas id="nav-overlay"></canvas>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

        class PriorityQueue {
            constructor() {
                this.items = [];
            }

            enqueue(item, priority) {
                this.items.push({ item, priority });
                this.items.sort((a, b) => a.priority - b.priority);
            }

            dequeue() {
                return this.items.shift().item;
            }

            isEmpty() {
                return this.items.length === 0;
            }
        }

        function findPath(start, end, floor) {
            const gridSize = 1;
            const width = Math.ceil(roomConfig.width / gridSize);
            const depth = Math.ceil(roomConfig.depth / gridSize);
            const offsetX = -roomConfig.width / 2;
            const offsetZ = -roomConfig.depth / 2;

            const startGrid = {
                x: Math.floor((start.x - offsetX) / gridSize),
                z: Math.floor((start.z - offsetZ) / gridSize)
            };
            const endGrid = {
                x: Math.floor((end.x - offsetX) / gridSize),
                z: Math.floor((end.z - offsetZ) / gridSize)
            };

            const obstacles = new Set();
            for (const { obb } of collisionOBBs) {
                const minX = Math.floor((obb.center.x - obb.halfSize.x - offsetX) / gridSize);
                const maxX = Math.ceil((obb.center.x + obb.halfSize.x - offsetX) / gridSize);
                const minZ = Math.floor((obb.center.z - obb.halfSize.z - offsetZ) / gridSize);
                const maxZ = Math.ceil((obb.center.z + obb.halfSize.z - offsetZ) / gridSize);
                for (let x = minX; x <= maxX; x++) {
                    for (let z = minZ; z <= maxZ; z++) {
                        obstacles.add(`${x},${z}`);
                    }
                }
            }

            function heuristic(a, b) {
                return Math.abs(a.x - b.x) + Math.abs(a.z - b.z);
            }

            function getNeighbors(node) {
                const neighbors = [];
                const dirs = [[0, 1], [0, -1], [1, 0], [-1, 0]];
                for (const [dx, dz] of dirs) {
                    const nx = node.x + dx;
                    const nz = node.z + dz;
                    if (nx >= 0 && nx < width && nz >= 0 && nz < depth && !obstacles.has(`${nx},${nz}`)) {
                        neighbors.push({ x: nx, z: nz });
                    }
                }
                return neighbors;
            }

            const openSet = new PriorityQueue();
            const cameFrom = new Map();
            const gScore = new Map();
            const fScore = new Map();

            const startKey = `${startGrid.x},${startGrid.z}`;
            const endKey = `${endGrid.x},${endGrid.z}`;

            gScore.set(startKey, 0);
            fScore.set(startKey, heuristic(startGrid, endGrid));
            openSet.enqueue(startGrid, fScore.get(startKey));

            while (!openSet.isEmpty()) {
                const current = openSet.dequeue();
                const currentKey = `${current.x},${current.z}`;

                if (currentKey === endKey) {
                    const path = [];
                    let curr = current;
                    while (curr) {
                        path.unshift({
                            x: curr.x * gridSize + offsetX + gridSize / 2,
                            z: curr.z * gridSize + offsetZ + gridSize / 2
                        });
                        curr = cameFrom.get(`${curr.x},${curr.z}`);
                    }
                    return path;
                }

                for (const neighbor of getNeighbors(current)) {
                    const neighborKey = `${neighbor.x},${neighbor.z}`;
                    const tentativeG = gScore.get(currentKey) + 1;

                    if (tentativeG < (gScore.get(neighborKey) || Infinity)) {
                        cameFrom.set(neighborKey, current);
                        gScore.set(neighborKey, tentativeG);
                        fScore.set(neighborKey, tentativeG + heuristic(neighbor, endGrid));
                        openSet.enqueue(neighbor, fScore.get(neighborKey));
                    }
                }
            }

            return [];
        }

        class OBB {
            constructor(center, halfSize, rotation) {
                this.center = center.clone();
                this.halfSize = halfSize.clone();
                this.rotation = rotation.clone();
                this.axes = [
                    new THREE.Vector3(1, 0, 0),
                    new THREE.Vector3(0, 1, 0),
                    new THREE.Vector3(0, 0, 1)
                ];
                this.updateAxes();
            }

            updateAxes() {
                const euler = new THREE.Euler().setFromQuaternion(this.rotation);
                this.axes[0].set(1, 0, 0).applyEuler(euler);
                this.axes[1].set(0, 1, 0).applyEuler(euler);
                this.axes[2].set(0, 0, 1).applyEuler(euler);
            }

            static fromMesh(mesh) {
                const box = new THREE.Box3().setFromObject(mesh);
                const center = new THREE.Vector3();
                const halfSize = new THREE.Vector3();
                box.getCenter(center);
                box.getSize(halfSize);
                halfSize.multiplyScalar(0.5);
                const rotation = mesh.getWorldQuaternion(new THREE.Quaternion());
                return new OBB(center, halfSize, rotation);
            }

            intersectsOBB(other) {
                const T = new THREE.Vector3().subVectors(other.center, this.center);
                const a = this.axes;
                const b = other.axes;
                const R = [];

                for (let i = 0; i < 3; i++) {
                    R[i] = [];
                    for (let j = 0; j < 3; j++) {
                        R[i][j] = a[i].dot(b[j]);
                    }
                }

                const AbsR = [];
                for (let i = 0; i < 3; i++) {
                    AbsR[i] = [];
                    for (let j = 0; j < 3; j++) {
                        AbsR[i][j] = Math.abs(R[i][j]) + 1e-6;
                    }
                }

                const t = [
                    T.dot(a[0]),
                    T.dot(a[1]),
                    T.dot(a[2])
                ];

                const ra = this.halfSize;
                const rb = other.halfSize;

                let s;

                s = Math.abs(t[0]);
                if (s > ra.x + rb.x * AbsR[0][0] + rb.y * AbsR[0][1] + rb.z * AbsR[0][2]) return false;

                s = Math.abs(t[1]);
                if (s > ra.y + rb.x * AbsR[1][0] + rb.y * AbsR[1][1] + rb.z * AbsR[1][2]) return false;

                s = Math.abs(t[2]);
                if (s > ra.z + rb.x * AbsR[2][0] + rb.y * AbsR[2][1] + rb.z * AbsR[2][2]) return false;

                s = Math.abs(T.dot(b[0]));
                if (s > rb.x + ra.x * AbsR[0][0] + ra.y * AbsR[1][0] + ra.z * AbsR[2][0]) return false;

                s = Math.abs(T.dot(b[1]));
                if (s > rb.y + ra.x * AbsR[0][1] + ra.y * AbsR[1][1] + ra.z * AbsR[2][1]) return false;

                s = Math.abs(T.dot(b[2]));
                if (s > rb.z + ra.x * AbsR[0][2] + ra.y * AbsR[1][2] + ra.z * AbsR[2][2]) return false;

                s = Math.abs(t[2] * b[1].y - t[1] * b[1].z);
                if (s > ra.y * AbsR[2][1] + ra.z * AbsR[1][1] + rb.x * AbsR[0][2] + rb.z * AbsR[0][0]) return false;

                s = Math.abs(t[2] * b[2].y - t[1] * b[2].z);
                if (s > ra.y * AbsR[2][2] + ra.z * AbsR[1][2] + rb.x * AbsR[0][1] + rb.y * AbsR[0][0]) return false;

                s = Math.abs(t[0] * b[2].z - t[2] * b[2].x);
                if (s > ra.x * AbsR[0][2] + ra.z * AbsR[2][2] + rb.x * AbsR[1][1] + rb.y * AbsR[1][0]) return false;

                s = Math.abs(t[0] * b[1].z - t[2] * b[1].x);
                if (s > ra.x * AbsR[0][1] + ra.z * AbsR[2][1] + rb.x * AbsR[2][2] + rb.z * AbsR[2][0]) return false;

                s = Math.abs(t[1] * b[0].x - t[0] * b[0].y);
                if (s > ra.x * AbsR[1][0] + ra.y * AbsR[0][0] + rb.y * AbsR[2][2] + rb.z * AbsR[2][1]) return false;

                s = Math.abs(t[1] * b[1].x - t[0] * b[1].y);
                if (s > ra.x * AbsR[1][1] + ra.y * AbsR[0][1] + rb.y * AbsR[2][2] + rb.z * AbsR[2][0]) return false;

                return true;
            }
        }

        function init() {

            outlinePass = new OutlinePass(
                new THREE.Vector2(window.innerWidth, window.innerHeight),

            );
            outlinePass.edgeStrength = 3.0;
            outlinePass.edgeGlow = 1.0;

            outlinePass.visibleEdgeColor.set('#667eea');

            controls = new PointerLockControls(camera, renderer.domElement);

            raycaster = new THREE.Raycaster();

        function createPaintingTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 300;
            const ctx = canvas.getContext('2d');

            const gradient = ctx.createLinearGradient(0, 0, 512, 300);
            gradient.addColorStop(0, '#ff6b6b');
            gradient.addColorStop(0.5, '#4ecdc4');
            gradient.addColorStop(1, '#45b7d1');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 512, 300);

            ctx.globalAlpha = 0.3;
            for (let i = 0; i < 20; i++) {
                ctx.beginPath();
                ctx.arc(
                    Math.random() * 512,
                    Math.random() * 300,
                    Math.random() * 50 + 20,
                    0,
                    Math.PI * 2
                );
                ctx.fillStyle = `hsl(${Math.random() * 360}, 70%, 60%)`;
                ctx.fill();
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.encoding = THREE.sRGBEncoding;
            return texture;
        }

            Object.keys(floors).forEach(key => {

        function switchFloor(targetFloor) {
            if (floorTransitionActive || targetFloor === currentFloor) return;

            floorTransitionActive = true;

            const elevatorOverlay = document.getElementById('elevator-overlay');
            const elevatorDisplay = document.getElementById('elevator-display');
            const elevatorText = document.getElementById('elevator-text');

            elevatorOverlay.classList.add('active');
            elevatorText.textContent = '电梯运行中...';

            let displayFloor = currentFloor;
            const direction = targetFloor > currentFloor ? 1 : -1;

            const animateElevator = () => {
                displayFloor += direction * 0.05;
                elevatorDisplay.textContent = `${Math.round(displayFloor)}F`;

                if ((direction > 0 && displayFloor >= targetFloor) || (direction < 0 && displayFloor <= targetFloor)) {
                    elevatorDisplay.textContent = `${targetFloor}F`;
                    elevatorText.textContent = '到达目标楼层';
                    
                    setTimeout(() => {
                        showFloor(targetFloor);
                        
                        const yOffset = floors[targetFloor].yOffset;
                        if (isMobile) {
                            camera.position.set(0, yOffset + PLAYER_HEIGHT, 5);
                        } else {
                            controls.getObject().position.set(0, yOffset + PLAYER_HEIGHT, 5);
                        }
                        
                        elevatorOverlay.classList.remove('active');
                        floorTransitionActive = false;
                    }, 500);
                } else {
                    requestAnimationFrame(animateElevator);
                }
            };

            animateElevator();
        }

        function checkCollision(newPosition) {
            const playerOBB = new OBB(
                new THREE.Vector3(newPosition.x, newPosition.y - PLAYER_HEIGHT / 2, newPosition.z),
                new THREE.Vector3(PLAYER_RADIUS, PLAYER_HEIGHT / 2, PLAYER_RADIUS),
                new THREE.Quaternion()
            );

            for (const { obb } of collisionOBBs) {
                obb.updateAxes();
                if (playerOBB.intersectsOBB(obb)) {
                    return true;
                }
            }
            return false;
        }

        function startNavigation(room) {
            const pos = isMobile ? camera.position : controls.getObject().position;
            const startPos = { x: pos.x, z: pos.z };
            const endPos = { x: room.x, z: room.z };

            navPath = findPath(startPos, endPos, currentFloor);
            if (navPath.length > 0) {
                navTarget = room;
                navActive = true;

                document.getElementById('nav-panel').classList.add('active');
                document.getElementById('nav-target').textContent = room.name;
                document.querySelectorAll('.minimap-room').forEach(el => el.classList.remove('active'));
                event.target.classList.add('active');

                createNavArrow();
            }
        }

        function createNavArrow() {
            if (navArrow) {
                scene.remove(navArrow);
            }

            const arrowGroup = new THREE.Group();

            const arrowShape = new THREE.Mesh(
                new THREE.ConeGeometry(0.3, 0.5, 4),
                new THREE.MeshBasicMaterial({ color: 0x00ff00, transparent: true, opacity: 0.8 })
            );
            arrowShape.rotation.x = Math.PI;
            arrowGroup.add(arrowShape);

            navArrow = arrowGroup;
            scene.add(navArrow);
        }

        function updateNavigation(delta) {
            if (!navActive || navPath.length === 0) return;

            const pos = isMobile ? camera.position : controls.getObject().position;
            const target = navPath[0];
            const dx = target.x - pos.x;
            const dz = target.z - pos.z;
            const distance = Math.sqrt(dx * dx + dz * dz);

            if (distance < 0.5) {
                navPath.shift();
                if (navPath.length === 0) {
                    cancelNavigation();
                    return;
                }
            }

            if (navArrow) {
                const nextTarget = navPath[0];
                navArrow.position.set(nextTarget.x, floors[currentFloor].yOffset + 2, nextTarget.z);
                navArrow.rotation.y += delta * 2;
            }

            const speed = 3;
            const moveX = (dx / distance) * speed * delta;
            const moveZ = (dz / distance) * speed * delta;

            const newPos = pos.clone();
            newPos.x += moveX;
            newPos.z += moveZ;

            if (isMobile) {
                camera.position.copy(newPos);
            } else {
                controls.getObject().position.copy(newPos);
            }

            const targetDir = new THREE.Vector3(target.x - pos.x, 0, target.z - pos.z).normalize();
            const targetRotation = Math.atan2(targetDir.x, targetDir.z);
            if (isMobile) {
                const currentRot = camera.rotation.y;
                camera.rotation.y += (targetRotation - currentRot) * 0.1;
            }
        }

        function cancelNavigation() {
            navActive = false;
            navPath = [];
            navTarget = null;
            if (navArrow) {
                scene.remove(navArrow);
                navArrow = null;
            }
            document.getElementById('nav-panel').classList.remove('active');
            document.querySelectorAll('.minimap-room').forEach(el => el.classList.remove('active'));
        }

        function toggleRecording() {
            if (isPlaying) {
                stopPlayback();
            }
            if (!isRecording) {
                startRecording();
            } else {
                stopRecording();
            }
        }

        function startRecording() {
            isRecording = true;
            recordedFrames = [];
            lastRecordTime = performance.now();
            document.getElementById('record-btn').classList.remove('start');
            document.getElementById('record-btn').classList.add('stop');
            document.getElementById('record-btn').textContent = '⏹';
            document.getElementById('record-status').textContent = '录制中...';
        }

        function stopRecording() {
            isRecording = false;
            document.getElementById('record-btn').classList.remove('stop');
            document.getElementById('record-btn').classList.add('start');
            document.getElementById('record-btn').textContent = '⏺';
            document.getElementById('record-status').textContent = `已录制 ${recordedFrames.length} 帧`;
            document.getElementById('play-btn').disabled = false;
        }

        function recordFrame() {
            if (!isRecording) return;

            const now = performance.now();
            if (now - lastRecordTime < 50) return;
            lastRecordTime = now;

            const pos = isMobile ? camera.position.clone() : controls.getObject().position.clone();
            const rot = camera.quaternion.clone();

            recordedFrames.push({
                position: { x: pos.x, y: pos.y, z: pos.z },
                rotation: { x: rot.x, y: rot.y, z: rot.z, w: rot.w },
                floor: currentFloor,
                timestamp: now
            });
        }

        function togglePlayback() {
            if (isRecording) {
                stopRecording();
            }
            if (!isPlaying) {
                startPlayback();
            } else {
                stopPlayback();
            }
        }

        function startPlayback() {
            if (recordedFrames.length === 0) return;

            isPlaying = true;
            playIndex = 0;
            document.getElementById('play-btn').textContent = '⏸';
            document.getElementById('record-status').textContent = '播放中...';
            cancelNavigation();
        }

        function stopPlayback() {
            isPlaying = false;
            document.getElementById('play-btn').textContent = '▶';
            document.getElementById('record-status').textContent = '播放完成';
            setTimeout(() => {
                if (!isRecording) document.getElementById('record-status').textContent = '待机中';
            }, 2000);
        }

        function updatePlayback() {
            if (!isPlaying || playIndex >= recordedFrames.length) {
                if (playIndex >= recordedFrames.length) {
                    stopPlayback();
                }
                return;
            }

            const frame = recordedFrames[playIndex];
            const nextFrame = recordedFrames[playIndex + 1];
            if (!nextFrame) {
                playIndex++;
                return;
            }

            const progress = (performance.now() - frame.timestamp) / (nextFrame.timestamp - frame.timestamp);

            if (progress >= 1) {
                playIndex++;
                return;
            }

            const pos = new THREE.Vector3(
                frame.position.x + (nextFrame.position.x - frame.position.x) * progress,
                frame.position.y + (nextFrame.position.y - frame.position.y) * progress,
                frame.position.z + (nextFrame.position.z - frame.position.z) * progress
            );

            const rot = new THREE.Quaternion(
                frame.rotation.x + (nextFrame.rotation.x - frame.rotation.x) * progress,
                frame.rotation.y + (nextFrame.rotation.y - frame.rotation.y) * progress,
                frame.rotation.z + (nextFrame.rotation.z - frame.rotation.z) * progress,
                frame.rotation.w + (nextFrame.rotation.w - frame.rotation.w) * progress
            );

            if (frame.floor !== currentFloor) {
                showFloor(frame.floor);
            }

            if (isMobile) {
                camera.position.copy(pos);
                camera.quaternion.copy(rot);
            } else {
                controls.getObject().position.copy(pos);
                camera.quaternion.copy(rot);
            }
        }

        function setupEventListeners() {
            const onKeyDown = (event) => {
                if (isPlaying) return;
                switch (event.code) {
                    case 'ArrowUp':
                    case 'KeyW':
                        moveForward = true;
                        break;
                    case 'ArrowLeft':
                    case 'KeyA':
                        moveLeft = true;
                        break;
                    case 'ArrowDown':
                    case 'KeyS':
                        moveBackward = true;
                        break;
                    case 'ArrowRight':
                    case 'KeyD':
                        moveRight = true;
                        break;
                    case 'Space':
                        if (canJump) {
                            velocity.y = JUMP_HEIGHT;
                            canJump = false;
                        }
                        break;
                    case 'KeyE':
                        tryInteract();
                        break;
                    case 'KeyR':
                        toggleRecording();
                        break;
                    case 'KeyP':
                        togglePlayback();
                        break;
                    case 'KeyF':
                        const floorPanel = document.getElementById('floor-panel');
                        floorPanel.classList.toggle('active');
                        break;
                }
            };

            const onKeyUp = (event) => {
                switch (event.code) {
                    case 'ArrowUp':
                    case 'KeyW':
                        moveForward = false;
                        break;
                    case 'ArrowLeft':
                    case 'KeyA':
                        moveLeft = false;
                        break;
                    case 'ArrowDown':
                    case 'KeyS':
                        moveBackward = false;
                        break;
                    case 'ArrowRight':
                    case 'KeyD':
                        moveRight = false;
                        break;
                }
            };

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);

            window.addEventListener('resize', onWindowResize);

            document.getElementById('start-btn').addEventListener('click', () => {
                if (isMobile) {
                    startMobileMode();
                } else {
                    controls.lock();
                }
            });

            controls.addEventListener('lock', () => {
                isLocked = true;
                document.getElementById('start-screen').style.display = 'none';
                document.getElementById('hud').style.display = 'block';
                document.getElementById('crosshair').style.display = 'block';
                document.getElementById('floor-panel').classList.add('active');
                document.getElementById('record-panel').classList.add('active');
                document.getElementById('minimap').classList.add('active');
            });

            controls.addEventListener('unlock', () => {
                if (!isMobile) {
                    isLocked = false;
                    document.getElementById('start-screen').style.display = 'flex';
                    document.getElementById('hud').style.display = 'none';
                    document.getElementById('crosshair').style.display = 'none';
                    document.getElementById('interact-hint').style.display = 'none';
                    document.getElementById('floor-panel').classList.remove('active');
                    document.getElementById('record-panel').classList.remove('active');
                    document.getElementById('minimap').classList.remove('active');
                    clearHighlight();
                    cancelNavigation();
                }
            });

            renderer.domElement.addEventListener('click', onCanvasClick);
        }

        function setupMobileControls() {
            const joystickContainer = document.getElementById('joystick-container');
            const joystickStick = document.getElementById('joystick-stick');
            const interactBtn = document.getElementById('mobile-interact-btn');
            const lookArea = document.getElementById('mobile-look-area');

            let joystickCenterX = 0, joystickCenterY = 0;
            const maxRadius = 45;

            joystickContainer.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                const rect = joystickContainer.getBoundingClientRect();
                joystickCenterX = rect.left + rect.width / 2;
                joystickCenterY = rect.top + rect.height / 2;
                joystickActive = true;
                updateJoystick(touch.clientX, touch.clientY);
            }, { passive: false });

            document.addEventListener('touchmove', (e) => {
                if (joystickActive) {
                    e.preventDefault();
                    const touch = Array.from(e.touches).find(t => {
                        const target = document.elementFromPoint(t.clientX, t.clientY);
                        return target && target.closest('#joystick-container');
                    });
                    if (touch) {
                        updateJoystick(touch.clientX, touch.clientY);
                    }
                }
            }, { passive: false });

            document.addEventListener('touchend', (e) => {
                const joystickTouch = Array.from(e.changedTouches).find(t => {
                    const target = document.elementFromPoint(t.clientX, t.clientY);
                    return target && target.closest('#joystick-container');
                });
                if (joystickTouch) {
                    joystickActive = false;
                    joystickVector.x = 0;
                    joystickVector.y = 0;
                    joystickStick.style.transform = 'translate(-50%, -50%)';
                    moveForward = false;
                    moveBackward = false;
                    moveLeft = false;
                    moveRight = false;
                }
            });

            function updateJoystick(clientX, clientY) {
                let dx = clientX - joystickCenterX;
                let dy = clientY - joystickCenterY;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance > maxRadius) {
                    dx = (dx / distance) * maxRadius;
                    dy = (dy / distance) * maxRadius;
                }

                joystickStick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
                
                joystickVector.x = dx / maxRadius;
                joystickVector.y = dy / maxRadius;

                moveForward = joystickVector.y < -0.2;
                moveBackward = joystickVector.y > 0.2;
                moveLeft = joystickVector.x < -0.2;
                moveRight = joystickVector.x > 0.2;
            }

            lookArea.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (e.touches.length === 1) {
                    mobileLookActive = true;
                    lastTouchX = e.touches[0].clientX;
                    lastTouchY = e.touches[0].clientY;
                }
            }, { passive: false });

            lookArea.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (mobileLookActive && e.touches.length === 1) {
                    const touch = e.touches[0];
                    const deltaX = touch.clientX - lastTouchX;
                    const deltaY = touch.clientY - lastTouchY;
                    
                    const sensitivity = 0.003;
                    
                    const euler = new THREE.Euler(0, 0, 0, 'YXZ');
                    euler.setFromQuaternion(camera.quaternion);
                    euler.y -= deltaX * sensitivity;
                    euler.x -= deltaY * sensitivity;
                    euler.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, euler.x));
                    camera.quaternion.setFromEuler(euler);
                    
                    lastTouchX = touch.clientX;
                    lastTouchY = touch.clientY;
                }
            }, { passive: false });

            lookArea.addEventListener('touchend', () => {
                mobileLookActive = false;
            });

            interactBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                tryInteract();
            }, { passive: false });

            renderer.domElement.addEventListener('touchstart', (e) => {
                const touch = e.touches[0];
                const target = document.elementFromPoint(touch.clientX, touch.clientY);
                if (!target.closest('#joystick-container') && !target.closest('#mobile-look-area') && !target.closest('#mobile-interact-btn')) {
                    if (isLocked) {
                        tryInteract();
                    }
                }
            });
        }

        function startMobileMode() {
            isLocked = true;
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('crosshair').style.display = 'block';
            document.getElementById('hud').style.display = 'none';
            document.getElementById('floor-panel').classList.add('active');
            document.getElementById('record-panel').classList.add('active');
            document.getElementById('minimap').classList.add('active');
        }

        function onCanvasClick(event) {
            if (!isLocked || isPlaying) return;
            tryInteract();
        }

        function tryInteract() {
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            raycaster.far = 3;

            const intersects = raycaster.intersectObjects(interactiveObjects, true);

            if (intersects.length > 0) {
                let obj = intersects[0].object;
                while (obj && !obj.userData.interactive) {
                    obj = obj.parent;
                }
                if (obj && obj.userData.interactive) {
                    if (obj.userData.dataKey === 'elevator') {
                        const nextFloor = currentFloor % 3 + 1;
                        switchFloor(nextFloor);
                    } else {
                        showInfoPanel(obj.userData.dataKey);
                    }
                }
            }
        }

        function updateHighlight() {
            if (!isLocked || isPlaying) {
                clearHighlight();
                return;
            }

            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            raycaster.far = 3;

            const intersects = raycaster.intersectObjects(interactiveObjects, true);

            if (intersects.length > 0) {
                let obj = intersects[0].object;
                while (obj && !obj.userData.interactive) {
                    obj = obj.parent;
                }
                if (obj && obj.userData.interactive) {
                    if (highlightedObject !== obj) {
                        clearHighlight();
                        highlightedObject = obj;
                        applyHighlight(obj);
                    }
                    document.getElementById('interact-hint').style.display = 'block';
                    return;
                }
            }

            clearHighlight();
            document.getElementById('interact-hint').style.display = 'none';
        }

        function applyHighlight(object) {
            const selectedObjects = [];
            object.traverse((child) => {
                if (child.isMesh) {
                    selectedObjects.push(child);
                }
            });
            outlinePass.selectedObjects = selectedObjects;
        }

        function clearHighlight() {
            highlightedObject = null;
            outlinePass.selectedObjects = [];
        }

        function showInfoPanel(dataKey) {
            const data = furnitureData[dataKey];
            if (!data) return;

            const panel = document.getElementById('info-panel');
            const title = document.getElementById('info-title');
            const content = document.getElementById('info-content');

            title.textContent = data.title;
            content.innerHTML = '';

            for (const [key, value] of Object.entries(data.info)) {
                const p = document.createElement('p');
                p.innerHTML = `<span class="info-label">${key}:</span>${value}`;
                content.appendChild(p);
            }

            panel.classList.add('active');
            if (!isMobile) {
                controls.unlock();
            }
            clearHighlight();
        }

        window.closeInfoPanel = function() {
            document.getElementById('info-panel').classList.remove('active');
            if (!isMobile && !isLocked) {
                controls.lock();
            }
        };

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            if (isLocked && !isPlaying) {
                if (navActive) {
                    updateNavigation(delta);
                } else {
                    velocity.x -= velocity.x * 10.0 * delta;
                    velocity.z -= velocity.z * 10.0 * delta;
                    velocity.y -= GRAVITY * delta;

                    direction.z = Number(moveForward) - Number(moveBackward);
                    direction.x = Number(moveRight) - Number(moveLeft);
                    direction.normalize();

                    if (moveForward || moveBackward) {
                        velocity.z -= direction.z * MOVE_SPEED * delta;
                    }
                    if (moveLeft || moveRight) {
                        velocity.x -= direction.x * MOVE_SPEED * delta;
                    }

                    const forward = new THREE.Vector3();
                    camera.getWorldDirection(forward);
                    forward.y = 0;
                    forward.normalize();

                    const right = new THREE.Vector3();
                    right.crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();

                    const moveX = (-velocity.x * right.x - velocity.z * forward.x) * delta;
                    const moveZ = (-velocity.x * right.z - velocity.z * forward.z) * delta;

                    const newPosition = isMobile ? camera.position.clone() : controls.getObject().position.clone();
                    
                    const testX = newPosition.clone();
                    testX.x += moveX;
                    if (!checkCollision(testX)) {
                        newPosition.x = testX.x;
                    }

                    const testZ = newPosition.clone();
                    testZ.z += moveZ;
                    if (!checkCollision(testZ)) {
                        newPosition.z = testZ.z;
                    }

                    newPosition.y += velocity.y * delta;

                    if (newPosition.y < PLAYER_HEIGHT + floors[currentFloor].yOffset) {
                        velocity.y = 0;
                        newPosition.y = PLAYER_HEIGHT + floors[currentFloor].yOffset;
                        canJump = true;
                    }

                    if (isMobile) {
                        camera.position.copy(newPosition);
                    } else {
                        controls.getObject().position.copy(newPosition);
                    }
                }

                updateHighlight();
                recordFrame();
                updateMinimapPlayer();
            }

            if (isPlaying) {
                updatePlayback();
            }

            prevTime = time;
            composer.render();
        }

        init();
    </script>
</body>
