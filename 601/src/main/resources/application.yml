server:
  port: 8080

spring:
  application:
    name: data-sync-checker
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss

datasource:
  mysql:
    source:
      url: jdbc:mysql://localhost:3306/source_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
      username: root
      password: root
      driver-class-name: com.mysql.cj.jdbc.Driver
      maximum-pool-size: 20
      minimum-idle: 5
    target:
      url: jdbc:mysql://localhost:3306/target_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
      username: root
      password: root
      driver-class-name: com.mysql.cj.jdbc.Driver
      maximum-pool-size: 20
      minimum-idle: 5

data:
  redis:
    source:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 3000
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
    target:
      host: localhost
      port: 6380
      password:
      database: 0
      timeout: 3000
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

elasticsearch:
  source:
    hosts: http://localhost:9200
    username:
    password:
    connect-timeout: 5000
    socket-timeout: 30000
  target:
    hosts: http://localhost:9201
    username:
    password:
    connect-timeout: 5000
    socket-timeout: 30000

message-queue:
  type: kafka
  kafka:
    bootstrap-servers: localhost:9092
    topic: data-sync-topic
    group-id: data-sync-checker-group
    producer:
      acks: all
      retries: 3
      batch-size: 16384
      linger-ms: 1
      buffer-memory: 33554432
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 500
  rocketmq:
    namesrv-addr: localhost:9876
    producer-group: data-sync-producer-group
    consumer-group: data-sync-consumer-group
    topic: data-sync-topic

check:
  scheduler:
    enabled: true
    cron: "0 */1 * * * ?"
  batch-size: 1000
  parallel-threads: 4
  latency-threshold-ms: 5000
  stratified:
    enabled: true
    stratum-count: 10
  auto-repair:
    enabled: true
    transactional: true
  threshold:
    CRITICAL:
      latency-threshold-ms: 1000
      batch-size: 500
    HIGH:
      latency-threshold-ms: 3000
      batch-size: 1000
    MEDIUM:
      latency-threshold-ms: 5000
      batch-size: 2000
    LOW:
      latency-threshold-ms: 10000
      batch-size: 5000
  gray-release:
    enabled: true
    default-phases:
      - percentage: 10
        duration-minutes: 30
      - percentage: 30
        duration-minutes: 30
      - percentage: 60
        duration-minutes: 30
      - percentage: 100
        duration-minutes: 0
    diff-rate-pause-threshold: 0.1
  predictive:
    enabled: true
    history-window-hours: 24
    analysis-interval-ms: 300000
    diff-trend-threshold: 0.1
    latency-trend-threshold: 0.2

websocket:
  endpoint: /ws
  allowed-origins: "*"
  heartbeat-interval-ms: 30000

logging:
  level:
    com.datacheck: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
