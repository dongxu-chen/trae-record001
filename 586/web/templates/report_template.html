<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API模糊测试报告 - {{ test_run_id }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .code { font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace; }
        .anomaly-high { border-left: 4px solid #dc2626; }
        .anomaly-medium { border-left: 4px solid #d97706; }
        .anomaly-low { border-left: 4px solid #2563eb; }
        .print-only { display: none; }
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block; }
            body { background: white !important; }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="max-w-7xl mx-auto px-4 py-8">
        <div class="bg-white rounded-xl shadow-lg overflow-hidden mb-8">
            <div class="bg-gradient-to-r from-blue-600 to-purple-700 px-8 py-6">
                <div class="flex justify-between items-start">
                    <div>
                        <h1 class="text-3xl font-bold text-white mb-2">API模糊测试报告</h1>
                        <p class="text-blue-100">{{ api_name }}</p>
                        <p class="text-blue-200 text-sm mt-1">测试ID: {{ test_run_id }}</p>
                    </div>
                    <div class="text-right no-print">
                        <button onclick="window.print()" class="bg-white/20 hover:bg-white/30 text-white px-4 py-2 rounded-lg text-sm transition-colors">
                            🖨️ 打印报告
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="p-8">
                <div id="report-content"></div>
            </div>
        </div>
    </div>

    <script>
        const reportData = {{ report_data|safe }};
        
        function formatDate(timestamp) {
            return new Date(timestamp * 1000).toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }
        
        function formatDuration(seconds) {
            if (seconds < 60) return `${seconds.toFixed(1)}s`;
            const mins = Math.floor(seconds / 60);
            const secs = (seconds % 60).toFixed(1);
            return `${mins}m ${secs}s`;
        }
        
        function getSeverityColor(severity) {
            switch(severity) {
                case 'high': return { bg: 'bg-red-100', text: 'text-red-800', border: 'border-red-500' };
                case 'medium': return { bg: 'bg-yellow-100', text: 'text-yellow-800', border: 'border-yellow-500' };
                case 'low': return { bg: 'bg-blue-100', text: 'text-blue-800', border: 'border-blue-500' };
                default: return { bg: 'bg-gray-100', text: 'text-gray-800', border: 'border-gray-500' };
            }
        }
        
        function renderReport() {
            const data = reportData;
            const summary = data.summary || {};
            const container = document.getElementById('report-content');
            
            const passRate = summary.pass_rate || 0;
            const vulnScore = summary.vulnerability_score || 0;
            
            let statusBadge = '';
            if (passRate >= 90) {
                statusBadge = '<span class="px-4 py-1 bg-green-100 text-green-800 rounded-full text-sm font-medium">✓ 优秀</span>';
            } else if (passRate >= 70) {
                statusBadge = '<span class="px-4 py-1 bg-yellow-100 text-yellow-800 rounded-full text-sm font-medium">⚠ 良好</span>';
            } else {
                statusBadge = '<span class="px-4 py-1 bg-red-100 text-red-800 rounded-full text-sm font-medium">✗ 需修复</span>';
            }
            
            container.innerHTML = `
                <div class="mb-8">
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
                        <div class="bg-gray-50 rounded-xl p-5 text-center">
                            <div class="text-4xl font-bold text-gray-800">${data.total_tests}</div>
                            <div class="text-sm text-gray-500 mt-1">总测试数</div>
                        </div>
                        <div class="bg-green-50 rounded-xl p-5 text-center">
                            <div class="text-4xl font-bold text-green-600">${data.passed_tests}</div>
                            <div class="text-sm text-gray-500 mt-1">通过测试</div>
                        </div>
                        <div class="bg-red-50 rounded-xl p-5 text-center">
                            <div class="text-4xl font-bold text-red-600">${data.failed_tests}</div>
                            <div class="text-sm text-gray-500 mt-1">发现异常</div>
                        </div>
                        <div class="bg-blue-50 rounded-xl p-5 text-center">
                            <div class="text-4xl font-bold text-blue-600">${passRate.toFixed(1)}%</div>
                            <div class="text-sm text-gray-500 mt-1">通过率</div>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                        <div class="bg-gray-50 rounded-xl p-6">
                            <h3 class="font-semibold text-gray-800 mb-4">测试概览</h3>
                            <div class="space-y-3 text-sm">
                                <div class="flex justify-between">
                                    <span class="text-gray-500">测试名称</span>
                                    <span class="font-medium">${data.api_name}</span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-gray-500">测试ID</span>
                                    <span class="font-mono text-xs">${data.test_run_id}</span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-gray-500">开始时间</span>
                                    <span>${formatDate(data.start_time)}</span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-gray-500">结束时间</span>
                                    <span>${formatDate(data.end_time)}</span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-gray-500">测试时长</span>
                                    <span>${formatDuration(summary.duration_seconds || 0)}</span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-gray-500">测试模式</span>
                                    <span>${data.config?.test_mode || 'single'}</span>
                                </div>
                                <div class="flex justify-between items-center">
                                    <span class="text-gray-500">整体评估</span>
                                    ${statusBadge}
                                </div>
                            </div>
                        </div>
                        
                        <div class="bg-gray-50 rounded-xl p-6">
                            <h3 class="font-semibold text-gray-800 mb-4">漏洞风险评估</h3>
                            <div class="mb-6">
                                <div class="flex justify-between text-sm mb-2">
                                    <span class="text-gray-600">风险评分</span>
                                    <span class="font-bold text-xl ${vulnScore >= 50 ? 'text-red-600' : vulnScore >= 20 ? 'text-yellow-600' : 'text-green-600'}">${vulnScore}/100</span>
                                </div>
                                <div class="w-full bg-gray-200 rounded-full h-4 overflow-hidden">
                                    <div class="h-4 rounded-full transition-all ${
                                        vulnScore >= 50 ? 'bg-gradient-to-r from-red-400 to-red-600' :
                                        vulnScore >= 20 ? 'bg-gradient-to-r from-yellow-400 to-yellow-600' :
                                        'bg-gradient-to-r from-green-400 to-green-600'
                                    }" style="width: ${Math.min(vulnScore, 100)}%"></div>
                                </div>
                                <div class="text-xs text-gray-500 mt-2 text-center">
                                    ${vulnScore >= 50 ? '🔴 高风险 - 需要立即修复' :
                                      vulnScore >= 20 ? '🟡 中等风险 - 建议修复' :
                                      '🟢 低风险 - 持续监控'}
                                </div>
                            </div>
                            
                            <div class="grid grid-cols-3 gap-2 text-center text-xs">
                                <div class="p-2 bg-red-50 rounded-lg">
                                    <div class="text-lg font-bold text-red-600">${summary.severity_distribution?.high || 0}</div>
                                    <div class="text-gray-500">高危</div>
                                </div>
                                <div class="p-2 bg-yellow-50 rounded-lg">
                                    <div class="text-lg font-bold text-yellow-600">${summary.severity_distribution?.medium || 0}</div>
                                    <div class="text-gray-500">中危</div>
                                </div>
                                <div class="p-2 bg-blue-50 rounded-lg">
                                    <div class="text-lg font-bold text-blue-600">${summary.severity_distribution?.low || 0}</div>
                                    <div class="text-gray-500">低危</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                        <div class="bg-gray-50 rounded-xl p-6">
                            <h3 class="font-semibold text-gray-800 mb-4">异常类型分布</h3>
                            <canvas id="typeChart" height="200"></canvas>
                        </div>
                        <div class="bg-gray-50 rounded-xl p-6">
                            <h3 class="font-semibold text-gray-800 mb-4">严重程度分布</h3>
                            <canvas id="severityChart" height="200"></canvas>
                        </div>
                    </div>
                    
                    ${summary.recommendations && summary.recommendations.length > 0 ? `
                    <div class="bg-blue-50 border border-blue-200 rounded-xl p-6 mb-8">
                        <h3 class="font-semibold text-blue-800 mb-4 flex items-center">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                            </svg>
                            修复建议
                        </h3>
                        <ul class="space-y-2">
                            ${summary.recommendations.map(rec => `
                                <li class="flex items-start">
                                    <span class="text-blue-500 mr-2">•</span>
                                    <span class="text-blue-900">${rec}</span>
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                    ` : ''}
                    
                    <div class="bg-white border rounded-xl overflow-hidden mb-8">
                        <div class="bg-gray-50 px-6 py-4 border-b">
                            <h3 class="font-semibold text-gray-800">受影响的参数</h3>
                        </div>
                        <div class="divide-y">
                            ${Object.entries(summary.param_anomalies || {}).map(([param, info]) => `
                                <div class="px-6 py-4 hover:bg-gray-50">
                                    <div class="flex justify-between items-start">
                                        <div>
                                            <span class="font-medium">${param}</span>
                                            <span class="ml-2 text-sm text-gray-500">${info.count} 个异常</span>
                                        </div>
                                        <div class="flex gap-1">
                                            ${[...new Set(info.anomalies.map(a => a.severity))].map(s => {
                                                const colors = getSeverityColor(s);
                                                return `<span class="px-2 py-0.5 rounded text-xs ${colors.bg} ${colors.text}">${s.toUpperCase()}</span>`;
                                            }).join('')}
                                        </div>
                                    </div>
                                </div>
                            `).join('') || '<div class="px-6 py-8 text-center text-gray-500">无受影响参数</div>'}
                        </div>
                    </div>
                    
                    <div class="mb-8">
                        <h3 class="font-semibold text-gray-800 mb-4">详细测试用例</h3>
                        <div class="space-y-3">
                            ${data.test_cases.map((tc, idx) => {
                                const hasAnomaly = tc.anomalies && tc.anomalies.length > 0;
                                const severity = hasAnomaly ? tc.anomalies[0].severity : null;
                                const colors = severity ? getSeverityColor(severity) : null;
                                
                                return `
                                    <div class="bg-white border rounded-xl overflow-hidden ${hasAnomaly ? `anomaly-${severity}` : ''}">
                                        <div class="px-6 py-4 cursor-pointer" onclick="toggleTestCase(${idx})">
                                            <div class="flex justify-between items-center">
                                                <div class="flex items-center gap-4">
                                                    <span class="text-gray-400 font-mono text-sm">#${idx + 1}</span>
                                                    <div>
                                                        <span class="font-medium">${tc.tested_param}</span>
                                                        <span class="ml-2 text-xs text-gray-500 code">${JSON.stringify(tc.test_value).substring(0, 60)}</span>
                                                    </div>
                                                </div>
                                                <div class="flex items-center gap-4">
                                                    ${hasAnomaly ? `
                                                        <span class="px-2 py-1 rounded text-xs font-medium ${colors.bg} ${colors.text}">
                                                            ${severity.toUpperCase()}
                                                        </span>
                                                    ` : '<span class="text-green-600 text-sm">✓ 通过</span>'}
                                                    <span class="text-gray-500 text-sm">${tc.request.response_time.toFixed(0)}ms</span>
                                                    <span class="text-gray-400">${tc.request.status_code || 'ERR'}</span>
                                                    <svg id="arrow-${idx}" class="w-5 h-5 text-gray-400 transform transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                                                    </svg>
                                                </div>
                                            </div>
                                            ${hasAnomaly ? `<div class="mt-2 text-sm text-gray-600">${tc.anomalies[0].description}</div>` : ''}
                                        </div>
                                        <div id="detail-${idx}" class="hidden border-t bg-gray-50 px-6 py-4">
                                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                                <div>
                                                    <h4 class="font-medium text-gray-700 mb-2">请求信息</h4>
                                                    <div class="text-sm space-y-1">
                                                        <div><span class="text-gray-500">方法:</span> ${tc.request.method}</div>
                                                        <div><span class="text-gray-500">URL:</span> <span class="code text-xs break-all">${tc.request.url}</span></div>
                                                        <div><span class="text-gray-500">类型:</span> ${tc.value_type}</div>
                                                        <div><span class="text-gray-500">描述:</span> ${tc.description}</div>
                                                    </div>
                                                </div>
                                                <div>
                                                    <h4 class="font-medium text-gray-700 mb-2">响应信息</h4>
                                                    <div class="text-sm space-y-1">
                                                        <div><span class="text-gray-500">状态码:</span> ${tc.request.status_code || '请求失败'}</div>
                                                        <div><span class="text-gray-500">响应时间:</span> ${tc.request.response_time.toFixed(0)}ms</div>
                                                        <div><span class="text-gray-500">测试ID:</span> <span class="code text-xs">${tc.test_id}</span></div>
                                                    </div>
                                                </div>
                                            </div>
                                            
                                            <div class="mt-4">
                                                <h4 class="font-medium text-gray-700 mb-2">请求参数</h4>
                                                <pre class="bg-white p-3 rounded-lg text-xs code overflow-auto max-h-32">${JSON.stringify(tc.request.params, null, 2)}</pre>
                                            </div>
                                            
                                            ${hasAnomaly ? `
                                            <div class="mt-4">
                                                <h4 class="font-medium text-gray-700 mb-2">检测到的异常 (${tc.anomalies.length})</h4>
                                                <div class="space-y-2">
                                                    ${tc.anomalies.map(a => {
                                                        const c = getSeverityColor(a.severity);
                                                        return `
                                                            <div class="p-3 rounded-lg border ${c.border} bg-white">
                                                                <div class="flex justify-between items-start mb-1">
                                                                    <span class="font-medium text-sm">${a.type}</span>
                                                                    <span class="px-2 py-0.5 rounded text-xs ${c.bg} ${c.text}">${a.severity.toUpperCase()}</span>
                                                                </div>
                                                                <div class="text-sm text-gray-700 mb-1">${a.description}</div>
                                                                <div class="text-xs text-gray-600 bg-gray-50 p-2 rounded code">${a.evidence}</div>
                                                            </div>
                                                        `;
                                                    }).join('')}
                                                </div>
                                            </div>
                                            ` : ''}
                                            
                                            ${tc.request.response_body ? `
                                            <div class="mt-4">
                                                <h4 class="font-medium text-gray-700 mb-2">响应内容</h4>
                                                <pre class="bg-white p-3 rounded-lg text-xs code overflow-auto max-h-48">${typeof tc.request.response_body === 'object' ? JSON.stringify(tc.request.response_body, null, 2) : String(tc.request.response_body).substring(0, 5000)}</pre>
                                            </div>
                                            ` : ''}
                                            
                                            ${tc.request.error ? `
                                            <div class="mt-4 p-3 bg-red-50 border border-red-200 rounded-lg">
                                                <div class="text-sm text-red-800 font-medium">请求错误</div>
                                                <div class="text-sm text-red-700">${tc.request.error}</div>
                                            </div>
                                            ` : ''}
                                            
                                            ${tc.reproduce ? `
                                            <div class="mt-6 border-t pt-4">
                                                <h4 class="font-medium text-gray-800 mb-4 flex items-center">
                                                    <svg class="w-5 h-5 mr-2 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                                                    </svg>
                                                    复现测试
                                                </h4>
                                                
                                                <div class="space-y-4">
                                                    <div>
                                                        <div class="flex justify-between items-center mb-2">
                                                            <span class="text-sm font-medium text-gray-700">curl 命令</span>
                                                            <button onclick="copyToClipboard('curl-${idx}')" class="text-xs text-blue-600 hover:text-blue-800">复制</button>
                                                        </div>
                                                        <div id="curl-${idx}" class="bg-gray-900 text-green-400 p-3 rounded-lg text-xs code overflow-x-auto whitespace-pre-wrap max-h-32">${tc.reproduce.curl_command}</div>
                                                    </div>
                                                    
                                                    <div>
                                                        <div class="flex justify-between items-center mb-2">
                                                            <span class="text-sm font-medium text-gray-700">Python 代码</span>
                                                            <button onclick="copyToClipboard('python-${idx}')" class="text-xs text-blue-600 hover:text-blue-800">复制</button>
                                                        </div>
                                                        <pre id="python-${idx}" class="bg-gray-900 text-blue-400 p-3 rounded-lg text-xs code overflow-x-auto max-h-48">${tc.reproduce.python_code}</pre>
                                                    </div>
                                                    
                                                    <div>
                                                        <div class="flex justify-between items-center mb-2">
                                                            <span class="text-sm font-medium text-gray-700">原始请求</span>
                                                            <button onclick="copyToClipboard('raw-${idx}')" class="text-xs text-blue-600 hover:text-blue-800">复制</button>
                                                        </div>
                                                        <pre id="raw-${idx}" class="bg-gray-100 p-3 rounded-lg text-xs code overflow-x-auto max-h-32">${JSON.stringify(tc.reproduce.raw_request, null, 2)}</pre>
                                                    </div>
                                                </div>
                                            </div>
                                            ` : ''}
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                    
                    <div class="text-center text-sm text-gray-500 pt-8 border-t">
                        <p>报告生成时间: ${formatDate(Date.now() / 1000)}</p>
                        <p class="mt-1">API模糊测试工具自动生成</p>
                    </div>
                </div>
            `;
            
            renderCharts(summary);
        }
        
        function renderCharts(summary) {
            const typeData = summary.type_distribution || {};
            const typeLabels = Object.keys(typeData);
            const typeValues = Object.values(typeData);
            
            const typeColors = {
                'sql_error': '#ef4444',
                'xss_reflection': '#f97316',
                'server_error': '#dc2626',
                'error_message': '#eab308',
                'stack_trace_leak': '#b91c1c',
                'info_leak': '#3b82f6',
                'time_based_anomaly': '#8b5cf6',
                'slow_response': '#f59e0b',
                'request_error': '#6b7280',
                'auth_issue': '#ec4899',
                'empty_response': '#9ca3af'
            };
            
            if (typeLabels.length > 0) {
                new Chart(document.getElementById('typeChart'), {
                    type: 'doughnut',
                    data: {
                        labels: typeLabels,
                        datasets: [{
                            data: typeValues,
                            backgroundColor: typeLabels.map(l => typeColors[l] || '#6b7280'),
                            borderWidth: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: {
                                position: 'right',
                                labels: {
                                    boxWidth: 12,
                                    padding: 10,
                                    font: { size: 11 }
                                }
                            }
                        }
                    }
                });
            }
            
            const sevData = summary.severity_distribution || { high: 0, medium: 0, low: 0 };
            new Chart(document.getElementById('severityChart'), {
                type: 'bar',
                data: {
                    labels: ['高危', '中危', '低危'],
                    datasets: [{
                        label: '异常数量',
                        data: [sevData.high || 0, sevData.medium || 0, sevData.low || 0],
                        backgroundColor: ['#ef4444', '#f59e0b', '#3b82f6'],
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { precision: 0 }
                        }
                    }
                }
            });
        }
        
        function toggleTestCase(idx) {
            const detail = document.getElementById(`detail-${idx}`);
            const arrow = document.getElementById(`arrow-${idx}`);
            detail.classList.toggle('hidden');
            arrow.classList.toggle('rotate-180');
        }
        
        function copyToClipboard(elementId) {
            const element = document.getElementById(elementId);
            const text = element.tagName === 'PRE' || element.tagName === 'DIV' ? element.textContent : element.value;
            
            navigator.clipboard.writeText(text).then(() => {
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = '已复制!';
                btn.classList.add('text-green-600');
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.classList.remove('text-green-600');
                }, 2000);
            }).catch(err => {
                console.error('复制失败:', err);
            });
        }
        
        renderReport();
    </script>
</body>
</html>
