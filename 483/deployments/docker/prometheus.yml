global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "kafka-lag-analyzer"
    static_configs:
      - targets: ["kafka-lag-analyzer:8080"]
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: "kafka"
    static_configs:
      - targets: ["kafka:9101"]
    metrics_path: /metrics
    scrape_interval: 15s
