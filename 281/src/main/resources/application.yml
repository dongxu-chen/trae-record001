server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: file-transfer-system

  datasource:
    url: jdbc:mysql://localhost:3306/file_transfer_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

minio:
  endpoint: http://localhost:9000
  accessKey: minioadmin
  secretKey: minioadmin
  bucketName: file-transfer-bucket

file:
  chunk-size: 5242880
  upload-dir: /tmp/file-upload
  rate-limit:
    enabled: true
    max-upload-speed: 10485760
    max-download-speed: 10485760

user:
  default-quota: 10737418240
