apiVersion: v1
kind: Namespace
metadata:
  name: keymgmt-system

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keymgmt-backend
  namespace: keymgmt-system
  labels:
    app: keymgmt-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: keymgmt-backend
  template:
    metadata:
      labels:
        app: keymgmt-backend
    spec:
      containers:
      - name: backend
        image: keymgmt/backend:latest
        ports:
        - containerPort: 8080
        env:
        - name: VAULT_ADDRESS
          value: "http://vault.keymgmt-system.svc.cluster.local:8200"
        - name: VAULT_TOKEN
          valueFrom:
            secretKeyRef:
              name: vault-token
              key: token
        volumeMounts:
        - name: data
          mountPath: /app/data
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: data
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: keymgmt-backend
  namespace: keymgmt-system
spec:
  selector:
    app: keymgmt-backend
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keymgmt-frontend
  namespace: keymgmt-system
  labels:
    app: keymgmt-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: keymgmt-frontend
  template:
    metadata:
      labels:
        app: keymgmt-frontend
    spec:
      containers:
      - name: frontend
        image: keymgmt/frontend:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: keymgmt-frontend
  namespace: keymgmt-system
spec:
  selector:
    app: keymgmt-frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: ClusterIP
