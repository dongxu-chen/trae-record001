apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app-with-sidecar
  namespace: default
  labels:
    app: my-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      serviceAccountName: default
      containers:
      - name: my-app
        image: nginx:alpine
        ports:
        - containerPort: 80
        env:
        - name: DB_HOST
          value: "localhost"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: my-app-secrets
              key: db-password
              optional: true
      - name: keymgmt-sidecar
        image: keymgmt/sidecar:latest
        ports:
        - containerPort: 8080
        args:
        - "--target=http://localhost:80"
        - "--listen=:8080"
        - "--api-url=http://keymgmt-backend.keymgmt-system.svc.cluster.local:8080"
        - "--poll-interval=30"
        - "--inject-headers=true"
        env:
        - name: API_TOKEN
          valueFrom:
            secretKeyRef:
              name: keymgmt-api-token
              key: token
        volumeMounts:
        - name: secrets-volume
          mountPath: /secrets
          readOnly: true
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      volumes:
      - name: secrets-volume
        csi:
          driver: secrets.keymgmt.io
          volumeAttributes:
            secretName: "my-app-secrets"
            secretNamespace: "default"

---
apiVersion: v1
kind: Service
metadata:
  name: my-app-with-sidecar
  namespace: default
spec:
  selector:
    app: my-app
  ports:
  - name: http
    port: 80
    targetPort: 8080
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-app-ingress
  namespace: default
spec:
  rules:
  - host: my-app.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: my-app-with-sidecar
            port:
              number: 80
